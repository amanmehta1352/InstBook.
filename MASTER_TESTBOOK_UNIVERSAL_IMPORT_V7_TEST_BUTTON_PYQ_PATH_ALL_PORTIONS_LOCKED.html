  const U={
    version:'FINAL_UNIVERSAL_MODULE_TYPE_HIERARCHY_V3.0',
    categoryOrder:['FORMULAS','EASY','MODERATE','TOUGH & MISCELLANEOUS'],
    fallback:'UNCLASSIFIED / SOURCE TYPE'
  };
  const escU=x=>typeof window.esc==='function'?window.esc(x):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const slugU=x=>typeof window.slug==='function'?window.slug(x):String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const allMods=()=>Array.isArray(window.APP?.modules)?window.APP.modules:[];
  const subjFor=m=>typeof window.subjectForModule==='function'?window.subjectForModule(m):(m?.subject||'');
  const topicMatch=(m,subject,topic)=>{
    const t=slugU(topic); return (subject==='science' ? ['physics','chemistry','biology'].includes(m.subject) : m.subject===subject) && (slugU(m.topic)===t||slugU(m.topicTitle)===t);
  };
  const topicModulesU=(subject,topic)=>allMods().filter(m=>topicMatch(m,subject,topic));

  function categoryFor(m){
    const raw=[m?.testType,m?.testTypeTitle,m?.title,m?.description,m?.moduleId].filter(Boolean).join(' ').toLowerCase();
    if(/\bformula(s)?\b|formula[-_ ]?module|formula[-_ ]?type/.test(raw))return 'FORMULAS';
    if(/\beasy\b|\bbasic(?: level)?\b/.test(raw))return 'EASY';
    if(/\bmoderate\b|\bmedium(?: level)?\b/.test(raw))return 'MODERATE';
    if(/\btough\b|\bhard\b|\bdifficult\b|\bmiscellaneous\b|\bmisc\b|\bmixed\b|\badvanced\b/.test(raw))return 'TOUGH & MISCELLANEOUS';
    return U.fallback;
  }
  function typeFor(m){
    const raw=[m?.testTypeTitle,m?.testType,m?.title].filter(Boolean).join(' ');
    const hit=raw.match(/\bType[- ]?(\d+)\b/i);
    if(hit)return 'Type-'+Number(hit[1]);
    if(m?.testTypeTitle)return String(m.testTypeTitle);
    if(m?.testType)return String(m.testType);
    return U.fallback;
  }
  function buildIndex(subject,topic){
    const mods=topicModulesU(subject,topic);
    const cats=new Map();
    mods.forEach(m=>{
      const category=categoryFor(m), type=typeFor(m);
      if(!cats.has(category))cats.set(category,new Map());
      const tm=cats.get(category);
      if(!tm.has(type))tm.set(type,[]);
      tm.get(type).push(m);
    });
    return {mods,cats};
  }
  function orderedCategories(index){
    const out=[];
    U.categoryOrder.forEach(c=>{if(index.cats.has(c))out.push(c)});
    if(index.cats.has(U.fallback))out.push(U.fallback);
    index.cats.forEach((_,c)=>{if(!out.includes(c))out.push(c)});
    return out;
  }
  function catStats(typeMods){
    let groups=0,questions=0; typeMods.forEach(m=>{groups+=(m.groups||[]).length;questions+=(m.groups||[]).reduce((n,g)=>n+(g.questions||[]).length,0)});
    return {types:new Set(typeMods.map(typeFor)).size,groups,questions};
  }
  function categoryRoute(subject,topic,category){return {level:'category',subject,subjectId:subject,topic,topicId:topic,categoryId:slugU(category),categoryName:category};}
  function typeRoute(subject,topic,category,type){return {level:'type',subject,subjectId:subject,topic,topicId:topic,categoryId:slugU(category),categoryName:category,typeId:slugU(type),typeName:type};}
  function groupRoute(m,g,subject,topic,category,type){return {level:'group',moduleId:m.moduleId,groupId:g.groupId,subjectId:subject,topicId:topic,categoryId:slugU(category),typeId:slugU(type),testTypeId:m.testType||''};}
  function crumbsU(parts){return typeof window.crumbs==='function'?window.crumbs(parts):'';}

  function renderTopicU(v,subject,topic){
    const s=APP?.registry?.[subject]; if(!s){return window.render({level:'master'})}
    const title=(APP?.registry?.[subject]?.topics||[]).find(v=>String(v).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')===String(topic).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))||topic;
    const idx=buildIndex(subject,topic);
    const cats=orderedCategories(idx);
    const catCards=cats.map(category=>{
      const tm=[];idx.cats.get(category).forEach(arr=>arr.forEach(m=>tm.push(m)));
      const st=catStats(tm);
      return `<button class="nav-card" onclick='go(${JSON.stringify(categoryRoute(subject,topic,category))})'><strong>📂 ${escU(category)}</strong><small>${st.types} type${st.types===1?'':'s'} • ${st.groups} groups • ${st.questions} questions</small><span class="status available">OPEN</span></button>`;
    }).join('');
    const branch=idx.mods[0]&&typeof window.branchForModule==='function'?window.branchForModule(idx.mods[0]):'';
    const bc=branch&&typeof window.branchTitle==='function'?[ [window.branchTitle(branch),{level:'chapter',subject:'science',chapter:branch}] ]:[];
    v.innerHTML=`<div class="page">${crumbsU([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[s.title,{level:'subject',subject}],...bc,[title,{level:'topic',subject,topic}]])}<section class="hero"><h1>📚 ${escU(title)}</h1><p>Topic → Category → Type → Group → Questions → Final Test</p><div class="stat-row"><div class="stat"><b>Categories</b><span>${cats.length}</span></div><div class="stat"><b>Types</b><span>${new Set(idx.mods.map(typeFor)).size}</span></div><div class="stat"><b>Groups</b><span>${idx.mods.reduce((n,m)=>n+(m.groups||[]).length,0)}</span></div><div class="stat"><b>Questions</b><span>${idx.mods.reduce((n,m)=>n+(m.groups||[]).reduce((a,g)=>a+(g.questions||[]).length,0),0)}</span></div></div></section><section class="section"><div class="section-head"><h2>📂 CATEGORY INDEX</h2><span class="muted">Source metadata preserved • empty categories hidden</span></div><div class="grid">${catCards||'<div class="panel card">No source modules available for this topic.</div>'}</div></section></div>`;
  }

  function renderCategoryU(v,r){
    const idx=buildIndex(r.subject,r.topic),category=Array.from(idx.cats.keys()).find(c=>slugU(c)===slugU(r.categoryName||r.categoryId))||r.categoryName||r.categoryId;
    const typeMap=idx.cats.get(category);if(!typeMap){return renderTopicU(v,r.subject,r.topic)}
    const title=typeof window.topicTitle==='function'?window.topicTitle(r.subject,r.topic):r.topic;
    const types=[];typeMap.forEach((ms,type)=>types.push({type,ms}));
    const cards=types.map(({type,ms})=>{const st=catStats(ms);return `<button class="nav-card" onclick='go(${JSON.stringify(typeRoute(r.subject,r.topic,category,type))})'><strong>🧩 ${escU(type)}</strong><small>${st.groups} groups • ${st.questions} questions</small><span class="status available">OPEN</span></button>`}).join('');
    v.innerHTML=`<div class="page">${crumbsU([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[APP.registry[r.subject].title,{level:'subject',subject:r.subject}],[title,{level:'topic',subject:r.subject,topic:r.topic}],[category,{level:'category',subject:r.subject,topic:r.topic,categoryName:category,categoryId:slugU(category)}]])}<section class="hero"><h1>📂 ${escU(category)}</h1><p>${escU(title)} → Category → Type → Group</p><div class="stat-row"><div class="stat"><b>Types</b><span>${types.length}</span></div><div class="stat"><b>Groups</b><span>${types.reduce((n,x)=>n+catStats(x.ms).groups,0)}</span></div><div class="stat"><b>Questions</b><span>${types.reduce((n,x)=>n+catStats(x.ms).questions,0)}</span></div></div></section><section class="section"><div class="section-head"><h2>🧩 TYPE INDEX</h2><span class="muted">Source-defined types only</span></div><div class="grid">${cards||'<div class="panel card">No source types available.</div>'}</div></section></div>`;
  }

  function renderTypeU(v,r){
    const idx=buildIndex(r.subject,r.topic),category=Array.from(idx.cats.keys()).find(c=>slugU(c)===slugU(r.categoryName||r.categoryId))||r.categoryName||r.categoryId;
    const typeMap=idx.cats.get(category);if(!typeMap)return renderTopicU(v,r.subject,r.topic);
    const type=Array.from(typeMap.keys()).find(t=>slugU(t)===slugU(r.typeName||r.typeId))||r.typeName||r.typeId;
    const ms=typeMap.get(type)||[]; const groups=[];ms.forEach(m=>(m.groups||[]).forEach(g=>groups.push({m,g})));
    const title=typeof window.topicTitle==='function'?window.topicTitle(r.subject,r.topic):r.topic;
    const cards=groups.map(({m,g})=>{const attempted=(g.questions||[]).filter(q=>typeof window.progressFor==='function'&&window.progressFor(m,q).attempts>0).length;return `<button class="nav-card group-card" onclick='go(${JSON.stringify(groupRoute(m,g,r.subject,r.topic,category,type))})'><span class="left"><strong>${escU(g.title)}</strong><small>${escU(m.testTypeTitle||m.testType||type)} • ${(g.questions||[]).length} Questions • ${escU(g.description||'')}</small></span><span class="status available">${attempted}/${(g.questions||[]).length}</span></button>`}).join('');
    v.innerHTML=`<div class="page">${crumbsU([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[APP.registry[r.subject].title,{level:'subject',subject:r.subject}],[title,{level:'topic',subject:r.subject,topic:r.topic}],[category,{level:'category',subject:r.subject,topic:r.topic,categoryName:category,categoryId:slugU(category)}],[type,{level:'type',subject:r.subject,topic:r.topic,categoryName:category,categoryId:slugU(category),typeName:type,typeId:slugU(type)}]])}<section class="hero"><h1>🧩 ${escU(type)}</h1><p>${escU(category)} → ${escU(type)} → Group → Questions → Final Test</p><div class="stat-row"><div class="stat"><b>Groups</b><span>${groups.length}</span></div><div class="stat"><b>Questions</b><span>${groups.reduce((n,x)=>n+(x.g.questions||[]).length,0)}</span></div></div></section><section class="section"><div class="section-head"><h2>📚 GROUP INDEX</h2><span class="muted">Existing groups preserved</span></div><div class="grid">${cards||'<div class="panel card">No source groups available.</div>'}</div></section></div>`;
  }

  function auditIndex(){
    const idx={};
    allMods().forEach(m=>{
      const key=(subjFor(m)||m.subject)+'::'+slugU(m.topic);
      idx[key]=idx[key]||{categories:{}};
      const c=categoryFor(m),t=typeFor(m);idx[key].categories[c]=idx[key].categories[c]||{};idx[key].categories[c][t]=idx[key].categories[c][t]||[];idx[key].categories[c][t].push(m.moduleId);
    });
    return idx;
  }
  window.__MASTER_UNIVERSAL_MODULE_TYPE_INDEX__=auditIndex;
  window.__MASTER_UNIVERSAL_MODULE_TYPE_CATEGORY_FOR__=categoryFor;
  window.__MASTER_UNIVERSAL_MODULE_TYPE_TYPE_FOR__=typeFor;
  window.__MASTER_UNIVERSAL_MODULE_TYPE_CONFIG__=U;

  const previousRender=window.render;
  /* AUTO-FIX: expose immutable APP registry to universal hierarchy router. */
  if (!window.APP) window.APP = APP;

  window.render=function(route){
    if(route?.level==='topic'||route?.level==='category'||route?.level==='type'){ if(typeof closeSheet==='function')closeSheet(); if(typeof closeDrawer==='function')closeDrawer(); }
    if(route?.level==='topic'){
      const v=document.querySelector('#view');if(!v)return previousRender(route);window.R&&(window.R.current=route);v.innerHTML='';renderTopicU(v,route.subject,route.topic);return;
    }
    if(route?.level==='category'){
      const v=document.querySelector('#view');if(!v)return previousRender(route);window.R&&(window.R.current=route);v.innerHTML='';renderCategoryU(v,route);return;
    }
    if(route?.level==='type'){
      const v=document.querySelector('#view');if(!v)return previousRender(route);window.R&&(window.R.current=route);v.innerHTML='';renderTypeU(v,route);return;
    }
    return previousRender(route);
  };
  window.__MASTER_UNIVERSAL_MODULE_TYPE_STRUCTURE_STATUS__='PATCHED';
})();
</script>
<script id="MASTER_QUESTION_STORE_INTEGRATED_V1">
(function(){
"use strict";

/*
 MASTER QUESTION STORE — INTEGRATED MODE
 ---------------------------------------
 IMPORTANT:
 - This does NOT create a second copy of the question bank.
 - Existing APP.modules[].groups[].questions[] remain the physical records.
 - MasterQuestionStore is the authoritative identity/registry/index layer.
 - Every existing question receives one permanent questionId.
 - Paths/categories are indexes over the same question object.
*/

if(window.__MASTER_QUESTION_STORE_INTEGRATED_V1__) return;
window.__MASTER_QUESTION_STORE_INTEGRATED_V1__=true;

const MQS_VERSION="1.0-INTEGRATED";
const MQS_PREFIX="QST-";

function clean(v){return v===null||v===undefined?"":String(v).trim();}
function norm(v){return clean(v).toLowerCase().replace(/\s+/g," ");}
function hash32(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(16).padStart(8,"0").toUpperCase();
}
function sourceIdentity(q,m,g){
  const src=clean(q.sourceId||q.sourceKey||q.sourceReference||q.sourceRef);
  const exam=clean(q.examInfo||q.exam||"");
  const oq=clean(q.originalQNo);
  const explicit=clean(q.masterQuestionId||q.questionId);
  if(explicit) return explicit;
  /*
   Prefer source identity. Module/group path is only the final fallback,
   so moving a question does not normally change its identity.
  */
  const base=(src+"|"+exam+"|"+oq).replace(/\s+/g," ").trim();
  if(base) return MQS_PREFIX+hash32(base);
  const fallback=(clean(q.html&&q.html.match(/id=["']([^"']+)["']/)?.[1])+"|"+oq);
  return MQS_PREFIX+hash32(fallback||((m?.moduleId||"")+(g?.groupId||"")+"|"+oq));
}
function ensureId(q,m,g){
  const id=sourceIdentity(q,m,g);
  if(!q.questionId) q.questionId=id;
  if(!q.masterQuestionId) q.masterQuestionId=id;
  return id;
}

const store={
  version:MQS_VERSION,
  records:new Map(),       // questionId -> {question: existing object, location, metadata}
  indexes:{
    exam:new Map(),year:new Map(),subject:new Map(),topic:new Map(),
    category:new Map(),type:new Map(),group:new Map(),source:new Map()
  },

  register(q,m,g){
    const id=ensureId(q,m,g);
    if(this.records.has(id) && this.records.get(id).question!==q){
      /* Collision: preserve both physical questions; generate a stable suffix
         from their source payload rather than overwriting either record. */
      const salt=clean(q.sourceReference)+"|"+clean(q.originalQNo)+"|"+clean(q.html).slice(0,240);
      const id2=MQS_PREFIX+hash32(id+"|"+salt);
      q.questionId=q.masterQuestionId=id2;
      return this.register(q,m,g);
    }

    const meta={
      questionId:id,
      question:q,             // SAME EXISTING QUESTION OBJECT
      location:{
        moduleId:clean(m?.moduleId),
        groupId:clean(g?.groupId),
        originalQNo:q.originalQNo,
        sourceOrder:q.sourceOrder
      },
      source:{
        sourceId:clean(q.sourceId||q.sourceKey),
        sourceReference:clean(q.sourceReference),
        sourceQNo:clean(q.originalQNo),
        examInfo:clean(q.examInfo)
      },
      classification:{
        subjectId:clean(m?.subject),
        topicId:clean(m?.topic),
        typeId:clean(m?.testType),
        groupId:clean(g?.groupId)
      }
    };
    this.records.set(id,meta);
    return id;
  },

  rebuildIndexes(){
    Object.keys(this.indexes).forEach(k=>this.indexes[k].clear());
    const add=(idx,key,id)=>{
      key=clean(key); if(!key)return;
      if(!idx.has(key))idx.set(key,new Set());
      idx.get(key).add(id);
    };
    this.records.forEach(r=>{
      const q=r.question,m=r.location.moduleId?moduleByIdSafe(r.location.moduleId):null;
      const g=r.location.groupId?groupByIdSafe(r.location.moduleId,r.location.groupId):null;
      add(this.indexes.subject,r.classification.subjectId,r.questionId);
      add(this.indexes.topic,r.classification.topicId,r.questionId);
      add(this.indexes.type,r.classification.typeId,r.questionId);
      add(this.indexes.group,r.classification.groupId,r.questionId);
      add(this.indexes.source,r.source.sourceId||r.source.sourceReference,r.questionId);
      const ei=parseExamInfo(q.examInfo);
      add(this.indexes.exam,ei.exam,r.questionId);
      add(this.indexes.year,ei.year,r.questionId);
    });
  },

  get(id){return this.records.get(clean(id))||null;},
  question(id){return this.get(id)?.question||null;},
  all(){return [...this.records.values()].map(x=>x.question);},
  count(){return this.records.size;},

  /*
   Update existing question IN PLACE.
   No duplicate question is created.
   questionId is immutable.
  */
  update(id,patch){
    const r=this.get(id);
    if(!r)return {ok:false,code:"QUESTION_NOT_FOUND",questionId:id};
    if(patch.questionId && clean(patch.questionId)!==id)
      return {ok:false,code:"IMMUTABLE_QUESTION_ID",questionId:id};

    const q=r.question;
    Object.keys(patch||{}).forEach(k=>{
      if(k==="questionId"||k==="masterQuestionId")return;
      if(k==="metadata" && patch.metadata && typeof patch.metadata==="object"){
        q.metadata=Object.assign(q.metadata||{},patch.metadata);
      }else{
        q[k]=patch[k];
      }
    });
    q.masterVersion=Number(q.masterVersion||1)+1;
    q.updatedAt=new Date().toISOString();
    this.rebuildIndexes();
    return {ok:true,action:"UPDATED_IN_PLACE",questionId:id,version:q.masterVersion,pathRebuildRequired:true};
  },

  /*
   Import/update contract:
   1) find by permanent ID
   2) otherwise find by source identity
   3) otherwise create exactly one physical question record
  */
  upsert(input){
    const id=clean(input.questionId);
    if(id && this.records.has(id)) return this.update(id,input);

    const sourceKey=clean(input.sourceId||input.sourceKey||input.sourceReference);
    if(sourceKey){
      for(const r of this.records.values()){
        if(clean(r.source.sourceId||r.source.sourceReference)===sourceKey &&
           clean(r.source.sourceQNo)===clean(input.originalQNo)){
          return this.update(r.questionId,input);
        }
      }
    }
    return {ok:false,code:"PHYSICAL_INSERT_REQUIRES_IMPORT_ENGINE",message:"Create the question in the existing APP.modules[].groups[].questions[] store, then register it here."};
  },

  paths(id){
    const r=this.get(id); if(!r)return [];
    const q=r.question;
    const paths=[];
    const add=(name,parts)=>paths.push({index:name,questionId:id,path:parts.filter(clean).join(" → ")});
    const ei=parseExamInfo(q.examInfo);
    add("subject",[r.classification.subjectId,r.classification.topicId,r.classification.typeId,r.classification.groupId]);
    add("sourcePYQ",[ei.exam,ei.year,r.classification.subjectId,q.originalQNo]);
    add("topic",[r.classification.topicId,r.classification.typeId,ei.exam,ei.year]);
    return paths;
  },

  report(){
    const ids=[...this.records.keys()];
    const duplicates=ids.filter((id,i)=>ids.indexOf(id)!==i);
    const missing=ids.filter(id=>!id);
    return {
      version:this.version,
      physicalQuestionRecords:this.records.size,
      uniqueQuestionIds:new Set(ids).size,
      duplicateQuestionIds:[...new Set(duplicates)],
      missingQuestionIds:missing,
      singleSourceOfTruth:true,
      duplicateQuestionCopiesCreated:false,
      status:(duplicates.length||missing.length)?"REVIEW":"READY"
    };
  }
};

function moduleByIdSafe(id){
  try{return (window.APP?.modules||[]).find(m=>m.moduleId===id)||null;}catch(e){return null;}
}
function groupByIdSafe(mid,gid){
  const m=moduleByIdSafe(mid); return m?(m.groups||[]).find(g=>g.groupId===gid)||null:null;
}
function parseExamInfo(s){
  s=clean(s);
  const m=s.match(/Exam:\s*\(?([^•\n]+?)(?:\)?\s*•|$)/i);
  const exam=m?clean(m[1]):"";
  const y=s.match(/\b(20\d{2}|19\d{2})\b/);
  return {exam,year:y?y[1]:""};
}

function bootstrap(){
  if(!window.APP || !Array.isArray(APP.modules)) return false;
  store.records.clear();

  APP.modules.forEach(m=>{
    (m.groups||[]).forEach(g=>{
      (g.questions||[]).forEach(q=>store.register(q,m,g));
    });
  });
  store.rebuildIndexes();

  /* Existing app can discover the same question store without replacing APP. */
  window.MasterQuestionStore=store;
  window.MASTER_QUESTION_STORE=store;
  window.MASTER_QUESTION_STORE_VERSION=MQS_VERSION;

  APP.questionStore=store;
  APP.masterQuestionStore=store;

  return true;
}

if(!bootstrap()){
  document.addEventListener("DOMContentLoaded",bootstrap,{once:true});
}
})();
</script>
<script id="phase01-import-input-engine">
(function(){
"use strict";

/* ============================================================
   IMPORT ENGINE — PHASE 01
   INPUT ENGINE
   Accepts:
   - JSON text
   - Structured JSON object/array
   - TXT text (forwarded to parser in Phase 02)
   - HTML text (forwarded to parser in Phase 02)
   Does NOT create question records yet.
   ============================================================ */

const ImportInputEngine = {
  version:"IMPORT-INPUT-V1.0",
  phase:1,
  status:"READY",
  acceptedFormats:["json","txt","html"],
  maxTextLength:20*1024*1024,

  validateInput(input){
    const errors=[];
    if(input===null || input===undefined) errors.push("EMPTY_INPUT");
    if(typeof input==="string" && !input.trim()) errors.push("EMPTY_TEXT");
    if(typeof input==="string" && input.length>this.maxTextLength) errors.push("INPUT_TOO_LARGE");
    return {ok:errors.length===0,errors};
  },

  detectFormat(input,filename){
    const name=String(filename||"").toLowerCase();
    if(/\.json$/.test(name)) return "json";
    if(/\.html?$/.test(name)) return "html";
    if(/\.txt$/.test(name)) return "txt";

    if(typeof input==="object") return "json";
    if(typeof input==="string"){
      const t=input.trim();
      if((t[0]==="{" && t[t.length-1]==="}") ||
         (t[0]==="[" && t[t.length-1]==="]")) return "json";
      if(/<html[\s>]|<body[\s>]|<div[\s>]|<p[\s>]/i.test(t)) return "html";
      return "txt";
    }
    return "unknown";
  },

  normalize(input,filename){
    const check=this.validateInput(input);
    if(!check.ok) return {ok:false,phase:this.phase,errors:check.errors};

    const format=this.detectFormat(input,filename);
    if(!this.acceptedFormats.includes(format)){
      return {ok:false,phase:this.phase,errors:["UNSUPPORTED_FORMAT"],format};
    }

    return {
      ok:true,
      phase:this.phase,
      status:"INPUT_ACCEPTED",
      format,
      filename:String(filename||""),
      rawType:typeof input,
      size:typeof input==="string"?input.length:null,
      payload:input
    };
  },

  preview(input,filename){
    const n=this.normalize(input,filename);
    if(!n.ok) return n;

    let preview="";
    if(typeof input==="string"){
      preview=input.slice(0,500);
    }else{
      preview=JSON.stringify(input).slice(0,500);
    }

    return {
      ok:true,
      phase:this.phase,
      status:"PREVIEW_ONLY",
      format:n.format,
      filename:n.filename,
      size:n.size,
      preview
    };
  },

  ingest(input,filename){
    /* Phase 01 intentionally stops before parsing/committing. */
    const n=this.normalize(input,filename);
    if(!n.ok) return n;

    return {
      ok:true,
      phase:this.phase,
      status:"INPUT_READY_FOR_PHASE_02",
      format:n.format,
      filename:n.filename,
      size:n.size,
      payload:n.payload
    };
  }
};

window.ImportInputEngine=ImportInputEngine;

/* Optional file-picker helper; no question data is stored here. */
window.ImportInputEngine.openFile=function(file){
  return new Promise(function(resolve,reject){
    if(!file) return reject(new Error("NO_FILE"));
    const reader=new FileReader();
    reader.onload=function(){
      resolve(ImportInputEngine.ingest(reader.result,file.name));
    };
    reader.onerror=function(){reject(reader.error||new Error("FILE_READ_ERROR"));};
    reader.readAsText(file);
  });
};

})();
</script>
<script id="phase02-source-parser-engine">
(function(){
"use strict";

/* ============================================================
   IMPORT ENGINE — PHASE 02
   SOURCE PARSER ENGINE
   Parses one source into normalized question candidates.
   DOES NOT create/update Master Question Store records.
   ============================================================ */

const SourceParserEngine = {
  version:"SOURCE-PARSER-V1.0",
  phase:2,

  clean(v){ return v===null||v===undefined ? "" : String(v).replace(/\r/g,"").trim(); },

  parseJSON(input){
    let data=input;
    if(typeof input==="string"){
      try{ data=JSON.parse(input); }
      catch(e){ return {ok:false,errors:["INVALID_JSON"]}; }
    }

    const rows=Array.isArray(data) ? data :
      (Array.isArray(data.questions) ? data.questions :
       (data.question ? [data] : []));

    if(!rows.length) return {ok:false,errors:["NO_QUESTION_RECORDS_FOUND"]};

    return {ok:true,format:"json",candidates:rows.map((q,i)=>this.normalizeObject(q,i+1))};
  },

  normalizeObject(q,index){
    const options=Array.isArray(q.options) ? q.options.map((o,i)=>{
      if(typeof o==="object") return {
        id:this.clean(o.id||o.key||String.fromCharCode(65+i)),
        english:this.clean(o.english||o.text||o.label),
        hindi:this.clean(o.hindi)
      };
      return {id:String.fromCharCode(65+i),english:this.clean(o),hindi:""};
    }) : [];

    return {
      parserIndex:index,
      sourceRecord:q,
      source:{
        sourceId:this.clean(q.sourceId||q.source?.sourceId),
        sourceName:this.clean(q.sourceName||q.source?.sourceName),
        sourceQNo:q.sourceQNo??q.source?.sourceQNo??"",
        sourceVersion:this.clean(q.sourceVersion||q.source?.sourceVersion)
      },
      exam:{
        exam:this.clean(q.exam||q.examName||q.exam?.exam),
        year:this.clean(q.year||q.exam?.year),
        stage:this.clean(q.stage||q.exam?.stage),
        branch:this.clean(q.branch||q.exam?.branch),
        paperDate:this.clean(q.paperDate||q.exam?.paperDate),
        shift:this.clean(q.shift||q.exam?.shift)
      },
      classification:{
        subject:this.clean(q.subject||q.classification?.subject||q.subjectName),
        topic:this.clean(q.topic||q.classification?.topic||q.topicName),
        chapter:this.clean(q.chapter||q.classification?.chapter),
        category:this.clean(q.category||q.classification?.category),
        type:this.clean(q.type||q.classification?.type),
        group:this.clean(q.group||q.groupName||q.classification?.group)
      },
      content:{
        english:this.clean(q.question||q.questionText||q.content?.english),
        hindi:this.clean(q.questionHindi||q.hindi||q.content?.hindi),
        options,
        answer:this.clean(q.answer||q.correctAnswer||q.content?.answer),
        explanation:this.clean(q.explanation||q.content?.explanation)
      }
    };
  },

  parseTXT(input){
    const text=this.clean(input);
    if(!text) return {ok:false,errors:["EMPTY_TEXT"]};

    /* Conservative parser: recognizes common Q-number blocks and A-D options.
       Unknown lines remain in the candidate block instead of being discarded. */
    const lines=text.split("\n").map(x=>x.trim()).filter(Boolean);
    const starts=[];
    const qrx=/^(?:Q(?:uestion)?\.?\s*)?(\d+)\s*[\.\):-]\s*(.+)$/i;

    lines.forEach((line,i)=>{ const m=line.match(qrx); if(m) starts.push({i,no:m[1],text:m[2]}); });

    if(!starts.length){
      return {ok:true,format:"txt",candidates:[this.normalizeObject({
        question:text,sourceQNo:""
      },1)],warnings:["QUESTION_NUMBER_NOT_DETECTED"]};
    }

    const candidates=[];
    starts.forEach((st,idx)=>{
      const end=idx+1<starts.length?starts[idx+1].i:lines.length;
      const block=lines.slice(st.i,end);
      const q= {
        question:st.text,
        sourceQNo:st.no,
        options:[]
      };

      block.slice(1).forEach(line=>{
        const om=line.match(/^[\(\[]?([A-D])[\)\].:\-]\s*(.+)$/i);
        if(om) q.options.push({id:om[1].toUpperCase(),english:om[2]});
        else if(/^(answer|ans)\s*[:\-]/i.test(line)) q.answer=line.split(/[:\-]/).slice(1).join(":").trim();
        else if(/^(explanation|exp)\s*[:\-]/i.test(line)) q.explanation=line.split(/[:\-]/).slice(1).join(":").trim();
      });

      candidates.push(this.normalizeObject(q,idx+1));
    });

    return {ok:true,format:"txt",candidates};
  },

  parseHTML(input){
    const text=this.clean(input);
    if(!text) return {ok:false,errors:["EMPTY_HTML"]};

    const doc=new DOMParser().parseFromString(text,"text/html");
    const rows=[...doc.querySelectorAll("[data-question], .question, .question-card, article")];

    if(rows.length){
      const candidates=rows.map((el,i)=>this.normalizeObject({
        question:el.querySelector("[data-question-text], .question-text, .question-title, h3, h4")?.textContent||el.textContent,
        options:[...el.querySelectorAll("[data-option], .option, li")].slice(0,4).map((x,j)=>({
          id:String.fromCharCode(65+j),english:x.textContent
        }))
      },i+1));
      return {ok:true,format:"html",candidates};
    }

    return {ok:true,format:"html",candidates:[this.normalizeObject({
      question:doc.body?.textContent||text
    },1)],warnings:["QUESTION_CONTAINER_NOT_DETECTED"]};
  },

  parse(input,format){
    const f=(format||window.ImportInputEngine?.detectFormat(input,"")).toLowerCase();
    if(f==="json") return this.parseJSON(input);
    if(f==="txt") return this.parseTXT(input);
    if(f==="html") return this.parseHTML(input);
    return {ok:false,errors:["UNSUPPORTED_FORMAT"]};
  },

  parseInputResult(inputResult){
    if(!inputResult?.ok) return inputResult||{ok:false,errors:["INVALID_INPUT_RESULT"]};
    return this.parse(inputResult.payload,inputResult.format);
  }
};

window.SourceParserEngine=SourceParserEngine;
})();
</script>
<script id="phase03-question-identity-engine">
(function(){
"use strict";
const QuestionIdentityEngine={
 version:"QUESTION-IDENTITY-V1.0", phase:3,
 clean(v){return v===null||v===undefined?"":String(v).trim();},
 fingerprint(candidate){
  const c=candidate||{}, content=c.content||{};
  const opts=Array.isArray(content.options)?content.options.map(o=>
   this.clean(o.id)+":"+this.clean(o.english)+":"+this.clean(o.hindi)).join("|"):"";
  const raw=[this.clean(content.english),this.clean(content.hindi),opts,this.clean(content.answer)].join("||").toLowerCase();
  let h=2166136261;
  for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619);}
  return ("FP-"+(h>>>0).toString(16).padStart(8,"0")).toUpperCase();
 },
 generate(){
  if(window.crypto&&crypto.randomUUID)return "QST-"+crypto.randomUUID().replace(/-/g,"").slice(0,16).toUpperCase();
  return "QST-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,10).toUpperCase();
 },
 resolve(candidate){
  const supplied=this.clean(candidate?.questionId||candidate?.id);
  if(supplied)return {ok:true,action:"USE_EXISTING_ID",questionId:supplied,fingerprint:this.fingerprint(candidate)};
  const fp=this.fingerprint(candidate),store=window.MasterQuestionStore;
  if(store&&typeof store.list==="function"){
   const matches=store.list().filter(q=>this.fingerprint({content:q.content})===fp);
   if(matches.length===1)return {ok:true,action:"MATCH_EXISTING_BY_FINGERPRINT",questionId:matches[0].questionId,fingerprint:fp};
   if(matches.length>1)return {ok:false,action:"REVIEW_MULTIPLE_MATCHES",fingerprint:fp,matches:matches.map(q=>q.questionId)};
  }
  return {ok:true,action:"GENERATE_NEW_ID",questionId:this.generate(),fingerprint:fp};
 },
 preview(candidate){const r=this.resolve(candidate);return {phase:this.phase,status:r.ok?"IDENTITY_RESOLVED":"REVIEW_REQUIRED",...r};}
};
window.QuestionIdentityEngine=QuestionIdentityEngine;
})();
</script>
<script id="phase04-duplicate-match-engine">
(function(){
"use strict";
const DuplicateMatchEngine={
 version:"DUPLICATE-MATCH-V1.0", phase:4,
 clean(v){return v===null||v===undefined?"":String(v).trim();},
 normalizeText(v){return this.clean(v).toLowerCase().replace(/\s+/g," ").replace(/[“”‘’]/g,'"').replace(/[.,!?;:]+/g," ").trim();},
 contentSignature(q){
  const c=q?.content||q||{};
  const opts=Array.isArray(c.options)?c.options.map(o=>this.normalizeText(o?.english||o?.text||"")+"|"+this.normalizeText(o?.hindi||"")).join("||"):"";
  return [this.normalizeText(c.english||c.question||""),this.normalizeText(c.hindi||""),opts,this.normalizeText(c.answer||c.correctAnswer||"")].join("###");
 },
 sourceKey(q){
  const s=q?.source||{};
  const id=this.clean(s.sourceId), no=this.clean(s.sourceQNo);
  return id&&no?id+"::"+no:"";
 },
 find(candidate){
  const store=window.MasterQuestionStore;
  const records=store&&typeof store.list==="function"?store.list():[];
  const id=this.clean(candidate?.questionId||candidate?.id);
  const source=this.sourceKey(candidate);
  const sig=this.contentSignature(candidate);
  if(id){
   const m=records.filter(q=>q.questionId===id);
   if(m.length===1)return {status:"EXISTING_ID",action:"UPDATE_OR_SKIP",questionId:m[0].questionId,matchType:"QUESTION_ID"};
  }
  if(source){
   const m=records.filter(q=>this.sourceKey(q)===source);
   if(m.length===1)return {status:"EXISTING_SOURCE",action:"UPDATE_OR_SKIP",questionId:m[0].questionId,matchType:"SOURCE_ID_AND_QNO"};
   if(m.length>1)return {status:"REVIEW",action:"STOP",reason:"MULTIPLE_SOURCE_MATCHES",matches:m.map(q=>q.questionId)};
  }
  if(sig!=="###"){
   const m=records.filter(q=>this.contentSignature(q)===sig);
   if(m.length===1)return {status:"DUPLICATE_CONTENT",action:"REUSE_EXISTING",questionId:m[0].questionId,matchType:"CONTENT_SIGNATURE"};
   if(m.length>1)return {status:"REVIEW",action:"STOP",reason:"MULTIPLE_CONTENT_MATCHES",matches:m.map(q=>q.questionId)};
  }
  return {status:"NEW",action:"CREATE_NEW",matchType:"NONE"};
 },
 preview(candidate){return {phase:this.phase,version:this.version,result:this.find(candidate)}}
};
window.DuplicateMatchEngine=DuplicateMatchEngine;
})();
</script>
<script id="phase05-metadata-engine">
(function(){
"use strict";

/* ============================================================
   IMPORT ENGINE — PHASE 05
   METADATA ENGINE
   Normalizes metadata without changing question identity.
   ============================================================ */

const MetadataEngine={
 version:"METADATA-V1.0", phase:5,

 clean(v){return v===null||v===undefined?"":String(v).trim();},

 slug(v){
  return this.clean(v).toLowerCase()
   .replace(/&/g," and ")
   .replace(/[^a-z0-9\u0900-\u097f]+/gi,"-")
   .replace(/^-+|-+$/g,"");
 },

 normalize(candidate){
  const c=candidate||{};
  const src=c.source||{}, ex=c.exam||{}, cl=c.classification||{};
  const metadata={
   source:{
    sourceId:this.clean(src.sourceId),
    sourceName:this.clean(src.sourceName),
    sourceQNo:this.clean(src.sourceQNo),
    sourceVersion:this.clean(src.sourceVersion)
   },
   exam:{
    exam:this.clean(ex.exam),
    year:this.clean(ex.year),
    stage:this.clean(ex.stage),
    branch:this.clean(ex.branch),
    paperDate:this.clean(ex.paperDate),
    shift:this.clean(ex.shift)
   },
   classification:{
    subject:this.clean(cl.subject),
    topic:this.clean(cl.topic),
    chapter:this.clean(cl.chapter),
    category:this.clean(cl.category),
    type:this.clean(cl.type),
    group:this.clean(cl.group)
   }
  };

  metadata.keys={
   examKey:this.slug(metadata.exam.exam),
   yearKey:this.slug(metadata.exam.year),
   subjectKey:this.slug(metadata.classification.subject),
   topicKey:this.slug(metadata.classification.topic),
   chapterKey:this.slug(metadata.classification.chapter),
   categoryKey:this.slug(metadata.classification.category),
   typeKey:this.slug(metadata.classification.type),
   groupKey:this.slug(metadata.classification.group)
  };

  metadata.pathHints=[
   metadata.exam.exam,
   metadata.exam.year,
   metadata.classification.subject,
   metadata.classification.topic,
   metadata.classification.chapter,
   metadata.classification.category,
   metadata.classification.type,
   metadata.classification.group
  ].filter(Boolean);

  return {
   phase:this.phase,
   version:this.version,
   questionId:this.clean(c.questionId||c.id),
   metadata
  };
 },

 validate(candidate){
  const r=this.normalize(candidate), m=r.metadata;
  const warnings=[];
  if(!m.exam.exam) warnings.push("EXAM_MISSING");
  if(!m.exam.year) warnings.push("YEAR_MISSING");
  if(!m.classification.subject) warnings.push("SUBJECT_MISSING");
  if(!m.classification.topic && !m.classification.chapter) warnings.push("TOPIC_OR_CHAPTER_MISSING");
  if(!m.classification.category) warnings.push("CATEGORY_MISSING");
  return {
   ...r,
   valid:warnings.length===0,
   warnings
  };
 }
};

window.MetadataEngine=MetadataEngine;
})();
</script>
<script id="phase06-validation-accuracy-gate">
(function(){
"use strict";

/* ============================================================
   IMPORT ENGINE — PHASE 06
   VALIDATION / ACCURACY GATE
   Read-only gate: validates parsed question before commit.
   It does not mutate the Master Question Store.
   ============================================================ */

const ValidationAccuracyGate={
 version:"VALIDATION-GATE-V1.0", phase:6,

 clean(v){return v===null||v===undefined?"":String(v).trim();},

 validate(candidate){
  const q=candidate||{}, c=q.content||{}, m=q.classification||{}, e=q.exam||{}, s=q.source||{};
  const errors=[], warnings=[];

  const question=this.clean(c.english||c.hindi);
  if(!question) errors.push("QUESTION_TEXT_MISSING");

  const options=Array.isArray(c.options)?c.options:[];
  if(options.length<2) errors.push("OPTIONS_INSUFFICIENT");
  if(options.length>0 && options.length<4) warnings.push("LESS_THAN_FOUR_OPTIONS");

  const optionIds=options.map(o=>this.clean(o.id).toUpperCase()).filter(Boolean);
  if(new Set(optionIds).size!==optionIds.length) errors.push("DUPLICATE_OPTION_ID");

  const answer=this.clean(c.answer).toUpperCase();
  if(answer && options.length && !optionIds.includes(answer) &&
     !options.some(o=>this.clean(o.english).toUpperCase()===answer)){
    warnings.push("ANSWER_NOT_MATCHING_OPTION_ID");
  }
  if(!answer) warnings.push("ANSWER_MISSING");
  if(!this.clean(c.english)) warnings.push("ENGLISH_MISSING");
  if(!this.clean(c.hindi)) warnings.push("HINDI_MISSING");

  if(!this.clean(e.exam)) warnings.push("EXAM_MISSING");
  if(!this.clean(e.year)) warnings.push("YEAR_MISSING");
  if(!this.clean(m.subject)) warnings.push("SUBJECT_MISSING");
  if(!this.clean(m.topic) && !this.clean(m.chapter)) warnings.push("TOPIC_OR_CHAPTER_MISSING");
  if(!this.clean(s.sourceId) && !this.clean(s.sourceName)) warnings.push("SOURCE_ID_OR_NAME_MISSING");

  const status=errors.length ? "BLOCKED" : (warnings.length ? "REVIEW" : "PASS");

  return {
    phase:this.phase,
    version:this.version,
    status,
    commitAllowed:status==="PASS" || status==="REVIEW",
    hardErrors:errors,
    warnings,
    checks:{
      questionText:!!question,
      optionsAtLeastTwo:options.length>=2,
      optionIdsUnique:new Set(optionIds).size===optionIds.length,
      answerPresent:!!answer,
      englishPresent:!!this.clean(c.english),
      hindiPresent:!!this.clean(c.hindi),
      examPresent:!!this.clean(e.exam),
      yearPresent:!!this.clean(e.year),
      subjectPresent:!!this.clean(m.subject),
      topicOrChapterPresent:!!(this.clean(m.topic)||this.clean(m.chapter))
    }
  };
 }
};

window.ValidationAccuracyGate=ValidationAccuracyGate;
})();
</script>
<script id="phase07-master-store-commit-engine">
(function(){
"use strict";

/* ============================================================
   IMPORT ENGINE — PHASE 07
   MASTER QUESTION STORE COMMIT ENGINE
   One canonical question record. Updates never create a second
   copy when the same questionId exists.
   ============================================================ */

const MasterStoreCommitEngine={
 version:"MASTER-STORE-COMMIT-V1.0", phase:7,

 clean(v){return v===null||v===undefined?"":String(v).trim();},

 ensureStore(){
  if(!window.MasterQuestionStore){
   window.MasterQuestionStore={
    _records:[],
    list(){return this._records.slice();},
    get(id){return this._records.find(q=>q.questionId===id)||null;},
    save(record){
     const i=this._records.findIndex(q=>q.questionId===record.questionId);
     if(i>=0)this._records[i]=record;
     else this._records.push(record);
     return record;
    }
   };
  }
  return window.MasterQuestionStore;
 },

 buildRecord(candidate, identity, metadata){
  const c=candidate||{};
  return {
   questionId:this.clean(identity?.questionId||c.questionId||c.id),
   identity:{
    questionId:this.clean(identity?.questionId||c.questionId||c.id),
    fingerprint:this.clean(identity?.fingerprint)
   },
   content:{
    english:this.clean(c.content?.english),
    hindi:this.clean(c.content?.hindi),
    options:Array.isArray(c.content?.options)?c.content.options.map(o=>({
     id:this.clean(o.id),
     english:this.clean(o.english),
     hindi:this.clean(o.hindi)
    })) : [],
    answer:this.clean(c.content?.answer),
    explanation:this.clean(c.content?.explanation)
   },
   source:c.source||{},
   exam:c.exam||{},
   classification:c.classification||{},
   metadata:metadata||{},
   system:{
    createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(),
    schemaVersion:"MASTER-QUESTION-V1"
   }
  };
 },

 commit(candidate,identityResult,metadataResult){
  const store=this.ensureStore();
  const id=this.clean(identityResult?.questionId||candidate?.questionId||candidate?.id);
  if(!id)return {ok:false,status:"BLOCKED",reason:"QUESTION_ID_REQUIRED"};

  const record=this.buildRecord(candidate,identityResult,metadataResult?.metadata||metadataResult||{});
  const existing=store.get(id);

  if(existing){
   record.system.createdAt=existing.system?.createdAt||record.system.createdAt;
   record.system.updatedAt=new Date().toISOString();
   store.save(record);
   return {ok:true,status:"UPDATED",action:"UPDATE_EXISTING",questionId:id,record};
  }

  store.save(record);
  return {ok:true,status:"CREATED",action:"CREATE_CANONICAL_RECORD",questionId:id,record};
 },

 preview(candidate,identityResult,metadataResult){
  const id=this.clean(identityResult?.questionId||candidate?.questionId||candidate?.id);
  if(!id)return {ok:false,status:"BLOCKED",reason:"QUESTION_ID_REQUIRED"};
  const store=this.ensureStore();
  const existing=store.get(id);
  return {
   phase:this.phase,
   version:this.version,
   status:existing?"UPDATED":"CREATED",
   action:existing?"UPDATE_EXISTING":"CREATE_CANONICAL_RECORD",
   questionId:id
  };
 }
};

window.MasterStoreCommitEngine=MasterStoreCommitEngine;
})();
</script>
<script id="phase08-path-resolver-engine">
(function(){
"use strict";

/* ============================================================
   IMPORT ENGINE — PHASE 08
   PATH RESOLVER / AUTO PLACEMENT ENGINE
   Question identity remains independent from placement.
   ============================================================ */

const PathResolverEngine={
 version:"PATH-RESOLVER-V1.0", phase:8,

 clean(v){return v===null||v===undefined?"":String(v).trim();},

 slug(v){
  return this.clean(v).toLowerCase()
   .replace(/&/g," and ")
   .replace(/[^a-z0-9\u0900-\u097f]+/gi,"-")
   .replace(/^-+|-+$/g,"");
 },

 resolve(candidate){
  const c=candidate||{}, e=c.exam||{}, m=c.classification||{};
  const exam=this.clean(e.exam), year=this.clean(e.year);
  const subject=this.clean(m.subject), topic=this.clean(m.topic);
  const chapter=this.clean(m.chapter), category=this.clean(m.category);
  const type=this.clean(m.type), group=this.clean(m.group);

  const segments=[exam,year,subject,topic,chapter,category,type,group].filter(Boolean);
  const path=segments.map(x=>this.slug(x)).filter(Boolean);

  return {
   phase:this.phase,
   version:this.version,
   questionId:this.clean(c.questionId||c.id),
   status:path.length?"RESOLVED":"REVIEW",
   path,
   pathString:path.join(" → "),
   components:{
    exam,year,subject,topic,chapter,category,type,group
   },
   warnings:[
    !exam?"EXAM_MISSING":"",
    !year?"YEAR_MISSING":"",
    !subject?"SUBJECT_MISSING":"",
    (!topic&&!chapter)?"TOPIC_OR_CHAPTER_MISSING":"",
    !category?"CATEGORY_MISSING":""
   ].filter(Boolean)
  };
 }
};

window.PathResolverEngine=PathResolverEngine;
})();
</script>
<script id="phase09-registry-index-engine">
(function(){
"use strict";

/* ============================================================
   IMPORT ENGINE — PHASE 09
   REGISTRY / INDEX ENGINE
   Maintains derived indexes from the canonical Master Store.
   Indexes are references only; they do not duplicate question
   records and do not become the question identity.
   ============================================================ */

const RegistryIndexEngine={
 version:"REGISTRY-INDEX-V1.0", phase:9,

 clean(v){return v===null||v===undefined?"":String(v).trim();},

 key(v){
  return this.clean(v).toLowerCase()
   .replace(/\s+/g," ")
   .replace(/[|>]/g,"/")
   .trim();
 },

 build(records){
  const list=Array.isArray(records)?records:[];
  const registry={
   byQuestionId:{},
   byPath:{},
   byExam:{},
   bySubject:{},
   byTopic:{},
   byYear:{},
   bySource:{}
  };

  const add=(bucket,key,id)=>{
   key=this.key(key);
   if(!key)return;
   if(!bucket[key])bucket[key]=[];
   if(!bucket[key].includes(id))bucket[key].push(id);
  };

  list.forEach(q=>{
   const id=this.clean(q.questionId||q.identity?.questionId);
   if(!id)return;

   registry.byQuestionId[id]=id;

   const m=q.classification||{}, e=q.exam||{}, s=q.source||{};
   const md=q.metadata||{};

   const path=Array.isArray(md.pathHints)?md.pathHints.filter(Boolean).join(" → "):
     [e.exam,e.year,m.subject,m.topic,m.chapter,m.category,m.type,m.group].filter(Boolean).join(" → ");

<script id="phase10-safe-transaction-engine">
(function(){
"use strict";

/* ============================================================
   IMPORT ENGINE — PHASE 10
   SAFE IMPORT TRANSACTION ENGINE
   Stages changes in memory, validates them, then commits as one
   transaction. On failure, the previous store remains intact.
   ============================================================ */

const SafeTransactionEngine={
 version:"SAFE-TRANSACTION-V1.0", phase:10,

 clone(v){
  if(typeof structuredClone==="function") return structuredClone(v);
  return JSON.parse(JSON.stringify(v));
 },

 store(){
  if(window.MasterQuestionStore &&
     typeof window.MasterQuestionStore.list==="function" &&
     typeof window.MasterQuestionStore.save==="function") return window.MasterQuestionStore;

  if(!window.MasterQuestionStore){
   window.MasterQuestionStore={
    _records:[],
    list(){return this._records.slice();},
    get(id){return this._records.find(q=>q.questionId===id)||null;},
    save(record){
     const i=this._records.findIndex(q=>q.questionId===record.questionId);
     if(i>=0)this._records[i]=record;
     else this._records.push(record);
     return record;
    }
   };
  }
  return window.MasterQuestionStore;
 },

 begin(){
  const store=this.store();
  return {
   transactionId:"TX-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,8).toUpperCase(),
   snapshot:this.clone(store.list()),
   staged:this.clone(store.list()),
   status:"OPEN"
  };
 },

 stage(tx,record){
  if(!tx||tx.status!=="OPEN") return {ok:false,status:"BLOCKED",reason:"TRANSACTION_NOT_OPEN"};
  if(!record?.questionId) return {ok:false,status:"BLOCKED",reason:"QUESTION_ID_REQUIRED"};

  const i=tx.staged.findIndex(q=>q.questionId===record.questionId);
  if(i>=0) tx.staged[i]=this.clone(record);
  else tx.staged.push(this.clone(record));

  return {ok:true,status:"STAGED",questionId:record.questionId,total:tx.staged.length};
 },

 validate(tx){
  if(!tx||tx.status!=="OPEN") return {ok:false,status:"BLOCKED",reason:"TRANSACTION_NOT_OPEN"};

  const errors=[];
  const ids=new Set();

  tx.staged.forEach(q=>{
   if(!q.questionId) errors.push("QUESTION_ID_REQUIRED");
   if(ids.has(q.questionId)) errors.push("DUPLICATE_QUESTION_ID:"+q.questionId);
   ids.add(q.questionId);
  });

  return {
   ok:errors.length===0,
   status:errors.length?"BLOCKED":"PASS",
   errors,
   stagedCount:tx.staged.length
  };
 },

 commit(tx){
  const check=this.validate(tx);
  if(!check.ok) return {ok:false,status:"BLOCKED",errors:check.errors,rolledBack:true};

  const store=this.store();
  try{
   /* Replace canonical store only after the complete staged set passes. */
   store._records=this.clone(tx.staged);
   tx.status="COMMITTED";
   return {
    ok:true,status:"COMMITTED",
    transactionId:tx.transactionId,
    total:store.list().length
   };
  }catch(e){
   store._records=this.clone(tx.snapshot);
   tx.status="ROLLED_BACK";
   return {
    ok:false,status:"ROLLED_BACK",
    transactionId:tx.transactionId,
    error:String(e)
   };
  }
 },

 rollback(tx){
  if(!tx)return {ok:false,status:"BLOCKED",reason:"TRANSACTION_MISSING"};
  const store=this.store();
  store._records=this.clone(tx.snapshot);
  tx.status="ROLLED_BACK";
  return {ok:true,status:"ROLLED_BACK",transactionId:tx.transactionId,total:store.list().length};
 },

 run(records){
  const tx=this.begin();
  (Array.isArray(records)?records:[]).forEach(r=>this.stage(tx,r));
  const result=this.commit(tx);
  return {transactionId:tx.transactionId,result};
 }
};

window.SafeTransactionEngine=SafeTransactionEngine;
})();
</script>
