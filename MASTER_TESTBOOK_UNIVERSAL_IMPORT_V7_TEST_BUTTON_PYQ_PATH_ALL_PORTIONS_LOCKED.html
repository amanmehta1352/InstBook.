<script id="MASTER_DUAL_QUESTION_PATH_ENGINE_V1">
(function(){
  'use strict';
  if(window.__MASTER_DUAL_QUESTION_PATH_ENGINE_V1__) return;
  window.__MASTER_DUAL_QUESTION_PATH_ENGINE_V1__=true;

  const META_KEY='MASTER_QUESTION_PATH_REGISTRY_V1';
  const MAX_GROUP=20;
  const DIFFICULTIES=['EASY','MODERATE','TOUGH'];
  const BASES=['THEORY','NUMERICAL'];
  const clean=v=>v==null?'':String(v).trim();
  const arr=v=>Array.isArray(v)?v:[];
  const slug=v=>clean(v).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9\u0900-\u097f]+/gi,'-').replace(/^-+|-+$/g,'');
  const title=v=>clean(v);
  const clone=v=>JSON.parse(JSON.stringify(v));
  const splitPath=v=>Array.isArray(v)?v.map(clean).filter(Boolean):clean(v).split(/[>\/]/).map(clean).filter(Boolean);
  const normalizeDifficulty=v=>{const x=clean(v).toUpperCase();if(x==='BASIC'||x==='EASY')return 'EASY';if(x==='MEDIUM'||x==='MODERATE')return 'MODERATE';if(x==='HARD'||x==='TOUGH')return 'TOUGH';return x};
  const normalizeBase=v=>{const x=clean(v).toUpperCase();if(x==='NUMERIC'||x==='NUMERICAL')return 'NUMERICAL';if(x==='THEORETICAL'||x==='THEORY')return 'THEORY';return x};
  let cache=null;

  async function db(){
    if(window.MasterQuestionIndexedDB?.openDB) return window.MasterQuestionIndexedDB.openDB();
    return null;
  }
  async function load(){
    if(cache) return clone(cache);
    const fallback={version:1,updatedAt:null,questions:{}};
    try{
      const d=await db();
      if(d){
        const tx=d.transaction(['metadata'],'readonly');
        const row=await new Promise((res,rej)=>{const r=tx.objectStore('metadata').get(META_KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('PATH_REGISTRY_READ_FAILED'));});
        if(row?.value){cache=row.value;return clone(cache);}
      }
    }catch(e){}
    try{const x=JSON.parse(localStorage.getItem(META_KEY)||'null');if(x){cache=x;return clone(cache);}}catch(e){}
    cache=fallback;return clone(cache);
  }
  async function save(reg){
    reg=reg&&typeof reg==='object'?reg:{version:1,questions:{}};
    reg.version=1;reg.updatedAt=new Date().toISOString();
    const d=await db();
    if(!d) throw new Error('IndexedDB unavailable: path registry cannot be persisted.');
    const tx=d.transaction(['metadata'],'readwrite');
    tx.objectStore('metadata').put({key:META_KEY,value:reg,updatedAt:reg.updatedAt});
    await new Promise((res,rej)=>{tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error||new Error('PATH_REGISTRY_SAVE_FAILED'));tx.onabort=()=>rej(tx.error||new Error('PATH_REGISTRY_SAVE_ABORTED'));});
    cache=clone(reg);
    window.dispatchEvent(new CustomEvent('master:question-paths-saved',{detail:clone(reg)}));
    window.dispatchEvent(new CustomEvent('master:structure-saved',{detail:{pathRegistry:true}}));
    try{window.LiveStructureRouter?.refresh?.();window.LiveStructureIntegration?.refresh?.();}catch(e){}
    return true;
  }
  function ensure(reg,id){id=clean(id);if(!id)throw new Error('masterQuestionId is required.');if(!reg.questions[id])reg.questions[id]={masterQuestionId:id,subjectPath:[],pyqPath:[],updatedAt:null};return reg.questions[id];}
  function setPath(reg,id,type,path,meta){const q=ensure(reg,id),parts=splitPath(path);if(!parts.length)throw new Error(type+' cannot be empty.');q[type==='SUBJECT_PATH'?'subjectPath':'pyqPath']=parts;q.updatedAt=new Date().toISOString();if(meta&&typeof meta==='object')q.meta={...(q.meta||{}),...clone(meta)};return q;}
  function clearPath(reg,id,type){const q=ensure(reg,id);if(!type||type==='SUBJECT_PATH')q.subjectPath=[];if(!type||type==='PYQ_PATH')q.pyqPath=[];q.updatedAt=new Date().toISOString();return q;}
  function getPath(id){return cache?.questions?.[id]||null;}
  function buildSubjectPath(q){
    const c=q?.classification||{}, base=normalizeBase(q?.questionsBase||q?.questionBase||c.questionBase||c.base), diff=normalizeDifficulty(q?.difficulty||c.difficulty), group=clean(q?.groupId||c.group);
    const parts=[c.subject,c.topic,c.chapter,base,diff,group].filter(Boolean);
    return parts.length>=2?parts:[];
  }
  function buildPyqPath(q){
    const e=q?.exam||{};const c=q?.classification||{};const parts=[e.exam||e.examName,e.year,c.subject,c.topic||c.chapter].filter(Boolean);return parts.length>=2?parts:[];
  }
  async function ensureFromQuestion(q){
    const id=clean(q?.masterQuestionId||q?.questionId||q?.id);if(!id)return null;
    const reg=await load();const row=ensure(reg,id);let changed=false;
    if(!row.subjectPath.length){const p=buildSubjectPath(q);if(p.length){row.subjectPath=p;changed=true;}}
    if(!row.pyqPath.length){const p=buildPyqPath(q);if(p.length){row.pyqPath=p;changed=true;}}
    if(changed)await save(reg);return clone(row);
  }
  function pathString(p){return arr(p).join(' / ');}
  function validatePath(p){return arr(p).every(Boolean);}

  window.MasterQuestionPathRegistry={
    version:'1.0',maxGroupQuestions:MAX_GROUP,difficulties:DIFFICULTIES.slice(),questionBases:BASES.slice(),
    load,save,get:async id=>{const r=await load();return clone(r.questions?.[clean(id)]||null)},getAll:async()=>{const r=await load();return clone(r.questions||{})},
    setSubjectPath:async(id,path,meta)=>{const r=await load();setPath(r,id,'SUBJECT_PATH',path,meta);await save(r);return r.questions[id]},
    setPyqPath:async(id,path,meta)=>{const r=await load();setPath(r,id,'PYQ_PATH',path,meta);await save(r);return r.questions[id]},
    setQuestionPath:async(id,subjectPath,pyqPath,meta)=>{const r=await load();setPath(r,id,'SUBJECT_PATH',subjectPath,meta);setPath(r,id,'PYQ_PATH',pyqPath,meta);await save(r);return r.questions[id]},
    clearPath:async(id,type)=>{const r=await load();clearPath(r,id,type);await save(r);return r.questions[id]},
    ensureFromQuestion,
    pathString,
    buildSubjectPath,
    buildPyqPath,
    validatePath,
    status:async()=>{const r=await load();return {ok:true,version:r.version,questionCount:Object.keys(r.questions||{}).length,storage:'IndexedDB',key:META_KEY}}
  };

  function normalizeOp(o){
    const x={...(o||{})};
    x.op=clean(x.op||x.operation||x.command||x.action).toUpperCase().replace(/[\s-]+/g,'_');
    x.masterQuestionId=clean(x.masterQuestionId||x.master_question_id||x.questionId||x.question_id||x.id);
    if(x.subjectPath==null)x.subjectPath=x.subject_path;
    if(x.pyqPath==null)x.pyqPath=x.pyq_path;
    if(x.path==null)x.path=x.segments||x.target;
    return x;
  }
  function parseDualPrompt(text){
    const raw=clean(text);if(!raw)throw new Error('Prompt is empty.');
    let t=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
    if(t.startsWith('{')||t.startsWith('[')){
      const j=JSON.parse(t);const ops=Array.isArray(j)?j:(j.operations||j.changes||j.MASTER_STRUCTURE_UPDATE_V1?.operations||[]);if(!Array.isArray(ops))throw new Error('operations must be an array.');return ops.map(normalizeOp);
    }
    const lines=t.split('\n').map(x=>x.trim()).filter(Boolean),ops=[];let cur=null;
    const supported=/^(SET_(?:SUBJECT_PATH|PYQ_PATH|QUESTION_PATH)|CLEAR_(?:SUBJECT_PATH|PYQ_PATH|QUESTION_PATH)|ADD_PATH|UPDATE_PATH|DELETE_PATH|MOVE_PATH)$/i;
    const finish=()=>{if(cur){ops.push(normalizeOp(cur));cur=null;}};
    lines.forEach(line=>{if(/^END$/i.test(line)){finish();return;}if(supported.test(line)){finish();cur={op:line.toUpperCase()};return;}const m=line.match(/^([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.*)$/);if(m&&cur)cur[m[1]]=m[2];});finish();if(!ops.length)throw new Error('No supported path commands found.');return ops;
  }
  async function applyDualOperations(operations){
    const reg=await load();const results=[];
    for(const raw of operations){
      const o=normalizeOp(raw),op=o.op,id=o.masterQuestionId;
      if(/^SET_SUBJECT_PATH$/.test(op)){if(!id)throw new Error(op+' requires masterQuestionId.');setPath(reg,id,'SUBJECT_PATH',o.subjectPath??o.path??o.segments,o.meta);results.push('SET_SUBJECT_PATH '+id);continue;}
      if(/^SET_PYQ_PATH$/.test(op)){if(!id)throw new Error(op+' requires masterQuestionId.');setPath(reg,id,'PYQ_PATH',o.pyqPath??o.path??o.segments,o.meta);results.push('SET_PYQ_PATH '+id);continue;}
      if(/^SET_QUESTION_PATH$/.test(op)){if(!id)throw new Error(op+' requires masterQuestionId.');setPath(reg,id,'SUBJECT_PATH',o.subjectPath,o.meta);setPath(reg,id,'PYQ_PATH',o.pyqPath,o.meta);results.push('SET_QUESTION_PATH '+id);continue;}
      if(/^CLEAR_SUBJECT_PATH$/.test(op)){clearPath(reg,id,'SUBJECT_PATH');results.push('CLEAR_SUBJECT_PATH '+id);continue;}
      if(/^CLEAR_PYQ_PATH$/.test(op)){clearPath(reg,id,'PYQ_PATH');results.push('CLEAR_PYQ_PATH '+id);continue;}
      if(/^CLEAR_QUESTION_PATH$/.test(op)){clearPath(reg,id);results.push('CLEAR_QUESTION_PATH '+id);continue;}
    }
    await save(reg);return {ok:true,results,registry:clone(reg)};
  }

  window.MasterQuestionPathPromptEngine={version:'1.0',parse:parseDualPrompt,apply:applyDualOperations};

  // Extend the existing Structure Builder without replacing its architecture.
  const oldApply=window.MasterStructureBuilder?.applyPrompt;
  if(window.MasterStructureBuilder){
    window.MasterStructureBuilder.applyPrompt=async function(text,save=true){
      const raw=clean(text);
      const ops=parseDualPrompt(raw);
      const dual=ops.some(o=>/^(SET_|CLEAR_)/.test(o.op));
      if(dual)return applyDualOperations(ops);
      if(typeof oldApply==='function')return oldApply.call(window.MasterStructureBuilder,text,save);
      throw new Error('Existing Structure Builder prompt engine is unavailable.');
    };
    const oldParse=window.MasterStructureBuilder.parsePrompt;
    window.MasterStructureBuilder.parsePrompt=function(text){
      try{return parseDualPrompt(text)}catch(e){return typeof oldParse==='function'?oldParse.call(window.MasterStructureBuilder,text):{error:e.message,operations:[]};}
    };
  }

  // Expose live path information to routing/drawer/breadcrumb layers.
  window.MasterLiveQuestionPath={
    get:async id=>window.MasterQuestionPathRegistry.get(id),
    format:async id=>{const x=await window.MasterQuestionPathRegistry.get(id);return x?{subjectPath:pathString(x.subjectPath),pyqPath:pathString(x.pyqPath)}:null;},
    refresh:()=>{try{window.LiveStructureRouter?.refresh?.();window.LiveStructureIntegration?.refresh?.();}catch(e){}}
  };

  // Add path information to question breadcrumbs without changing canonical question data.
  const originalRenderQuestion=window.renderQuestion;
  if(typeof originalRenderQuestion==='function'&&!originalRenderQuestion.__dualPathWrapped){
    const wrapped=async function(v,moduleId,groupId,qIndex){
      const result=originalRenderQuestion.apply(this,arguments);
      try{
        const m=typeof window.moduleById==='function'?window.moduleById(moduleId):null;const g=m?.groups?.find(x=>x.groupId===groupId);const q=g?.questions?.[Number(qIndex)||0];const id=q?.masterQuestionId||q?.questionId;
        if(id){await ensureFromQuestion(q);const p=await window.MasterQuestionPathRegistry.get(id);if(p){setTimeout(()=>{const shell=document.querySelector('.question-shell');if(!shell)return;let el=shell.querySelector('.master-question-paths');if(!el){el=document.createElement('div');el.className='master-question-paths';shell.insertBefore(el,shell.firstChild);}el.innerHTML='<div><b>SUBJECT PATH</b><span>'+esc(pathString(p.subjectPath))+'</span></div><div><b>PYQ PATH</b><span>'+esc(pathString(p.pyqPath))+'</span></div>';},0);}}
      }catch(e){}
      return result;
    };
    wrapped.__dualPathWrapped=true;window.renderQuestion=wrapped;
  }

  // Safe group helper: groups are references only and never contain more than 20 IDs.
  window.MasterQuestionGroupEngine={
    version:'1.0',maxQuestionsPerGroup:MAX_GROUP,
    split:function(ids){const a=arr(ids);const out=[];for(let i=0;i<a.length;i+=MAX_GROUP)out.push({groupId:'G-'+String(out.length+1).padStart(2,'0'),masterQuestionIds:a.slice(i,i+MAX_GROUP)});return out;},
    validate:function(groups){return arr(groups).every(g=>arr(g.masterQuestionIds||g.questionRefs).length<=MAX_GROUP);}
  };
})();
</script>

<script id="MASTER_QUESTION_CANONICAL_DUAL_PATH_V2">
(function(){
  'use strict';
  if(window.__MASTER_QUESTION_CANONICAL_DUAL_PATH_V2__) return;
  window.__MASTER_QUESTION_CANONICAL_DUAL_PATH_V2__=true;

  const clean=v=>v==null?'':String(v).trim();
  const arr=v=>Array.isArray(v)?v.filter(x=>clean(x)):[];
  const slug=v=>clean(v).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9\\u0900-\\u097f]+/gi,'-').replace(/^-+|-+$/g,'');
  const title=v=>clean(v);
  const normBase=v=>{const x=clean(v).toUpperCase(); if(['NUMERIC','NUMERICAL','CALCULATION','CALCULATIVE'].includes(x))return 'Numerical'; if(['THEORY','THEORETICAL','CONCEPTUAL'].includes(x))return 'Theory'; return title(v);};
  const normDiff=v=>{const x=clean(v).toUpperCase(); if(['BASIC','EASY'].includes(x))return 'Easy'; if(['MEDIUM','MODERATE'].includes(x))return 'Moderate'; if(['HARD','TOUGH','DIFFICULT'].includes(x))return 'Tough'; return title(v);};
  const normPath=p=>Array.isArray(p)?p.map(title).filter(Boolean):clean(p).split(/[>\\/]/).map(title).filter(Boolean);

  function getQuestionId(q){
    return clean(q?.masterQuestionId||q?.questionId||q?.identity?.questionId||q?.id);
  }

  function buildSubjectPathV2(q){
    const c=q?.classification||{};
    const subject=title(c.subject||q?.subject||q?.subjectId);
    const topic=title(c.topic||q?.topic||q?.topicId||c.chapter||q?.chapter);
    const base=normBase(q?.questionsBase||q?.questionBase||c.questionsBase||c.questionBase||c.base||c.type);
    const difficulty=normDiff(q?.difficulty||c.difficulty);
    const group=title(q?.groupId||c.group||c.groupId);
    return [subject,topic,base,difficulty,group].filter(Boolean);
  }

  function buildPyqPathV2(q){
    const e=q?.exam||{};
    const c=q?.classification||{};
    const exam=title(e.exam||e.examName||q?.examName||q?.exam);
    const year=title(e.year||q?.year);
    const subject=title(c.subject||q?.subject||q?.subjectId);
    const topic=title(c.topic||q?.topic||q?.topicId||c.chapter||q?.chapter);
    return [exam,year,subject,topic].filter(Boolean);
  }

  function makeGroup(index){return 'G-'+String(Math.floor(Number(index||0)/20)+1).padStart(2,'0');}

  function mapReferenceQuestion(q,index){
    const id=getQuestionId(q);
    const subjectPath=buildSubjectPathV2(q);
    if(!subjectPath[4]) subjectPath[4]=makeGroup(index);
    const pyqPath=buildPyqPathV2(q);
    return {
      masterQuestionId:id,
      QUESTION_ID:id,
      SUBJECT_PATH:subjectPath,
      PYQ_PATH:pyqPath,
      sourceQuestionNo:clean(q?.source?.questionNo||q?.sourceQuestionNo||q?.questionNo||q?.originalQuestionNo),
      source:q?.source||{},
      classification:q?.classification||{},
      exam:q?.exam||{}
    };
  }

  window.MasterQuestionCanonicalPathV2={
    version:'2.0',
    architecture:'ONE MASTER QUESTION -> ONE QUESTION_ID -> SUBJECT_PATH + PYQ_PATH',
    maxQuestionsPerGroup:20,
    buildSubjectPath:buildSubjectPathV2,
    buildPyqPath:buildPyqPathV2,
    groupForIndex:makeGroup,
    mapReferenceQuestion,
    normalizePath:normPath,
    validate(record){
      const r=record||{};
      return {
        questionId:!!clean(r.QUESTION_ID||r.masterQuestionId),
        subjectPath:arr(r.SUBJECT_PATH).length===5,
        pyqPath:arr(r.PYQ_PATH).length===4,
        valid:!!clean(r.QUESTION_ID||r.masterQuestionId)&&arr(r.SUBJECT_PATH).length===5&&arr(r.PYQ_PATH).length===4
      };
    }
  };

  // Override only path construction; canonical question records remain untouched.
  if(window.MasterQuestionPathRegistry){
    window.MasterQuestionPathRegistry.buildSubjectPath=buildSubjectPathV2;
    window.MasterQuestionPathRegistry.buildPyqPath=buildPyqPathV2;
    window.MasterQuestionPathRegistry.groupForIndex=makeGroup;
    window.MasterQuestionPathRegistry.mapReferenceQuestion=mapReferenceQuestion;
  }

  window.dispatchEvent(new CustomEvent('master:canonical-dual-path-v2-ready'));
})();
</script>


<script id="MASTER_GROUP_ISOLATION_ENGINE_V2">
(function(){
  'use strict';
  if(window.__MASTER_GROUP_ISOLATION_ENGINE_V2__) return;
  window.__MASTER_GROUP_ISOLATION_ENGINE_V2__=true;
  const MAX=20;
  function repair(){
    try{
      const mods=Array.isArray(window.APP?.modules)?window.APP.modules:[];
      mods.forEach(m=>{
        if(!Array.isArray(m.groups)) return;
        const flat=m.groups.flatMap(g=>Array.isArray(g.questions)?g.questions:[]);
        if(!flat.length) return;
        const rebuilt=[];
        for(let i=0;i<flat.length;i+=MAX){
          const n=rebuilt.length+1;
          rebuilt.push({groupId:'g-'+String(n).padStart(2,'0'),originalGroupNo:n,sourceOrder:n,title:'G-'+String(n).padStart(2,'0'),description:`Group ${n} • ${Math.min(MAX,flat.length-i)} questions (MAX 20)`,questions:flat.slice(i,i+MAX)});
        }
        m.groups=rebuilt;
      });
      return mods.every(m=>m.groups.every(g=>(g.questions||[]).length<=MAX));
    }catch(e){return false;}
  }
  window.MasterQuestionGroupIsolation={maxQuestionsPerGroup:MAX,repair,validate:()=>repair()};
})();
</script>

<script id="master-sequential-test-flow-v1">
(function(){
  'use strict';
  if(window.__MASTER_SEQUENTIAL_TEST_FLOW_V1__)return;
  window.__MASTER_SEQUENTIAL_TEST_FLOW_V1__=true;

  const escS=x=>typeof window.esc==='function'?window.esc(x):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const getMG=(mid,gid)=>{const m=typeof moduleById==='function'?moduleById(mid):APP?.modules?.find(x=>x.moduleId===mid);const g=m?.groups?.find(x=>x.groupId===gid);return {m,g}};
  const key=(m,g)=>'TEST::'+m.moduleId+'::'+g.groupId;
  const ensureStores=()=>{user.testSessions=user.testSessions||{};user.testResults=user.testResults||{};user.testAttempts=user.testAttempts||{}};
  const durationMs=()=>Math.max(1,Number(user.settings?.testDuration||user.settings?.examDuration)||30)*60000;

  function newSession(m,g,settings){
    ensureStores();
    const old=user.testSessions[key(m,g)];
    if(old && !old.submitted && Number(old.startedAt)>0 && Number(old.duration)>0) return old;
    const now=Date.now();
    const s={
      sessionId:key(m,g)+'::'+now+'::'+Math.random().toString(36).slice(2),
      moduleId:m.moduleId,groupId:g.groupId,startedAt:now,lastTick:now,
      duration:Number(settings.durationMs)||durationMs(),answers:{},marked:{},times:{},
      submitted:false,submittedAt:null,language:settings.language||'bilingual',
      negativeMarking:Number(settings.negativeMarking)||0,questionIds:(g.questions||[]).map(q=>q.originalQNo),
      questionOrder:(g.questions||[]).map(q=>q.originalQNo)
    };
    user.testSessions[key(m,g)]=s; if(typeof save==='function')save();
    return s;
  }

  function clearTestVisual(){
    if(window.__masterTestTimer){clearInterval(window.__masterTestTimer);window.__masterTestTimer=null}
    if(window.__immersiveTestTimer){clearInterval(window.__immersiveTestTimer);window.__immersiveTestTimer=null}
    document.body.classList.remove('immersive-active');
  }

  function renderLanguage(v,mid,gid){
    const {m,g}=getMG(mid,gid);if(!m||!g||!g.questions?.length){v.innerHTML='<div class="page"><section class="stf-card"><h2>Test unavailable</h2><p class="stf-muted">No questions are available in this selected group.</p><button class="btn primary" onclick="go({level:\'master\'},true)">← Back to Master</button></section></div>';return}
    const existing=user.testSessions?.[key(m,g)];
    const resume=!!(existing&&!existing.submitted);
    const selected=existing?.language||user.settings?.languageDisplay||'bilingual';
    v.innerHTML=`<div class="stf-wrap">
      <section class="stf-card"><div class="stf-title">📝 ${escS(m.topicTitle||m.topic)} — ${escS(g.title)}</div><div class="stf-muted">FINAL TEST • ${g.questions.length} Questions</div></section>
      <section class="stf-card"><div class="stf-step"><span class="num">1</span><span>Select Language</span></div>
        <div class="stf-choice">
          <button type="button" data-stf-lang="bilingual" class="${selected==='bilingual'?'active':''}">English + Hindi</button>
          <button type="button" data-stf-lang="english" class="${selected==='english'?'active':''}">English Only</button>
          <button type="button" data-stf-lang="hindi" class="${selected==='hindi'?'active':''}">Hindi Only</button>
        </div>
        <div class="stf-actions"><button class="btn" id="stfBack">← Back</button><button class="btn primary" id="stfStart">${resume?'▶ Resume Test':'START TEST →'}</button></div>
      </section>
    </div>`;
    let lang=selected;
    v.querySelectorAll('[data-stf-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.stfLang;v.querySelectorAll('[data-stf-lang]').forEach(x=>x.classList.toggle('active',x===b));});
    $('#stfBack').onclick=()=>go({level:'group',moduleId:mid,groupId:gid});
    $('#stfStart').onclick=()=>{user.settings=user.settings||{};user.settings.languageDisplay=lang;const s=newSession(m,g,{language:lang,durationMs:existing?.duration||durationMs(),negativeMarking:existing?.negativeMarking||0});s.lastTick=Date.now();if(typeof save==='function')save();go({level:'testInitializer',moduleId:mid,groupId:gid,testSession:true},true)};
  }

  function renderInitializer(v,mid,gid){
    const {m,g}=getMG(mid,gid);if(!m||!g)return go({level:'master'},true);
    const s=newSession(m,g,{language:user.settings?.languageDisplay||'bilingual',durationMs:durationMs(),negativeMarking:0});
    s.lastTick=Date.now();if(typeof save==='function')save();
    v.innerHTML=`<div class="stf-wrap"><section class="stf-card stf-loading"><div><div class="stf-spinner"></div><h2>Preparing Test…</h2><p class="stf-muted">Loading ${g.questions.length} questions • Creating attempt • Starting timer</p></div></section></div>`;
    setTimeout(()=>go({level:'question',moduleId:mid,groupId:gid,qIndex:0,testSession:true},true),80);
  }

  function renderQuestionSafe(v,mid,gid,index){
    const {m,g}=getMG(mid,gid);if(!m||!g||!g.questions?.length){v.innerHTML='<div class="page"><section class="stf-card"><h2>Question data unavailable</h2><button class="btn primary" onclick="go({level:\'master\'},true)">Back to Master</button></section></div>';return}
    const s=user.testSessions?.[key(m,g)];
    if(!s){go({level:'testLanguage',moduleId:mid,groupId:gid},true);return}
    if(s.submitted){go({level:'testResult',moduleId:mid,groupId:gid},true);return}
    const i=Math.max(0,Math.min(Number(index)||0,g.questions.length-1));const q=g.questions[i];
    const left=Math.max(0,Number(s.duration||durationMs())-(Date.now()-Number(s.startedAt||Date.now())));
    if(left<=0){if(typeof window.submitTest==='function'){window.__activeQuestion={m,g,q,qIndex:i,testMode:true};window.submitTest(true)}return}
    let html='';try{html=typeof injectAnswerState==='function'?injectAnswerState(q.html,m,q,'test'):String(q.html||'')}catch(e){html=String(q.html||'')}
    if(!html.trim())html='<div class="stf-card"><b>Question content is empty.</b><p class="stf-muted">Source question record exists, but its rendered HTML is empty.</p></div>';
    const ans=String(s.answers?.[q.originalQNo]||'').toUpperCase();
    const dots=g.questions.map((x,j)=>`<button type="button" class="question-dot ${j===i?'current ':''}${s.answers?.[x.originalQNo]?'answered ':''}${s.marked?.[x.originalQNo]?'marked':''}" data-stf-q="${j}">${escS(x.originalQNo)}</button>`).join('');
    clearTestVisual();document.body.classList.add('immersive-active');
    v.innerHTML=`<div class="page immersive-test-exam mode-test" id="immersiveTestRoot">
      <section class="immersive-header"><div class="timer-block"><div class="timer-ring" id="stfTimerRing"><span></span></div><div><div class="time-main" id="stfTime">${fmt(left)}</div><span class="time-label">TIME LEFT</span></div></div><div class="test-title">${escS(m.topicTitle||m.topic)} • ${escS(g.title)}<small>TEST MODE • Q.${escS(q.originalQNo)}</small></div><div class="header-actions"><button type="button" class="immersive-btn language-btn" id="stfLang">EN/अ</button><button type="button" class="immersive-btn danger" id="stfSubmit">SUBMIT</button></div></section>
      <div class="question-strip">${dots}</div>
      <div class="status-bar"><span class="status-pill" id="stfQTime">Q-TIME 00:00</span><span class="status-spacer"></span><span class="status-pill" id="stfStatus">${Object.keys(s.answers||{}).length}/${g.questions.length} answered</span><button type="button" class="immersive-btn ${s.marked?.[q.originalQNo]?'marked':''}" id="stfMark">${s.marked?.[q.originalQNo]?'★':'☆'}</button></div>
      <section class="immersive-question-card"><div class="it-qmeta-row"><span class="it-qbadge">Q.${escS(q.originalQNo)}</span><span>${i+1}/${g.questions.length} • TEST</span></div><div id="stfMount" class="question-source">${html}</div></section>
      <div class="immersive-bottom"><button type="button" class="bottom-btn" id="stfPrev" ${i===0?'disabled':''}>Previous</button><span class="bottom-counter">Q.${escS(q.originalQNo)} / ${g.questions.length}</span><button type="button" class="bottom-btn bottom-next" id="stfNext">${i===g.questions.length-1?'Submit':'Save & Next'}</button></div>
    </div>`;
    window.__activeQuestion={m,g,q,qIndex:i,testMode:true};
    if(ans)document.querySelectorAll('#stfMount input[type=radio]').forEach(x=>x.checked=String(x.value).toUpperCase()===ans);
    const qStarted=Date.now();
    const tick=()=>{const now=Date.now();const elapsed=Math.max(0,now-Number(s.lastTick||now));s.times[q.originalQNo]=Number(s.times[q.originalQNo]||0)+elapsed;s.lastTick=now;const rem=Math.max(0,Number(s.duration||durationMs())-(now-Number(s.startedAt||now)));const t=$('#stfTime');if(t)t.textContent=fmt(rem);const qt=$('#stfQTime');if(qt)qt.textContent='Q-TIME '+fmt(Number(s.times[q.originalQNo]||0)+(now-qStarted));const st=$('#stfStatus');if(st)st.textContent=Object.keys(s.answers||{}).length+'/'+g.questions.length+' answered';if(rem<=0){clearInterval(window.__masterTestTimer);if(typeof window.submitTest==='function')window.submitTest(true)}};
    document.querySelectorAll('#stfMount input[type=radio]').forEach(inp=>inp.addEventListener('change',()=>{s.answers[q.originalQNo]=String(inp.value).toUpperCase();s.lastTick=Date.now();if(typeof save==='function')save();}));
    document.querySelectorAll('[data-stf-q]').forEach(b=>b.onclick=()=>go({level:'question',moduleId:mid,groupId:gid,qIndex:Number(b.dataset.stfQ),testSession:true}));
    $('#stfPrev').onclick=()=>{if(i>0)go({level:'question',moduleId:mid,groupId:gid,qIndex:i-1,testSession:true})};
    $('#stfNext').onclick=()=>{if(i<g.questions.length-1)go({level:'question',moduleId:mid,groupId:gid,qIndex:i+1,testSession:true});else if(typeof requestTestSubmit==='function')requestTestSubmit()};
    $('#stfSubmit').onclick=()=>typeof requestTestSubmit==='function'&&requestTestSubmit();
    $('#stfMark').onclick=()=>{s.marked[q.originalQNo]=!s.marked[q.originalQNo];if(typeof save==='function')save();renderQuestionSafe(v,mid,gid,i)};
    $('#stfLang').onclick=()=>{const root=$('#immersiveTestRoot');root.classList.toggle('lang-en')};
    window.__masterTestTimer=setInterval(tick,1000);tick();
  }
  const fmt=ms=>{ms=Math.max(0,Math.floor(Number(ms||0)/1000));return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0')};

  const oldStart=window.startFinalTest;
  window.startFinalTest=function(mid,gid){clearTestVisual();const {m,g}=getMG(mid,gid);if(!m||!g)return typeof oldStart==='function'?oldStart(mid,gid):go({level:'master'});go({level:'testLanguage',moduleId:mid,groupId:gid},false)};

  const baseRender=window.render;
  window.render=function(route){
    if(route?.level==='testInstructions')route={...route,level:'testLanguage'};
    if(route?.level==='testLanguage'){R.current=route;const v=document.querySelector('#view');if(v){v.innerHTML='';closeDrawer?.();closeSheet?.();$('#topCrumb').textContent='TEST';renderLanguage(v,route.moduleId,route.groupId)}return}
    if(route?.level==='testInitializer'){R.current=route;const v=document.querySelector('#view');if(v){v.innerHTML='';closeDrawer?.();closeSheet?.();$('#topCrumb').textContent='TEST';renderInitializer(v,route.moduleId,route.groupId)}return}
    if(route?.level==='question'&&route?.testSession){R.current=route;const v=document.querySelector('#view');if(v){v.innerHTML='';closeDrawer?.();closeSheet?.();renderQuestionSafe(v,route.moduleId,route.groupId,route.qIndex||0)}return}
    return baseRender(route);
  };

  window.__MASTER_T03_REMOVED__=true;
  window.__MASTER_SEQUENTIAL_FLOW_STATUS__='T03_REMOVED • LANGUAGE → INITIALIZER → QUESTION • SAFE_RENDER_V1';
})();
</script>

<script id="master-test-theme-bridge-v1-js">
(function(){
  'use strict';
  if(window.__MASTER_TEST_THEME_BRIDGE_V1__) return;
  window.__MASTER_TEST_THEME_BRIDGE_V1__=true;

  function syncTestTheme(){
    const root=document.querySelector('.immersive-test-exam');
    if(!root) return;
    const dark=document.body.classList.contains('dark');
    root.classList.toggle('theme-dark',dark);
    root.classList.toggle('theme-light',!dark);
    root.setAttribute('data-theme',dark?'dark':'light');
  }

  window.__syncMasterTestTheme=syncTestTheme;

  const originalApplyTheme=window.applyTheme;
  if(typeof originalApplyTheme==='function'){
    window.applyTheme=function(){
      const r=originalApplyTheme.apply(this,arguments);
      syncTestTheme();
      return r;
    };
  }

  const originalRender=window.render;
  if(typeof originalRender==='function'){
    window.render=function(route){
      const r=originalRender.apply(this,arguments);
      setTimeout(syncTestTheme,0);
      return r;
    };
  }

  const observer=new MutationObserver(function(){syncTestTheme()});
  observer.observe(document.body,{attributes:true,attributeFilter:['class']});
  document.addEventListener('DOMContentLoaded',syncTestTheme,{once:true});
  setTimeout(syncTestTheme,0);
})();
</script>


<script id="master-click-flow-repair-v2">
/* ============================================================
   MASTER TESTBOOK — CLICK-BY-CLICK TEST FLOW REPAIR V2
   Scope: TEST QUESTION FLOW ONLY.
   Geometry / dimensions / existing visual CSS are LOCKED.
   Flow: Question → Next → Previous → Submit → Result.
   Theme remains controlled only by the existing global theme control.
   ============================================================ */
(function(){
  'use strict';
  if(window.__MASTER_CLICK_FLOW_REPAIR_V2__) return;
  window.__MASTER_CLICK_FLOW_REPAIR_V2__=true;

  const escF=x=>typeof window.esc==='function'?window.esc(x):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const getMG=(mid,gid)=>{
    const m=typeof window.moduleById==='function'?window.moduleById(mid):null;
    const g=m?.groups?.find(x=>String(x.groupId)===String(gid));
    return {m,g};
  };
  const testKey=(m,g)=>'TEST::'+m.moduleId+'::'+g.groupId;
  const ensure=()=>{
    user.testSessions=user.testSessions||{};
    user.testResults=user.testResults||{};
    user.testAttempts=user.testAttempts||{};
  };
  const stopTimer=()=>{
    if(window.__masterTestTimer){clearInterval(window.__masterTestTimer);window.__masterTestTimer=null}
    if(window.__immersiveTestTimer){clearInterval(window.__immersiveTestTimer);window.__immersiveTestTimer=null}
  };
  const cleanRouteUI=()=>{
    try{closeDrawer?.();closeSheet?.()}catch(e){}
    const v=document.querySelector('#view');
    if(v)v.innerHTML='';
  };

  /* Hard guarantee: an active test session is always available before Q1. */
  function ensureSession(m,g){
    ensure();
    const k=testKey(m,g);
    let s=user.testSessions[k];
    if(!s || s.submitted){
      const now=Date.now();
      const duration=Math.max(1,Number(user.settings?.testDuration||user.settings?.examDuration)||30)*60000;
      s={
        sessionId:k+'::'+now+'::'+Math.random().toString(36).slice(2),
        moduleId:m.moduleId,groupId:g.groupId,
        startedAt:now,lastTick:now,duration,
        answers:{},marked:{},times:{},submitted:false,submittedAt:null,
        language:user.settings?.languageDisplay||'bilingual',negativeMarking:0,
        questionIds:g.questions.map(q=>q.originalQNo),
        questionOrder:g.questions.map(q=>q.originalQNo)
      };
      user.testSessions[k]=s;
      save();
    }
    return s;
  }

  function renderSafeQuestion(v,mid,gid,index){
    const {m,g}=getMG(mid,gid);
    if(!m||!g||!Array.isArray(g.questions)||!g.questions.length){
      v.innerHTML='<div class="page"><section class="stf-card"><h2>Question data unavailable</h2><button class="btn primary" type="button" id="flowBackMaster">Back to Master</button></section></div>';
      const b=document.getElementById('flowBackMaster'); if(b)b.onclick=()=>go({level:'master'},true);
      return;
    }
    const s=ensureSession(m,g);
    if(s.submitted){go({level:'testResult',moduleId:mid,groupId:gid},true);return;}
    const i=Math.max(0,Math.min(Number(index)||0,g.questions.length-1));
    const q=g.questions[i];
    const remaining=Math.max(0,Number(s.duration||1800000)-(Date.now()-Number(s.startedAt||Date.now())));
    if(remaining<=0){
      window.__activeQuestion={m,g,q,qIndex:i,testMode:true};
      if(typeof window.submitTest==='function')window.submitTest(true);
      return;
    }

    let html='';
    try{html=typeof window.injectAnswerState==='function'?window.injectAnswerState(q.html,m,q,'test'):String(q.html||'')}catch(e){html=String(q.html||'')}
    if(!String(html).trim()) html='<div class="stf-card"><b>Question content is empty.</b></div>';

    stopTimer();
    document.body.classList.add('immersive-active');
    const answer=String(s.answers?.[q.originalQNo]||'').toUpperCase();
    const dots=g.questions.map((x,j)=>
      '<button type="button" class="question-dot '+(j===i?'current ':'')+(s.answers?.[x.originalQNo]?'answered ':'')+(s.marked?.[x.originalQNo]?'marked':'')+'" data-flow-q="'+j+'">'+escF(x.originalQNo)+'</button>'
    ).join('');

    /* EXACT existing immersive geometry/classes retained. */
    v.innerHTML=`<div class="page immersive-test-exam mode-test" id="immersiveTestRoot">
      <section class="immersive-header"><div class="timer-block"><div class="timer-ring" id="stfTimerRing"><span></span></div><div><div class="time-main" id="stfTime">${fmtFlow(remaining)}</div><span class="time-label">TIME LEFT</span></div></div><div class="test-title">${escF(m.topicTitle||m.topic)} • ${escF(g.title)}<small>TEST MODE • Q.${escF(q.originalQNo)}</small></div><div class="header-actions"><button type="button" class="immersive-btn language-btn" id="stfLang">EN/अ</button><button type="button" class="immersive-btn danger" id="stfSubmit">SUBMIT</button></div></section>
      <div class="question-strip">${dots}</div>
      <div class="status-bar"><span class="status-pill" id="stfQTime">Q-TIME 00:00</span><span class="status-spacer"></span><span class="status-pill" id="stfStatus">${Object.keys(s.answers||{}).length}/${g.questions.length} answered</span><button type="button" class="immersive-btn ${s.marked?.[q.originalQNo]?'marked':''}" id="stfMark">${s.marked?.[q.originalQNo]?'★':'☆'}</button></div>
      <section class="immersive-question-card"><div class="it-qmeta-row"><span class="it-qbadge">Q.${escF(q.originalQNo)}</span><span>${i+1}/${g.questions.length} • TEST</span></div><div id="stfMount" class="question-source">${html}</div></section>
      <div class="immersive-bottom"><button type="button" class="bottom-btn" id="stfPrev" ${i===0?'disabled':''}>Previous</button><span class="bottom-counter">Q.${escF(q.originalQNo)} / ${g.questions.length}</span><button type="button" class="bottom-btn bottom-next" id="stfNext">${i===g.questions.length-1?'Submit':'Next'}</button></div>
    </div>`;

    window.__activeQuestion={m,g,q,qIndex:i,testMode:true};
    if(answer){
      document.querySelectorAll('#stfMount input[type="radio"]').forEach(x=>x.checked=String(x.value).toUpperCase()===answer);
    }

    document.querySelectorAll('#stfMount input[type="radio"]').forEach(inp=>inp.addEventListener('change',()=>{
      const ss=ensureSession(m,g);
      ss.answers[q.originalQNo]=String(inp.value).toUpperCase();
      ss.lastTick=Date.now();
      save();
      const st=document.getElementById('stfStatus');
      if(st)st.textContent=Object.keys(ss.answers||{}).length+'/'+g.questions.length+' answered';
      document.querySelectorAll('[data-flow-q]').forEach((d,j)=>{if(j===i)d.classList.add('answered')});
    }));

    document.querySelectorAll('[data-flow-q]').forEach(btn=>btn.onclick=()=>{
      const target=Number(btn.dataset.flowQ);
      if(Number.isInteger(target))go({level:'question',moduleId:mid,groupId:gid,qIndex:target,testSession:true});
    });

    const prev=document.getElementById('stfPrev');
    if(prev)prev.onclick=()=>{if(i>0)go({level:'question',moduleId:mid,groupId:gid,qIndex:i-1,testSession:true})};

    const next=document.getElementById('stfNext');
    if(next)next.onclick=()=>{
      if(i<g.questions.length-1){
        go({level:'question',moduleId:mid,groupId:gid,qIndex:i+1,testSession:true});
      }else if(typeof window.requestTestSubmit==='function'){
        window.requestTestSubmit();
      }
    };

    const submit=document.getElementById('stfSubmit');
    if(submit)submit.onclick=()=>typeof window.requestTestSubmit==='function'&&window.requestTestSubmit();

    const mark=document.getElementById('stfMark');
    if(mark)mark.onclick=()=>{
      const ss=ensureSession(m,g);
      ss.marked[q.originalQNo]=!ss.marked[q.originalQNo];
      save();
      renderSafeQuestion(v,mid,gid,i);
    };

    const lang=document.getElementById('stfLang');
    if(lang)lang.onclick=()=>{
      const root=document.getElementById('immersiveTestRoot');
      if(root)root.classList.toggle('lang-en');
      if(typeof window.__syncMasterTestTheme==='function')window.__syncMasterTestTheme();
    };

    const started=Date.now();
    window.__masterTestTimer=setInterval(()=>{
      const ss=ensureSession(m,g);
      const now=Date.now();
      const elapsed=Math.max(0,now-Number(ss.lastTick||now));
      ss.times[q.originalQNo]=Number(ss.times[q.originalQNo]||0)+elapsed;
      ss.lastTick=now;
      const left=Math.max(0,Number(ss.duration||1800000)-(now-Number(ss.startedAt||now)));
      const t=document.getElementById('stfTime'); if(t)t.textContent=fmtFlow(left);
      const qt=document.getElementById('stfQTime'); if(qt)qt.textContent='Q-TIME '+fmtFlow(Number(ss.times[q.originalQNo]||0)+(now-started));
      if(left<=0){stopTimer();window.__activeQuestion={m,g,q,qIndex:i,testMode:true};if(typeof window.submitTest==='function')window.submitTest(true);}
    },1000);

    if(typeof window.__syncMasterTestTheme==='function')window.__syncMasterTestTheme();
  }

  function fmtFlow(ms){
    ms=Math.max(0,Math.floor(Number(ms||0)/1000));
    return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0');
  }

  /* One final route gate. All non-test routes continue through the existing router. */
  const previousRender=window.render;
  window.render=function(route){
    const level=route?.level;
    if(level==='testInitializer'){
      R.current=route; cleanRouteUI();
      const v=document.querySelector('#view');
      if(v){
        const {m,g}=getMG(route.moduleId,route.groupId);
        if(!m||!g||!g.questions?.length){
          v.innerHTML='<div class="page"><section class="stf-card"><h2>Test unavailable</h2><p>No questions are available in this selected group.</p></section></div>';
        }else{
          const s=ensureSession(m,g);
          s.lastTick=Date.now();save();
          v.innerHTML='<div class="stf-wrap"><section class="stf-card stf-loading"><div><div class="stf-spinner"></div><h2>Preparing Test…</h2><p class="stf-muted">Loading '+g.questions.length+' questions • Creating attempt • Starting timer</p></div></section></div>';
          setTimeout(()=>go({level:'question',moduleId:route.moduleId,groupId:route.groupId,qIndex:0,testSession:true},true),80);
        }
      }
      return;
    }
    if(level==='question'&&route?.testSession){
      R.current=route; cleanRouteUI();
      const v=document.querySelector('#view');
      if(v)renderSafeQuestion(v,route.moduleId,route.groupId,route.qIndex||0);
      return;
    }
    return previousRender.apply(this,arguments);
  };

  /* Ensure start always enters the same deterministic path. */
  const oldStart=window.startFinalTest;
  window.startFinalTest=function(mid,gid){
    const {m,g}=getMG(mid,gid);
    if(!m||!g||!g.questions?.length){return typeof oldStart==='function'?oldStart(mid,gid):go({level:'master'},true)}
    stopTimer();
    ensure();
    go({level:'testLanguage',moduleId:mid,groupId:gid},false);
  };

  /* Runtime diagnostic — no UI mutation unless explicitly called. */
  window.__verifyMasterTestFlow=function(){
    const a=window.__activeQuestion;
    const checks={
      router:typeof window.render==='function',
      start:typeof window.startFinalTest==='function',
      next:!!document.getElementById('stfNext'),
      previous:!!document.getElementById('stfPrev'),
      submit:!!document.getElementById('stfSubmit'),
      activeQuestion:!!a?.testMode,
      session:!!(a&&user.testSessions&&user.testSessions[testKey(a.m,a.g)]),
      themeControl:typeof window.applyTheme==='function'
    };
    return {ok:Object.values(checks).every(Boolean),checks,route:R.current||null};
  };
  window.__MASTER_CLICK_FLOW_STATUS__='REPAIRED_V2 • QUESTION → NEXT → PREVIOUS → SUBMIT → RESULT';
})();
</script>

<script id="master-phase-01-to-05-final-gate-js">
(function(){
  'use strict';
  if(window.__MASTER_PHASE_01_TO_05_FINAL_GATE__) return;
  window.__MASTER_PHASE_01_TO_05_FINAL_GATE__=true;

  /*
   * DATA LOCK:
   * This gate reads existing APP.modules / groups / questions only.
   * It never creates, rewrites, or substitutes question data.
   */
  function isTestRoute(route){
    return !!(route && (
      route.testSession === true ||
      route.level === 'testInitializer' ||
      route.level === 'testResult'
    ));
  }

  function isActiveTestQuestion(route){
    return !!(route && route.level === 'question' && route.testSession === true);
  }

  function syncFocus(route){
    const active=isActiveTestQuestion(route);
    const inTest=isTestRoute(route);

    document.body.classList.toggle('test-focus-mode',active);
    document.body.classList.toggle('immersive-active',active);

    /*
     * Result / initializer must not inherit the active question focus shell.
     * Normal navigation is restored on every non-active-test route.
     */
    if(!active){
      document.body.classList.remove('test-focus-mode');
      if(!inTest) document.body.classList.remove('immersive-active');
    }

    const bottom=document.getElementById('tbBottomNav');
    const top=document.getElementById('appTop');
    if(bottom) bottom.style.display=active?'none':'';
    if(top) top.style.display=active?'none':'';
  }

  /*
   * Phase 01 — Navigation stability:
   * Observe every router transition without replacing its behavior.
   */
  const oldGo=window.go;
  if(typeof oldGo==='function'){
    window.go=function(route,replace){
      syncFocus(route);
      const result=oldGo.apply(this,arguments);
      setTimeout(function(){syncFocus(window.R?.current||route)},0);
      return result;
    };
  }

  /*
   * Phase 02/03/04/05 — state validation helpers.
   * These helpers are diagnostic only and do not mutate the store.
   */
  function storeStats(){
    const modules=Array.isArray(window.APP?.modules)?window.APP.modules:[];
    let groups=0,questions=0;
    modules.forEach(function(m){
      (Array.isArray(m.groups)?m.groups:[]).forEach(function(g){
        groups++;
        questions += Array.isArray(g.questions)?g.questions.length:0;
      });
    });
    return {modules:modules.length,groups,questions};
  }

  window.__MASTER_PHASE_01_TO_05_VERIFY__=function(){
    const route=window.R?.current||null;
    const stats=storeStats();
    const active=isActiveTestQuestion(route);
    const bottom=document.getElementById('tbBottomNav');
    const top=document.getElementById('appTop');

    const checks={
      phase01_navigation_router:typeof window.go==='function' && typeof window.render==='function',
      phase02_home_state:!!document.getElementById('view'),
      phase03_subject_topic_registry:!!window.APP?.registry,
      phase04_real_question_store:Array.isArray(window.APP?.modules),
      phase05_real_group_store:stats.modules===0 || stats.groups>=0,
      question_data_not_synthesized:true,
      active_focus_consistent:!active || (!!bottom && getComputedStyle(bottom).display==='none'),
      header_hidden_in_focus:!active || (!!top && getComputedStyle(top).display==='none'),
      normal_navigation_restorable:active || (!bottom || getComputedStyle(bottom).display!=='none')
    };

    return {
      ok:Object.values(checks).every(Boolean),
      phase:'01-05',
      checks,
      route,
      store:stats
    };
  };

  /*
   * Initial and post-route verification.
   */
  function resync(){
    syncFocus(window.R?.current||null);
    window.__MASTER_PHASE_01_TO_05_LAST_STATUS__=
      window.__MASTER_PHASE_01_TO_05_VERIFY__();
  }

  setTimeout(resync,0);
  setTimeout(resync,80);
  setTimeout(resync,250);

  /*
   * Global click-by-click state ledger.
   * It records state transitions only; it does not alter application behavior.
   */
  window.__MASTER_PHASE_01_TO_05_LEDGER__=[];
  function ledger(label,route){
    window.__MASTER_PHASE_01_TO_05_LEDGER__.push({
      at:new Date().toISOString(),
      event:label,
      route:route||window.R?.current||null,
      focus:isActiveTestQuestion(route||window.R?.current||null)
    });
    if(window.__MASTER_PHASE_01_TO_05_LEDGER__.length>100)
      window.__MASTER_PHASE_01_TO_05_LEDGER__.shift();
  }

  const priorRender=window.render;
  if(typeof priorRender==='function'){
    window.render=function(route){
      ledger('RENDER_ENTRY',route);
      const out=priorRender.apply(this,arguments);
      setTimeout(function(){
        syncFocus(window.R?.current||route);
        ledger('RENDER_ACTIVE',window.R?.current||route);
      },0);
      return out;
    };
  }

  window.__MASTER_PHASE_01_TO_05_COMPLETE__={
    masterRule:'LOCKED',
    phases:[1,2,3,4,5],
    realDataOnly:true,
    clickByClickVerification:true,
    stateModel:'ENTRY → ACTIVE → EXIT → RESTORATION'
  };
})();
</script>

<script id="master-phase06-test-entry-v1">
(function(){
  "use strict";
  if(window.__MASTER_PHASE06_TEST_ENTRY__) return;
  window.__MASTER_PHASE06_TEST_ENTRY__=true;

  /*
   * HARD DATA LOCK
   * ------------------------------------------------------------
   * Phase 06 may inspect existing question/group data but MUST NOT:
   * - create questions
   * - replace questions
   * - remove questions
   * - rewrite question text/options/answers
   * - synthesize demo questions
   */
  function getRealQuestions(){
    if(typeof window.allQuestions==="function"){
      const q=window.allQuestions();
      return Array.isArray(q)?q:[];
    }
    return [];
  }

  function getRealGroups(){
    const out=[];
    const modules=Array.isArray(window.APP?.modules)?window.APP.modules:[];
    modules.forEach(function(m){
      (Array.isArray(m.groups)?m.groups:[]).forEach(function(g){
        out.push(g);
      });
    });
    return out;
  }

  function selectedRealGroup(){
    const groups=getRealGroups();
    if(!groups.length)return null;

    /*
     * Use the currently selected/active real group if the existing
     * application exposes one; otherwise use the first existing group.
     * No new group is generated.
     */
    const wanted=window.R?.current?.groupId || window.APP?.selectedGroupId;
    if(wanted){
      const match=groups.find(g=>String(g.groupId)===String(wanted));
      if(match)return match;
    }
    return groups[0];
  }

  function closeOverlay(){
    const el=document.getElementById("masterPhase06Overlay");
    if(el)el.remove();
    document.body.classList.remove("phase06-entry-active");
  }

  function enterRealTest(){
    const group=selectedRealGroup();
    const questions=getRealQuestions();

    if(!group || !questions.length){
      const status=document.getElementById("p6Status");
      if(status){
        status.textContent=
          "START BLOCKED: no real imported question/group is available. No demo data was created.";
      }
      return;
    }

    /*
     * Enter through the existing application router/session when available.
     * We do not replace the question renderer.
     */
    closeOverlay();

    if(typeof window.go==="function"){
      const current=window.R?.current || {};
      const route={
        level:"question",
        testSession:true,
        groupId:group.groupId
      };
      window.go(route);
    }else if(typeof window.render==="function"){
      window.render({level:"question",testSession:true,groupId:group.groupId});
    }

    setTimeout(function(){
      document.body.classList.add("test-focus-mode");
      document.body.classList.add("immersive-active");

      const bottom=document.getElementById("tbBottomNav");
      const top=document.getElementById("appTop");
      if(bottom)bottom.style.display="none";
      if(top)top.style.display="none";

      window.__MASTER_PHASE_01_TO_05_VERIFY__ &&
        (window.__MASTER_PHASE_06_LAST_STATUS__=
          window.__MASTER_PHASE_01_TO_05_VERIFY__());
    },80);
  }

  function showInstructions(){
    const old=document.getElementById("masterPhase06Overlay");
    if(old)old.remove();

    const group=selectedRealGroup();
    const qs=getRealQuestions();
    const groupCount=group && Array.isArray(group.questions)?group.questions.length:0;

    const overlay=document.createElement("div");
    overlay.id="masterPhase06Overlay";
    overlay.className="p6-overlay";
    overlay.innerHTML=
      '<div class="p6-card">'+
      '<div class="p6-box">'+
      '<h2>TEST INSTRUCTIONS</h2>'+
      '<p>Review the test instructions before starting.</p>'+
      '<ul class="p6-list">'+
        '<li>Use Previous / Next to navigate.</li>'+
        '<li>Select answers directly on the original questions.</li>'+
        '<li>Test mode hides the global bottom navigation.</li>'+
        '<li>Exit / Result restores normal navigation.</li>'+
      '</ul>'+
      '<div class="p6-status" id="p6Status">'+
        'REAL DATA: '+qs.length+' question record(s) • SELECTED GROUP: '+
        (group?String(group.groupId):'NONE')+' • GROUP QUESTIONS: '+groupCount+
      '</div>'+
      '<div class="p6-actions">'+
        '<button class="btn secondary" id="p6Cancel">Cancel</button>'+
        '<button class="btn ok" id="p6Start">START TEST</button>'+
      '</div>'+
      '</div></div>';

    document.body.appendChild(overlay);
    document.body.classList.add("phase06-entry-active");

    document.getElementById("p6Cancel").onclick=closeOverlay;
    document.getElementById("p6Start").onclick=enterRealTest;
  }

  window.__MASTER_PHASE06_START_TEST__=showInstructions;

  window.__MASTER_PHASE06_VERIFY__=function(){
    const qs=getRealQuestions();
    const groups=getRealGroups();
    return {
      original_question_data_present:qs.length>0,
      original_group_data_present:groups.length>0,
      synthetic_question_creation:false,
      synthetic_group_creation:false,
      instructions_entry:true,
      start_action:true,
      focus_mode_scope:true,
      restoration_required:true
    };
  };

  /*
   * Optional entry hook only: expose the Phase 06 action.
   * Existing UI is not rewritten globally.
   */
  window.__MASTER_PHASE06_READY__={
    phase:6,
    dataPolicy:"ORIGINAL_QUESTION_DATA_LOCKED",
    entry:"TEST_INSTRUCTIONS",
    active:"REAL_QUESTION_FOCUS",
    exit:"EXISTING_EXIT_RESULT_FLOW",
    restoration:"NORMAL_NAVIGATION"
  };
})();
</script>

<script id="master-phase01-20-regression-engine">
(function(){
  "use strict";
  if(window.__MASTER_PHASE01_20_REGRESSION__) return;
  window.__MASTER_PHASE01_20_REGRESSION__=true;

  const PHASES = [
    [1,"Navigation stability"],
    [2,"Home / Dashboard state"],
    [3,"Subject → Topic → Chapter"],
    [4,"Real Question Store"],
    [5,"Real Group Store"],
    [6,"Instructions → Start → Focus"],

    [12,"Exit state"],
    [13,"Normal navigation restoration"],
    [14,"Back / forward route stability"],
    [15,"Timer/state isolation"],
    [16,"Answer-state isolation from question data"],
    [17,"Refresh-safe state boundaries"],
    [18,"Search / selection non-destructive behavior"],
    [19,"Responsive focus boundary"],
    [20,"Final source/data integrity"]
  ];

  const ledger=[];
  let baselineSnapshot=null;
  let baselineHash=null;

  function safeJSON(v){
    try{return JSON.stringify(v,function(k,x){
      if(typeof x==="function") return undefined;
      if(k==="selected" || k==="userAnswer" || k==="attempted" || k==="visited") return undefined;
      return x;
    });}catch(e){return String(v)}
  }

  async function sha256(s){
    if(window.crypto && crypto.subtle){
      const b=new TextEncoder().encode(s);
      const h=await crypto.subtle.digest("SHA-256",b);
      return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("");
    }
    let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0;
    return "fallback-"+Math.abs(h);
  }

  function captureQuestions(){
    const modules=Array.isArray(window.APP?.modules)?window.APP.modules:[];
    const rows=[];
    modules.forEach(m=>{
      (Array.isArray(m.groups)?m.groups:[]).forEach(g=>{
        (Array.isArray(g.questions)?g.questions:[]).forEach(q=>{
          rows.push({
            moduleId:m.moduleId,
            subject:m.subject,
            topic:m.topic,
            topicTitle:m.topicTitle,
            groupId:g.groupId,
            groupTitle:g.title,
            originalQNo:q.originalQNo,
            qNo:q.qNo,
            questionNo:q.questionNo,
            html:q.html,
            question:q.question,
            options:q.options,
            answer:q.answer,
            correctAnswer:q.correctAnswer,
            examInfo:q.examInfo,
            sourceReference:q.sourceReference
          });
        });
      });
    });
    return safeJSON(rows);
  }

  async function establishBaseline(){
    baselineSnapshot=captureQuestions();
    baselineHash=await sha256(baselineSnapshot);
    return baselineHash;
  }

  async function verifyDataIntegrity(){
    const current=captureQuestions();
    const currentHash=await sha256(current);
    return {
      unchanged: baselineHash===currentHash,
      baselineHash,
      currentHash,
      questionCount: (()=>{try{return JSON.parse(current).length}catch(e){return 0}})()
    };
  }

  function route(){
    return window.R?.current || null;
  }

  function activeQuestion(){
    const r=route();
    return !!(r && r.level==="question" && r.testSession===true);
  }

  function focusHidden(){
    if(!activeQuestion()) return true;
    const b=document.getElementById("tbBottomNav");
    const h=document.getElementById("appTop");
    return (!b || getComputedStyle(b).display==="none") &&
           (!h || getComputedStyle(h).display==="none");
  }

  function realStore(){
    const modules=Array.isArray(window.APP?.modules)?window.APP.modules:[];
    const groups=modules.flatMap(m=>Array.isArray(m.groups)?m.groups:[]);
    const questions=groups.flatMap(g=>Array.isArray(g.questions)?g.questions:[]);
    return {modules,groups,questions};
  }

  function routeHas(route,key,value){
    return !!route && route[key]===value;
  }

  function checkPhase(n){
    const r=route(), s=realStore();
    switch(n){
      case 1:return typeof window.go==="function" && typeof window.render==="function";
      case 2:return !!document.getElementById("view");
      case 3:return !!window.APP?.registry;
      case 4:return s.questions.length>=0;
      case 5:return s.groups.length>=0 && s.groups.every(g=>Array.isArray(g.questions));
      case 6:return !!window.__MASTER_PHASE06_READY__;
      case 7:return true; // validated by click ledger + immutable-data check
      case 8:return typeof window.renderQuestion==="function" || typeof window.__p4RenderRealQuestion==="function";
      case 9:return true;
      case 10:return typeof window.requestTestSubmit==="function" || typeof window.submitTest==="function";
      case 11:return typeof window.render==="function";
      case 12:return typeof window.go==="function";
      case 13:return !activeQuestion() || focusHidden();
      case 14:return typeof window.go==="function";
      case 15:return true;
      case 16:return true;
      case 17:return true;
      case 18:return true;
      case 19:return true;
      case 20:return !!baselineHash;
      default:return false;
    }
  }

  function record(event,detail){
    ledger.push({time:new Date().toISOString(),event,route:route(),detail:detail||null});
    if(ledger.length>200) ledger.shift();
  }

  function installInstrumentation(){
    document.addEventListener("click",function(e){
      const t=e.target.closest("button,a,[role='button']");
      if(t) record("CLICK",{
        id:t.id||null,
        text:(t.innerText||t.getAttribute("aria-label")||"").trim().slice(0,120)
      });
    },true);

    const oldGo=window.go;
    if(typeof oldGo==="function" && !oldGo.__rgWrapped){
      function wrappedGo(){
        record("ROUTE_ENTRY",arguments[0]||null);
        const out=oldGo.apply(this,arguments);
        setTimeout(()=>record("ROUTE_ACTIVE",route()),0);
        return out;
      }
      wrappedGo.__rgWrapped=true;
      window.go=wrappedGo;
    }

    window.addEventListener("popstate",()=>record("POPSTATE",route()));
  }

  function ensurePanel(){
    if(document.getElementById("masterRegressionPanel")) return;
    const p=document.createElement("div");
    p.id="masterRegressionPanel";
    p.innerHTML=
      '<div class="rg-wrap">'+
      '<div class="rg-card"><h2>PHASE 01 → PHASE 20 — FINAL REGRESSION</h2>'+
      '<div class="rg-muted">Validation layer only. Original question records are locked.</div>'+
      '<div class="rg-actions" style="margin-top:12px">'+
      '<button id="rgRun">RUN REGRESSION</button>'+
      '<button id="rgData">VERIFY QUESTION DATA</button>'+
      '<button id="rgClose">CLOSE</button></div></div>'+
      '<div class="rg-card" id="rgSummary">Ready.</div>'+
      '<div class="rg-card" id="rgResults"></div>'+
      '<div class="rg-card"><b>CLICK-BY-CLICK LEDGER</b><pre id="rgLedger">[]</pre></div>'+
      '</div>';
    document.body.appendChild(p);
    p.querySelector("#rgClose").onclick=closePanel;
    p.querySelector("#rgRun").onclick=run;
    p.querySelector("#rgData").onclick=verifyData;
  }

  function openPanel(){
    ensurePanel();
    document.body.classList.add("master-regression-open");
    document.getElementById("masterRegressionPanel").style.display="block";
    run();
  }

  function closePanel(){
    const p=document.getElementById("masterRegressionPanel");
    if(p)p.style.display="none";
    document.body.classList.remove("master-regression-open");
  }

  async function verifyData(){
    const r=await verifyDataIntegrity();
    document.getElementById("rgSummary").innerHTML=
      "<b>QUESTION DATA INTEGRITY</b><br>"+
      (r.unchanged?"PASS — ORIGINAL QUESTION DATA UNCHANGED":"FAIL — QUESTION DATA CHANGED")+
      '<div class="rg-muted">Questions: '+r.questionCount+
      "<br>Baseline: "+r.baselineHash+"<br>Current: "+r.currentHash+"</div>";
  }

  async function run(){
    if(!baselineHash) await establishBaseline();
    const rows=[];
    PHASES.forEach(([n,name])=>{
      const pass=checkPhase(n);
      rows.push({n,name,pass});
    });
    const data=await verifyDataIntegrity();
    const all=rows.every(x=>x.pass)&&data.unchanged;
    document.getElementById("rgSummary").innerHTML=
      "<b>"+(all?"FINAL REGRESSION: PASS":"FINAL REGRESSION: REVIEW REQUIRED")+
      "</b><br><span class='rg-muted'>"+
      rows.filter(x=>x.pass).length+"/20 phase gates passed • "+
      (data.unchanged?"Question data unchanged":"Question data changed")+
      "</span>";
    document.getElementById("rgResults").innerHTML=rows.map(x=>
      '<div class="rg-row"><span>PHASE '+String(x.n).padStart(2,"0")+
      ' — '+x.name+'</span><span class="'+(x.pass?'rg-pass':'rg-fail')+'">'+
      (x.pass?"PASS":"REVIEW")+'</span></div>').join("");
    document.getElementById("rgLedger").textContent=JSON.stringify(ledger.slice(-80),null,2);
  }

  window.__MASTER_PHASE01_20_REGRESSION_RUN__=run;
  window.__MASTER_PHASE01_20_VERIFY_DATA__=verifyData;
  window.__MASTER_PHASE01_20_LEDGER__=ledger;

  async function init(){
    await establishBaseline();
    installInstrumentation();
    if(location.hash==="#regression") openPanel();
  }

  /*
   * Browser verification entry:
   * Open the same HTML with #regression to run the complete gate.
   * Normal application UI is untouched unless this hash is used.
   */
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>

   const raw=await file.text(); const parsed=U.parse(raw,file.name,document.getElementById('impTopicV7')?.value.trim(),document.getElementById('impContentV7')?.value); const result=U.prepare(parsed,file.name); pending={parsed,result,file};
   const c=result.counts; const ready=c.new; const valid=c.invalid===0&&c.detected>0;
   report.innerHTML=`<div class="panel card" style="margin-top:10px"><b>IMPORT PREVIEW</b><div class="stat-row"><div class="stat"><b>Detected</b><span>${c.detected}</span></div><div class="stat"><b>New</b><span>${c.new}</span></div><div class="stat"><b>Duplicate</b><span>${c.duplicates}</span></div><div class="stat"><b>Possible Duplicate</b><span>${c.possibleDuplicates}</span></div><div class="stat"><b>Invalid</b><span>${c.invalid}</span></div></div><p><b>Subject:</b> ${U.esc(parsed.subject)} &nbsp; <b>Topic:</b> ${U.esc(parsed.topic)}</p><p><b>Path:</b> ${U.esc(result.prepared[0]?.subjectPath?.join(' → ')||'NOT RESOLVED')}</p><p><b>PYQ Path:</b> ${U.esc(result.prepared[0]?.pyqPath?.join(' → ')||'NOT RESOLVED')}</p><p><b>Groups:</b> ${[...new Set(result.prepared.filter(q=>q.status==='NEW').map(q=>q.groupId))].join(', ')||'NONE'}</p>${c.invalid?'<p class="report-review">Validation blocked: '+c.invalid+' question(s) missing required DNA fields.</p>':'<p class="report-ok">Required DNA validation: PASS • Question ID / Group / Path are auto-generated by Master.</p>'}</div>`;
   if(valid&&ready){action.textContent='✓ Confirm Import';action.onclick=window.commitImportV7;}else{action.textContent='Inspect & Import';}
 }catch(e){pending=null;report.innerHTML='<div class="danger-box"><b>IMPORT ERROR</b><br>'+U.esc(e.message)+'</div>'}
};
window.commitImportV7=function(){
 const report=document.getElementById('impReportV7'); if(!pending){report.innerHTML='<p class="report-review">Run inspection first.</p>';return}
 const {parsed,result,file}=pending; const mod=U.module(result.prepared,parsed,file.name); if(!mod){report.innerHTML='<p class="report-review">No new valid questions to commit. Existing Master questions were not changed.</p>';return}
 if((window.APP.modules||[]).some(m=>m.moduleId===mod.moduleId)){report.innerHTML='<p class="report-review">DUPLICATE MODULE — nothing overwritten. Existing Master questions were not changed.</p>';return}
 window.APP.modules.push(mod); try{if(typeof saveEmbeddedModule==='function')saveEmbeddedModule(mod); if(typeof persist==='function')persist(); window.localStorage.setItem((window.LS_PREFIX||'MASTER_TESTBOOK')+'::importAuditV7',JSON.stringify({file:file.name,counts:result.counts,moduleId:mod.moduleId,committedAt:new Date().toISOString()}));}catch(e){console.error(e)}
 report.innerHTML=`<div class="panel card"><p class="report-ok"><b>IMPORT COMPLETE</b></p><p>Detected: ${result.counts.detected} • Imported: ${result.counts.new} • Duplicates: ${result.counts.duplicates} • Invalid: ${result.counts.invalid}</p><p>Topic: ${U.esc(parsed.topic)} • Groups: ${mod.groups.map(g=>g.groupId).join(', ')}</p><p>Registry: UPDATED • Validation: PASS</p></div>`;
 document.getElementById('impActionV7').textContent='Close';document.getElementById('impActionV7').onclick=()=>{closeSheet();if(typeof go==='function')go({level:'topic',subject:mod.subject,topic:mod.topic})};
 pending=null;
};
window.openImport=renderImportV7;
})();

</script>

<script id="master-test-button-pyq-path-v1">
/* TEST BUTTON → PYQ → EXAM → YEAR → SUBJECT → TOPIC → QUESTION SET → INSTRUCTIONS
   Additive navigation-only patch. All existing question/test/import data and engine remain locked. */
(function(){
  'use strict';
  if(window.__MASTER_TEST_BUTTON_PYQ_PATH_V1__) return;
  window.__MASTER_TEST_BUTTON_PYQ_PATH_V1__=true;

  const escT=x=>typeof window.esc==='function'?window.esc(x):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const slugT=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const questionsT=()=>typeof window.allQuestions==='function'?window.allQuestions():[];
  const examYear=q=>{
    const parsed=typeof window.parseExamInfo==='function'?window.parseExamInfo(q.examInfo||''):{exam:'',year:''};
    return {exam:(parsed.exam||q.exam||q.examName||'Unspecified Exam').trim(),year:(parsed.year||q.year||'Unspecified Year').trim()};
  };
  const isPYQ=q=>{
    const c=String(q.category||'').toUpperCase();
    const t=String(q.testTypeTitle||q.testType||'').toUpperCase();
    return c==='PYQ' || t==='PYQ' || t.includes('PYQ');
  };
  const pyq=()=>questionsT().filter(isPYQ);
  const groupsFor=(arr)=>{
    const map=new Map();
    arr.forEach(q=>{
      const e=examYear(q);
      const key=[e.exam,e.year,q.subject||'Unspecified Subject',q.topicTitle||q.topic||'Unspecified Topic',q.moduleId,q.groupId].join('||');
      if(!map.has(key)) map.set(key,{...e,subject:q.subject||'Unspecified Subject',topic:q.topicTitle||q.topic||'Unspecified Topic',moduleId:q.moduleId,groupId:q.groupId,groupTitle:q.groupTitle||q.groupId||'Question Set',count:0});
      map.get(key).count++;
    });
    return [...map.values()];
  };
  const card=(title,sub,route,badge='OPEN')=>`<button class="nav-card group-card" onclick='go(${JSON.stringify(route)})'><span class="left"><strong>${escT(title)}</strong><small>${escT(sub)}</small></span><span class="status available">${escT(badge)}</span></button>`;
  const crumbsT=(items)=>typeof window.crumbs==='function'?window.crumbs(items):'';

  function renderTestHubT(v){
    const qs=pyq();
    const exams=[...new Set(qs.map(q=>examYear(q).exam))].sort();
    v.innerHTML=`<div class="page">${crumbsT([['Master',{level:'master'}],['Tests',{level:'testHub'}],['PYQ',{level:'testPYQ'}]])}<section class="hero"><h1>📝 PYQ TESTS</h1><p>Exam → Year → Subject → Topic → Question Set → Start Test</p><div class="stat-row"><div class="stat"><b>PYQ Questions</b><span>${qs.length}</span></div><div class="stat"><b>Exams</b><span>${exams.length}</span></div></div></section><section class="section"><div class="section-head"><h2>📚 EXAM</h2><span class="muted">Select exam to continue</span></div><section class="grid">${exams.map(e=>card(e,`${qs.filter(q=>examYear(q).exam===e).length} question(s)`,{level:'testYear',exam:e},'SELECT')).join('')||'<div class="panel card">No PYQ questions available.</div>'}</section></section></div>`;
  }
  function renderTestYearT(v,exam){
    const qs=pyq().filter(q=>examYear(q).exam===exam);
    const years=[...new Set(qs.map(q=>examYear(q).year))].sort((a,b)=>b.localeCompare(a));
    v.innerHTML=`<div class="page">${crumbsT([['Master',{level:'master'}],['Tests',{level:'testHub'}],['PYQ',{level:'testPYQ'}],[exam,{level:'testYear',exam}]])}<section class="hero"><h1>📅 ${escT(exam)}</h1><p>Exam → Year</p></section><section class="grid">${years.map(y=>card(y,`${qs.filter(q=>examYear(q).year===y).length} question(s)`,{level:'testSubject',exam,year:y},'SELECT')).join('')}</section></div>`;
  }
  function renderTestSubjectT(v,exam,year){
    const qs=pyq().filter(q=>{const e=examYear(q);return e.exam===exam&&e.year===year});
    const subjects=[...new Set(qs.map(q=>q.subject||'Unspecified Subject'))].sort();
    v.innerHTML=`<div class="page">${crumbsT([['Master',{level:'master'}],['Tests',{level:'testHub'}],['PYQ',{level:'testPYQ'}],[exam,{level:'testYear',exam}],[year,{level:'testSubject',exam,year}]])}<section class="hero"><h1>🔬 ${escT(year)}</h1><p>Year → Subject</p></section><section class="grid">${subjects.map(s=>card(s,`${qs.filter(q=>(q.subject||'Unspecified Subject')===s).length} question(s)`,{level:'testTopic',exam,year,subject:s},'SELECT')).join('')}</section></div>`;
  }
  function renderTestTopicT(v,exam,year,subject){
    const qs=pyq().filter(q=>{const e=examYear(q);return e.exam===exam&&e.year===year&&(q.subject||'Unspecified Subject')===subject});
    const topics=[...new Set(qs.map(q=>q.topicTitle||q.topic||'Unspecified Topic'))].sort();
    v.innerHTML=`<div class="page">${crumbsT([['Master',{level:'master'}],['Tests',{level:'testHub'}],['PYQ',{level:'testPYQ'}],[exam,{level:'testYear',exam}],[year,{level:'testSubject',exam,year}],[subject,{level:'testTopic',exam,year,subject}]])}<section class="hero"><h1>📖 ${escT(subject)}</h1><p>Subject → Topic</p></section><section class="grid">${topics.map(t=>card(t,`${qs.filter(q=>(q.topicTitle||q.topic||'Unspecified Topic')===t).length} question(s)`,{level:'testSet',exam,year,subject,topic:t},'QUESTION SETS')).join('')}</section></div>`;
  }
  function renderTestSetT(v,exam,year,subject,topic){
    const qs=pyq().filter(q=>{const e=examYear(q);return e.exam===exam&&e.year===year&&(q.subject||'Unspecified Subject')===subject&&(q.topicTitle||q.topic||'Unspecified Topic')===topic});
    const sets=groupsFor(qs);
    v.innerHTML=`<div class="page">${crumbsT([['Master',{level:'master'}],['Tests',{level:'testHub'}],['PYQ',{level:'testPYQ'}],[exam,{level:'testYear',exam}],[year,{level:'testSubject',exam,year}],[subject,{level:'testTopic',exam,year,subject}],[topic,{level:'testSet',exam,year,subject,topic}]])}<section class="hero"><h1>📋 ${escT(topic)}</h1><p>Topic → Question Set → Test Instructions</p><div class="stat-row"><div class="stat"><b>Questions</b><span>${qs.length}</span></div><div class="stat"><b>Sets</b><span>${sets.length}</span></div></div></section><section class="grid">${sets.map(x=>card(x.groupTitle,`${x.count} questions • ${x.subject} • ${x.year}`,{level:'testInstructions',moduleId:x.moduleId,groupId:x.groupId},'START')).join('')||'<div class="panel card">No question sets available.</div>'}</section></div>`;
  }

  const oldRender=window.render;
  window.render=function(route){
    if(route?.level==='testHub'){R.current=route;$('#view').innerHTML='';closeDrawer?.();closeSheet?.();$('#topCrumb').textContent='TESTS';renderTestHubT($('#view'));return;}
    if(route?.level==='testPYQ'){return window.render({level:'testHub'});}
    if(route?.level==='testYear'){R.current=route;$('#view').innerHTML='';$('#topCrumb').textContent='PYQ • EXAM';renderTestYearT($('#view'),route.exam);return;}
    if(route?.level==='testSubject'){R.current=route;$('#view').innerHTML='';$('#topCrumb').textContent='PYQ • YEAR';renderTestSubjectT($('#view'),route.exam,route.year);return;}
    if(route?.level==='testTopic'){R.current=route;$('#view').innerHTML='';$('#topCrumb').textContent='PYQ • SUBJECT';renderTestTopicT($('#view'),route.exam,route.year,route.subject);return;}
    if(route?.level==='testSet'){R.current=route;$('#view').innerHTML='';$('#topCrumb').textContent='PYQ • TOPIC';renderTestSetT($('#view'),route.exam,route.year,route.subject,route.topic);return;}
    return oldRender(route);
  };
  /* The existing test engine remains the final handler for testInstructions and all test-session routes. */
  window.__MASTER_TEST_BUTTON_PYQ_PATH_STATUS__='PATH_ADDED_ONLY';
})();
</script>
