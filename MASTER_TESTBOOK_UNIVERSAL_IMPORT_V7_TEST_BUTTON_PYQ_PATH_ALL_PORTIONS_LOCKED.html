<script id="question-base-difficulty-engine-v1">
/* QUESTION BASE + DIFFICULTY ENGINE
   Integrated into Phase 11–30 Import Architecture.
   Base: THEORY | NUMERICAL
   Difficulty: EASY | MODERATE | TOUGH
*/
(function(){
  "use strict";
  const DIFFICULTIES = Object.freeze(["EASY","MODERATE","TOUGH"]);
  const BASES = Object.freeze(["THEORY","NUMERICAL"]);

  function normalizeDifficulty(v){
    const x=String(v??"").trim().toUpperCase();
    if(["EASY","BASIC","BEGINNER","SIMPLE"].includes(x)) return "EASY";
    if(["MODERATE","MEDIUM","INTERMEDIATE"].includes(x)) return "MODERATE";
    if(["TOUGH","HARD","ADVANCED","DIFFICULT"].includes(x)) return "TOUGH";
    return "NOT_AVAILABLE";
  }

  function normalizeBase(v){
    const x=String(v??"").trim().toUpperCase();
    if(["NUMERICAL","NUMERIC","CALCULATION","CALCULATIVE","NUMERICAL QUESTION"].includes(x)) return "NUMERICAL";
    if(["THEORY","THEORETICAL","CONCEPT","CONCEPTUAL"].includes(x)) return "THEORY";
    return "THEORY";
  }

  function classify(q){
    q=q||{};
    const difficulty=normalizeDifficulty(q.difficulty ?? q.DIFFICULTY);
    const explicitType=q.questionBase ?? q.baseType ?? q.questionType ?? q.type ?? q.TYPE;
    const base=normalizeBase(explicitType);
    return {
      ...q,
      questionBase:base,
      difficulty,
      metadataStatus:(difficulty==="NOT_AVAILABLE"?"REVIEW_REQUIRED":"PASS")
    };
  }

  function validate(q){
    const x=classify(q);
    const errors=[];
    if(!DIFFICULTIES.includes(x.difficulty)) errors.push("DIFFICULTY_INVALID_OR_MISSING");
    if(!BASES.includes(x.questionBase)) errors.push("QUESTION_BASE_INVALID");
    return {status:errors.length?"REVIEW_REQUIRED":"PASS",errors,record:x};
  }

  function filter(records,base="ALL",difficulty="ALL"){
    const b=String(base||"ALL").toUpperCase();
    const d=String(difficulty||"ALL").toUpperCase();
    return (records||[]).map(classify).filter(q=>
      (b==="ALL" || q.questionBase===b) &&
      (d==="ALL" || q.difficulty===d)
    );
  }

  function stats(records){
    const out={total:0,theory:0,numerical:0,easy:0,moderate:0,tough:0,reviewRequired:0};
    (records||[]).forEach(q=>{
      const x=classify(q); out.total++;
      if(x.questionBase==="THEORY") out.theory++; else if(x.questionBase==="NUMERICAL") out.numerical++;
      if(x.difficulty==="EASY") out.easy++;
      else if(x.difficulty==="MODERATE") out.moderate++;
      else if(x.difficulty==="TOUGH") out.tough++;
      else out.reviewRequired++;
    });
    return out;
  }

  function update(q,patch){
    const next={...(q||{}),...(patch||{})};
    return classify(next);
  }

  window.QuestionBaseDifficultyEngine={
    version:"QUESTION-BASE-DIFFICULTY-V1.0",
    phaseRange:"11-30",
    DIFFICULTIES, BASES,
    normalizeDifficulty, normalizeBase, classify, validate, filter, stats, update,
    hierarchy:{
      THEORY:{EASY:[],MODERATE:[],TOUGH:[]},
      NUMERICAL:{EASY:[],MODERATE:[],TOUGH:[]}
    },
    rules:{
      difficultySource:"EXPLICIT_METADATA_ONLY",
      missingDifficulty:"REVIEW_REQUIRED",
      numericalIsBase:true,
      numericalHasDifficulty:true,
      questionIdentityIndependentOfPlacement:true,
      pathAutoResolved:true
    }
  };
})();
</script>
<script id="master-indexeddb-persistence-v1">
(function(){
  "use strict";
  if(window.__MASTER_INDEXEDDB_PERSISTENCE_V1__) return;
  window.__MASTER_INDEXEDDB_PERSISTENCE_V1__=true;

  const DB_NAME="MASTER_TESTBOOK_DB";
  const DB_VERSION=1;
  const STORES={questions:"questions",sources:"sources",topics:"topics",groups:"groups",references:"references",imports:"imports",metadata:"metadata"};
  let dbPromise=null;
  let readyPromise=null;
  let pendingWrites=[];
  let lastError=null;

  const now=()=>new Date().toISOString();
  const clean=v=>v==null?"":String(v).trim();
  const arr=v=>Array.isArray(v)?v:[];
  const hash32=str=>{let h=2166136261;str=String(str||"");for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,"0").toUpperCase()};

  function reqToPromise(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("INDEXEDDB_REQUEST_FAILED"));});}
  function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error("INDEXEDDB_TRANSACTION_FAILED"));tx.onabort=()=>reject(tx.error||new Error("INDEXEDDB_TRANSACTION_ABORTED"));});}

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise=new Promise((resolve,reject)=>{
      if(!window.indexedDB){reject(new Error("INDEXEDDB_UNAVAILABLE"));return;}
      let req;
      try{req=indexedDB.open(DB_NAME,DB_VERSION)}catch(e){reject(e);return}
      req.onupgradeneeded=function(ev){
        const db=ev.target.result;
        const make=(name,keyPath,indexes=[])=>{
          const st=db.objectStoreNames.contains(name)?req.transaction.objectStore(name):db.createObjectStore(name,{keyPath:keyPath});
          indexes.forEach(ix=>{try{if(!st.indexNames.contains(ix[0]))st.createIndex(ix[0],ix[1],ix[2]||{unique:false})}catch(e){}});
          return st;
        };
        make(STORES.questions,"masterQuestionId",[
          ["sourceId","sourceId"],["sourceQNo","sourceQNo"],["sourceFingerprint","sourceFingerprint"],["contentFingerprint","contentFingerprint"],["subjectId","subjectId"],["topicId","topicId"],["examInfo","examInfo"]
        ]);
        make(STORES.sources,"sourceId",[["sourceName","sourceName"],["sourceDigest","sourceDigest"]]);
        make(STORES.topics,"topicId",[["subjectId","subjectId"],["topicTitle","topicTitle"]]);
        make(STORES.groups,"groupId",[["topicId","topicId"],["sourceId","sourceId"]]);
        make(STORES.references,"referenceId",[["masterQuestionId","masterQuestionId"],["topicId","topicId"],["groupId","groupId"]]);
        make(STORES.imports,"importBatchId",[["sourceId","sourceId"],["status","status"],["startedAt","startedAt"]]);
        make(STORES.metadata,"key");
      };
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error("INDEXEDDB_OPEN_FAILED"));
      req.onblocked=()=>{};
    });
    return dbPromise;
  }

  async function verifyStorage(){
    try{
      const db=await openDB();
      const key="__storage_test__"+Date.now()+"_"+Math.random().toString(36).slice(2);
      const tx=db.transaction([STORES.metadata],"readwrite");
      tx.objectStore(STORES.metadata).put({key,value:true,createdAt:now()});
      await txDone(tx);
      const rx=db.transaction([STORES.metadata],"readonly");
      const got=await reqToPromise(rx.objectStore(STORES.metadata).get(key));
      await txDone(rx).catch(()=>{});
      const dx=db.transaction([STORES.metadata],"readwrite");
      dx.objectStore(STORES.metadata).delete(key); await txDone(dx);
      if(!got)throw new Error("INDEXEDDB_READBACK_FAILED");
      lastError=null; return {ok:true,dbName:DB_NAME,version:DB_VERSION};
    }catch(e){lastError=e;return {ok:false,error:e.message||String(e)};}
  }

  function toMasterRecord(q){
    const src=q.source||{}, ex=q.exam||{}, cl=q.classification||{}, c=q.content||{};
    const opts=arr(c.options).slice(0,4).map((o,i)=>({id:clean(o.id||String.fromCharCode(65+i)).toUpperCase(),english:clean(o.english),hindi:clean(o.hindi)}));
    const id=clean(q.questionId||q.masterQuestionId)||("MQ-"+hash32(JSON.stringify([src.sourceName,src.sourceQNo,c.english,c.hindi,opts,c.answer])));
    const sourceId=clean(src.sourceId)||("SRC-"+hash32((clean(src.sourceName)||"UNKNOWN_SOURCE")+"|"+(clean(q.fingerprint)||clean(q.contentSignature)||"")));
    const topicId=clean(cl.topic||cl.chapter)||"UNCLASSIFIED";
    const groupId=clean(q.groupId||cl.group)||"G-01";
    return {
      masterQuestionId:id, questionId:id, version:Number(q.version||1), status:clean(q.status)||"ACTIVE",
      subjectId:clean(cl.subject), chapterId:clean(cl.chapter), topicId:clean(cl.topic||cl.chapter), categoryId:clean(cl.category), testTypeId:clean(cl.type),
      sourceId, sourceFile:clean(src.sourceName), sourceQNo:clean(src.sourceQNo||q.originalQNo), sourcePage:clean(src.sourcePage), sourceOrder:Number(q.sourceOrder||0), sourceReference:clean(q.sourceReference),
      examInfo:[ex.exam,ex.year,ex.paper,ex.shift].filter(Boolean).join(" • "),
      exam:{...ex}, english:clean(c.english), hindi:clean(c.hindi), options:opts, correctAnswer:clean(c.answer).toUpperCase(),
      questionHTML:clean(q.html), questionType:clean(cl.type), difficulty:clean(q.difficulty), questionsBase:clean(q.questionsBase||q.questionBase), tags:arr(q.tags), concepts:arr(q.concepts),
      sourceFingerprint:clean(q.sourceFingerprint||q.fingerprint), contentFingerprint:clean(q.contentFingerprint||q.fingerprint), fingerprint:clean(q.fingerprint), contentSignature:clean(q.contentSignature),
      verified:q.verified===true || clean(q.ocrStatus).toUpperCase()==="CLEAR", createdAt:q.createdAt||now(), updatedAt:q.updatedAt||now(), importBatchId:clean(q.importBatchId),
      classification:{...cl}, source:{...src}, content:{...c,options:opts}
    };
  }

  function buildTopicRecords(records){
    const topics=new Map(),groups=new Map(),refs=[];
    records.forEach(q=>{
      const r=toMasterRecord(q), tid=r.topicId||"UNCLASSIFIED", gid=r.groupId||"G-01";
      if(!topics.has(tid))topics.set(tid,{topicId:tid,subjectId:r.subjectId,chapterId:r.chapterId,topicTitle:r.classification.topic||r.classification.chapter||tid,questionCount:0,groupCount:0,sourceIds:[],status:"ACTIVE",createdAt:r.createdAt,updatedAt:r.updatedAt});
      const t=topics.get(tid);t.questionCount++;if(r.sourceId&&!t.sourceIds.includes(r.sourceId))t.sourceIds.push(r.sourceId);
      const gk=tid+"::"+gid;if(!groups.has(gk))groups.set(gk,{groupId:gid,topicId:tid,sourceId:r.sourceId,questionRefs:[],questionCount:0,createdAt:r.createdAt,updatedAt:r.updatedAt});
      const g=groups.get(gk);g.questionRefs.push(r.masterQuestionId);g.questionCount++;
      refs.push({referenceId:tid+"::"+gid+"::"+r.masterQuestionId,masterQuestionId:r.masterQuestionId,topicId:tid,groupId:gid,sourceId:r.sourceId,sourceQNo:r.sourceQNo,sourceOrder:r.sourceOrder});
    });
    topics.forEach(t=>t.groupCount=[...groups.values()].filter(g=>g.topicId===t.topicId).length);
    return {topics:[...topics.values()],groups:[...groups.values()],refs};
  }

  async function persistRecords(records,audit){
    try{
      const db=await openDB();
      const list=arr(records).map(toMasterRecord);
      const built=buildTopicRecords(records);
      const sourceMap=new Map();list.forEach(q=>{if(!sourceMap.has(q.sourceId))sourceMap.set(q.sourceId,{sourceId:q.sourceId,sourceFile:q.sourceFile,sourceName:q.sourceFile,sourceType:"import",sourceDigest:q.sourceFingerprint||q.contentFingerprint||"",importedAt:now(),questionCount:0,topicCount:0,status:"READY"});sourceMap.get(q.sourceId).questionCount++});
      sourceMap.forEach(s=>s.topicCount=built.topics.filter(t=>t.sourceIds.includes(s.sourceId)).length);
      const tx=db.transaction(Object.values(STORES),"readwrite");
      Object.values(STORES).forEach(n=>tx.objectStore(n).clear());
      list.forEach(q=>tx.objectStore(STORES.questions).put(q));
      [...sourceMap.values()].forEach(x=>tx.objectStore(STORES.sources).put(x));
      built.topics.forEach(x=>tx.objectStore(STORES.topics).put(x));
      built.groups.forEach(x=>tx.objectStore(STORES.groups).put(x));
      built.refs.forEach(x=>tx.objectStore(STORES.references).put(x));
      tx.objectStore(STORES.imports).put({importBatchId:"LATEST",status:"COMPLETED",questionCount:list.length,startedAt:now(),completedAt:now(),audit:audit||null});
      tx.objectStore(STORES.metadata).put({key:"schema",dbName:DB_NAME,dbVersion:DB_VERSION,updatedAt:now(),questionCount:list.length});
      tx.objectStore(STORES.metadata).put({key:"storageStatus",status:"READY",verifiedAt:now()});
      await txDone(tx);
      lastError=null; return {ok:true,count:list.length};
    }catch(e){lastError=e;throw e;}
  }

  async function loadRecords(){
    const db=await openDB();
    const tx=db.transaction([STORES.questions],"readonly");
    const rows=await reqToPromise(tx.objectStore(STORES.questions).getAll());
    await txDone(tx).catch(()=>{});
    return rows.map(r=>({
      questionId:r.masterQuestionId, fingerprint:r.fingerprint||r.contentFingerprint||r.sourceFingerprint||"", contentSignature:r.contentSignature||"",
      source:{sourceId:r.sourceId,sourceName:r.sourceFile,sourcePage:r.sourcePage,sourceQNo:r.sourceQNo,sourceVersion:"1"},
      exam:r.exam||{}, classification:{...(r.classification||{}),subject:r.classification?.subject||r.subjectId,topic:r.classification?.topic||r.topicId,chapter:r.classification?.chapter||r.chapterId,category:r.classification?.category||r.categoryId,type:r.classification?.type||r.testTypeId,group:r.classification?.group||r.groupId},
      content:r.content||{english:r.english,hindi:r.hindi,options:r.options,answer:r.correctAnswer,explanationEnglish:"",explanationHindi:""},
      formula:r.formula||"",diagram:r.diagram||"NOT_PRESENT",imageReference:r.imageReference||"",difficulty:r.difficulty||"NOT_AVAILABLE",questionsBase:r.questionsBase||"THEORY",
      ocrStatus:r.verified?"CLEAR":"REVIEW_REQUIRED",importVersion:"1.0",registryId:r.registryId||"",path:r.path||"",groupId:r.groupId||r.classification?.group||"G-01",status:r.status||"ACTIVE",
      version:r.version||1,createdAt:r.createdAt,updatedAt:r.updatedAt,sourceOrder:r.sourceOrder,sourceReference:r.sourceReference,examInfo:r.examInfo,html:r.questionHTML||""
    }));
  }

  async function getStats(){
    const db=await openDB();const out={};
    for(const name of [STORES.questions,STORES.sources,STORES.topics,STORES.groups,STORES.references,STORES.imports]){
      const tx=db.transaction([name],"readonly");out[name]=await reqToPromise(tx.objectStore(name).count());await txDone(tx).catch(()=>{});
    }
    out.status=lastError?"ERROR":"READY";out.dbName=DB_NAME;out.version=DB_VERSION;return out;
  }

  async function clearAll(){const db=await openDB();const tx=db.transaction(Object.values(STORES),"readwrite");Object.values(STORES).forEach(n=>tx.objectStore(n).clear());await txDone(tx);return true;}

  window.MasterQuestionIndexedDB={
    DB_NAME,DB_VERSION,STORES,openDB,verifyStorage,persistRecords,loadRecords,getStats,clearAll,
    status:()=>({ok:!lastError,error:lastError?.message||null})
  };

  readyPromise=(async()=>{
    const v=await verifyStorage();
    if(!v.ok){window.__MASTER_IDB_STORAGE_STATUS__=v;return v;}
    window.__MASTER_IDB_STORAGE_STATUS__=v;
    return v;
  })();
  window.__MASTER_IDB_READY__=readyPromise;
})();
</script>
<script id="master-strict-repair-v1">
(function(){
  "use strict";
  if(window.__MASTER_STRICT_REPAIR_V1__) return;
  window.__MASTER_STRICT_REPAIR_V1__=true;

  const LS='master_testbook::';
  const STORE_KEY=LS+'master-question-store::v1';
  const AUDIT_KEY=LS+'import-audit::v1';
  const CLEAN_MARK=LS+'strict-clean-baseline::v1';
  const DIFF=['EASY','MODERATE','TOUGH'];
  const BASE=['THEORY','NUMERICAL'];

  const clean=v=>v==null?'':String(v).trim();
  const norm=v=>clean(v).toLowerCase().replace(/\s+/g,' ').trim();
  function hash32(str){let h=2166136261;for(let i=0;i<String(str).length;i++){h^=String(str).charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0').toUpperCase()}
  function slug(v){return clean(v).toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9\u0900-\u097f]+/gi,'-').replace(/^-+|-+$/g,'')}
  function escText(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function difficulty(v){const x=clean(v).toUpperCase();if(x==='EASY'||x==='BASIC')return 'EASY';if(x==='MODERATE'||x==='MEDIUM')return 'MODERATE';if(x==='TOUGH'||x==='HARD')return 'TOUGH';return x?'REVIEW_REQUIRED':'NOT_AVAILABLE'}
  function base(v){const x=clean(v).toUpperCase();if(x==='NUMERICAL'||x==='NUMERIC')return 'NUMERICAL';if(x==='THEORY'||x==='THEORETICAL')return 'THEORY';return x?'REVIEW_REQUIRED':'NOT_AVAILABLE'}
  function canonicalText(q){const c=q.content||{};const opts=(c.options||[]).map(o=>[norm(o.id),norm(o.english),norm(o.hindi)].join('|')).join('||');return [norm(c.english),norm(c.hindi),opts,norm(c.answer)].join('###')}
  function fingerprint(q){return 'FP-'+hash32(canonicalText(q))}
  function sourceKey(q){const s=q.source||{};return [norm(s.sourceName||s.sourceId),norm(s.sourceQNo)].join('::')}
  function stableId(q){const explicit=clean(q.questionId);if(explicit)return explicit;const sk=sourceKey(q);const basis=sk.replace(/::$/,'')||fingerprint(q);return 'QST-'+hash32(basis)}

  function readJSON(k,fb){try{const x=JSON.parse(localStorage.getItem(k));return x==null?fb:x}catch(e){return fb}}
  function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

  /* One-time purge of legacy/demo imported data. New canonical store is never
     purged by normal startup. */
  try{
    if(localStorage.getItem(CLEAN_MARK)!=='1'){
      Object.keys(localStorage).forEach(k=>{
        const x=k.toLowerCase();
        if(x.startsWith(LS+'::imported') || x.includes('master_testbook::imported') ||
           x.includes('master_testbook::modules') || x.includes('master_testbook::questionstore') ||
           x.includes('master_testbook::masterquestionstore') || x.includes('master_testbook::legacy-import')){
          localStorage.removeItem(k);
        }
      });
      localStorage.setItem(CLEAN_MARK,'1');
    }
  }catch(e){}

  let records=readJSON(STORE_KEY,[]);
  if(!Array.isArray(records)) records=[];

  function normalizeRecord(r){
    const q=r||{}, c=q.content||{}, src=q.source||{}, ex=q.exam||{}, cl=q.classification||{};
    const opts=Array.isArray(c.options)?c.options.slice(0,4).map((o,i)=>({id:clean(o.id||String.fromCharCode(65+i)).toUpperCase(),english:clean(o.english),hindi:clean(o.hindi)})):[];
    const rec={
      questionId:stableId(q), fingerprint:clean(q.fingerprint)||fingerprint({content:{...c,options:opts}}), contentSignature:clean(q.contentSignature)||canonicalText({content:{...c,options:opts}}),
      source:{sourceId:clean(src.sourceId),sourceName:clean(src.sourceName),sourcePage:clean(src.sourcePage),sourceQNo:clean(src.sourceQNo||q.originalQNo),sourceVersion:clean(src.sourceVersion)},
      exam:{exam:clean(ex.exam),year:clean(ex.year),paper:clean(ex.paper),stage:clean(ex.stage),branch:clean(ex.branch),paperDate:clean(ex.paperDate),shift:clean(ex.shift)},
      classification:{subject:clean(cl.subject),topic:clean(cl.topic),chapter:clean(cl.chapter),category:clean(cl.category),type:clean(cl.type),group:clean(cl.group)},
      content:{english:clean(c.english),hindi:clean(c.hindi),options:opts,answer:clean(c.answer).toUpperCase(),explanationEnglish:clean(c.explanationEnglish||c.explanation),explanationHindi:clean(c.explanationHindi)},
      formula:clean(q.formula),diagram:clean(q.diagram)||'NOT_PRESENT',imageReference:clean(q.imageReference),
      difficulty:difficulty(q.difficulty),questionsBase:base(q.questionsBase||q.questionBase),
      ocrStatus:clean(q.ocrStatus||q.OCR_STATUS)||'CLEAR',importVersion:clean(q.importVersion)||'1.0',registryId:clean(q.registryId),path:clean(q.path),groupId:clean(q.groupId),status:clean(q.status)||'ACTIVE',
      version:Number(q.version||1),createdAt:q.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()
    };
    return rec;
  }

  function validate(rec){
    const errors=[],warnings=[];const c=rec.content||{}, opts=c.options||[];
    if(!c.english&&!c.hindi) errors.push('QUESTION_TEXT_MISSING');
    if(opts.length<2) errors.push('OPTIONS_INSUFFICIENT');
    if(new Set(opts.map(o=>o.id)).size!==opts.length) errors.push('DUPLICATE_OPTION_ID');
    if(c.answer && opts.length && !opts.some(o=>o.id===c.answer)) errors.push('ANSWER_NOT_IN_OPTIONS');
    if(!rec.source.sourceName && !rec.source.sourceId) warnings.push('SOURCE_MISSING');
    if(!rec.source.sourceQNo) warnings.push('SOURCE_QUESTION_NO_MISSING');
    if(!rec.exam.exam) warnings.push('EXAM_MISSING');
    if(!rec.exam.year) warnings.push('YEAR_MISSING');
    if(!rec.classification.subject) warnings.push('SUBJECT_MISSING');
    if(!rec.classification.topic && !rec.classification.chapter) warnings.push('TOPIC_OR_CHAPTER_MISSING');
    if(rec.difficulty==='REVIEW_REQUIRED') warnings.push('DIFFICULTY_INVALID');
    if(rec.questionsBase==='REVIEW_REQUIRED') warnings.push('QUESTION_BASE_INVALID');
    return {status:errors.length?'REJECTED':(warnings.length?'REVIEW_REQUIRED':'PASS'),errors,warnings};
  }

  function parseKVBlock(block,fileName,index,defaults={}){
    const lines=String(block||'').replace(/\r/g,'').split('\n');
    const out={};let key='',buf=[];
    const bareKeys=new Set([
      'QUESTION_ENGLISH','QUESTION_HINDI','QUESTION_EN','QUESTION_HI','OPTIONS','ANSWER',
      'EXPLANATION_ENGLISH','EXPLANATION_HINDI','EXPLANATION_EN','EXPLANATION_HI',
      'FORMULA','DIAGRAM','IMAGE_REFERENCE','OCR_STATUS','IMPORT_VERSION',
      'A_ENGLISH','A_HINDI','B_ENGLISH','B_HINDI','C_ENGLISH','C_HINDI','D_ENGLISH','D_HINDI',
      'A_EN','A_HI','B_EN','B_HI','C_EN','C_HI','D_EN','D_HI'
    ]);
    function flush(){if(key){out[key]=buf.join('\n').trim();key='';buf=[]}}
    for(const rawLine of lines){
      const line=rawLine.trimEnd();
      const m=line.match(/^([A-Za-z][A-Za-z0-9_]*):\s?(.*)$/);
      if(m){flush();key=m[1].toUpperCase();buf=[m[2]||''];continue}
      const bare=line.trim().toUpperCase();
      if(bareKeys.has(bare)){flush();key=bare;buf=[];continue}
      if(key) buf.push(line);
    }
    flush();
    const val=(...keys)=>{for(const k of keys){const v=clean(out[k]);if(v)return v}return ''};
    const opts=['A','B','C','D'].map(id=>({
      id,
      english:val(id+'_EN',id+'_ENGLISH'),
      hindi:val(id+'_HI',id+'_HINDI')
    })).filter(o=>o.english||o.hindi);
    const level=val('LEVEL');
    const q={
      source:{sourceName:val('SOURCE_NAME')||defaults.SOURCE_NAME||fileName,sourcePage:val('SOURCE_PAGE')||defaults.SOURCE_PAGE,sourceQNo:val('SOURCE_QUESTION_NO'),sourceVersion:val('SOURCE_VERSION')||defaults.SOURCE_VERSION},
      exam:{exam:val('EXAM')||defaults.EXAM,year:val('YEAR')||defaults.YEAR,paper:val('PAPER')||defaults.PAPER,stage:val('STAGE')||defaults.STAGE,branch:val('BRANCH')||defaults.BRANCH,paperDate:val('PAPER_DATE')||defaults.PAPER_DATE,shift:val('SHIFT')||defaults.SHIFT},
      classification:{subject:val('SUBJECT')||defaults.SUBJECT,topic:val('TOPIC')||defaults.TOPIC,chapter:val('CHAPTER')||defaults.CHAPTER,category:val('CATEGORY')||defaults.CATEGORY,type:val('TYPE')||defaults.TYPE,group:val('GROUP')||defaults.GROUP},
      content:{english:val('QUESTION_EN','QUESTION_ENGLISH'),hindi:val('QUESTION_HI','QUESTION_HINDI'),options:opts,answer:val('ANSWER'),explanationEnglish:val('EXPLANATION_EN','EXPLANATION_ENGLISH'),explanationHindi:val('EXPLANATION_HI','EXPLANATION_HINDI')},
      formula:val('FORMULA'),diagram:val('DIAGRAM')||'NOT_PRESENT',imageReference:val('IMAGE_REFERENCE'),difficulty:val('DIFFICULTY'),questionsBase:val('QUESTIONS_BASE','QUESTION_BASE'),ocrStatus:val('OCR_STATUS')||'CLEAR',importVersion:val('IMPORT_VERSION')||'1.0',originalQNo:val('SOURCE_QUESTION_NO'),parserIndex:index
    };
    // In the verified TXT format LEVEL: Numerical is the Question Base, not difficulty.
    if(!q.questionsBase && /^(NUMERICAL|NUMERIC|CALCULATION|CALCULATIVE)$/i.test(level)) q.questionsBase='NUMERICAL';
    if(!q.questionsBase && /^(THEORY|THEORETICAL|CONCEPT|CONCEPTUAL)$/i.test(level)) q.questionsBase='THEORY';
    if(!q.questionsBase && /NUMERICAL/i.test(q.classification.type)) q.questionsBase='NUMERICAL';
    return normalizeRecord(q);
  }

  function parseTXTStrict(raw,fileName){
    const text=String(raw||'').replace(/\r/g,'');
    // Accept both the canonical START/END format and the user's verified
    // numbered format: === QUESTION 01 === ... === QUESTION END ===
    const matches=[...text.matchAll(/===\s*QUESTION(?:\s+(?:START|\d+))?\s*===([\s\S]*?)===\s*QUESTION\s+END\s*===/gi)];
    if(!matches.length) return {ok:false,code:'STRICT_BLOCKS_NOT_FOUND'};
    const firstIndex=matches[0].index||0;
    const header=text.slice(0,firstIndex);
    const defaults={};
    for(const line of header.split('\n')){
      const m=line.match(/^\s*([A-Za-z][A-Za-z0-9_]*):\s?(.*)\s*$/);
      if(m) defaults[m[1].toUpperCase()]=clean(m[2]);
    }
    return {ok:true,records:matches.map((m,i)=>parseKVBlock(m[1],fileName,i+1,defaults))};
  }

  function buildHtml(q){
    const c=q.content||{};const opts=(c.options||[]).map(o=>`<label class="option"><input type="radio" name="q_${escText(q.questionId)}" value="${escText(o.id)}"><span class="opt-letter">${escText(o.id)}.</span><span><span class="english-text">${escText(o.english)}</span>${o.hindi?`<br><span class="hindi-text">${escText(o.hindi)}</span>`:''}</span></label>`).join('');
    return `<article class="question" data-question-id="${escText(q.questionId)}"><div class="qhead"><span class="qnum">Q${escText(q.source.sourceQNo||'')}</span></div><div class="stem"><div class="lang english-text">${escText(c.english)}</div>${c.hindi?`<div class="lang hi hindi-text">${escText(c.hindi)}</div>`:''}</div><div class="options">${opts}</div></article>`;
  }

  function projection(q){
    const ref={questionId:q.questionId,originalQNo:Number((q.source.sourceQNo||'').match(/\d+/)?.[0]||0),sourceOrder:0};
    const props=['html','answer','explanation','sourceReference','examInfo','topicTitle','subject','topic','questionBase','difficulty','questionId'];
    Object.defineProperties(ref,{
      html:{enumerable:false,get:()=>buildHtml(q)},answer:{enumerable:false,get:()=>q.content.answer},explanation:{enumerable:false,get:()=>q.content.explanationEnglish},
      sourceReference:{enumerable:false,get:()=>q.source.sourceName||''},examInfo:{enumerable:false,get:()=>[q.exam.exam,q.exam.year,q.exam.shift].filter(Boolean).join(' • ')},
      topicTitle:{enumerable:false,get:()=>q.classification.topic||q.classification.chapter||''},subject:{enumerable:false,get:()=>q.classification.subject||''},topic:{enumerable:false,get:()=>slug(q.classification.topic||q.classification.chapter)},
      questionBase:{enumerable:false,get:()=>q.questionsBase},difficulty:{enumerable:false,get:()=>q.difficulty}
    });
    return ref;
  }

  function rebuildModules(){
    const map=new Map();
    const buckets=new Map();
    // HARD GROUP BOUNDARY: one visible group can contain MAXIMUM 20 questions.
    // Source GROUP metadata is never allowed to create a giant UI group.
    records.forEach((q,recordIndex)=>{
      if(q.status==='ARCHIVED') return;
      const subject=slug(q.classification.subject)||'unclassified';
      const topic=slug(q.classification.topic||q.classification.chapter)||'unclassified';
      const type=slug(q.classification.type||'pyq')||'pyq';
      const moduleId=[subject,topic,type].join('-');
      if(!map.has(moduleId)) map.set(moduleId,{moduleId,subject,subjectTitle:APP.registry[subject]?.title||subject.toUpperCase(),topic,topicTitle:q.classification.topic||q.classification.chapter||'Unclassified',testType:type,testTypeTitle:q.classification.type||'PYQ',icon:'📥',status:'AVAILABLE',groups:[]});
      const base=String(q.questionsBase||q.questionBase||q.classification.questionsBase||q.classification.base||'').trim().toLowerCase();
      const difficulty=String(q.difficulty||q.classification.difficulty||'').trim().toLowerCase();
      const bucketKey=moduleId+'::'+base+'::'+difficulty;
      if(!buckets.has(bucketKey)) buckets.set(bucketKey,{moduleId,base,difficulty,questions:[]});
      buckets.get(bucketKey).questions.push({q,recordIndex});
    });

    const moduleCounters=new Map();
    for(const b of buckets.values()){
      const m=map.get(b.moduleId);
      for(let start=0;start<b.questions.length;start+=20){
        const chunk=b.questions.slice(start,start+20);
        const n=(moduleCounters.get(b.moduleId)||0)+1;
        moduleCounters.set(b.moduleId,n);
        const gid='g-'+String(n).padStart(2,'0');
        const first=chunk[0]?.q||{};
        const pathBase=first.questionsBase||first.questionBase||first.classification?.questionsBase||first.classification?.base||'';
        const pathDiff=first.difficulty||first.classification?.difficulty||'';
        const g={groupId:gid,originalGroupNo:n,sourceOrder:n,title:'G-'+String(n).padStart(2,'0'),description:`${pathBase||'Questions'}${pathDiff?' • '+pathDiff:''} • ${chunk.length} questions (MAX 20)`,questions:[]};
        chunk.forEach((item,i)=>{
          const q=item.q;
          q.groupId=gid;
          q.classification=q.classification||{};
          q.classification.group=gid;
          q.path=[q.classification.subject,q.classification.topic||q.classification.chapter,pathBase,pathDiff,gid].filter(Boolean).join(' → ');
          const ref=projection(q); ref.sourceOrder=i+1; g.questions.push(ref);
        });
        m.groups.push(g);
      }
    }
    APP.modules=[...map.values()];
    APP.modules.forEach(m=>m.groups.sort((a,b)=>a.originalGroupNo-b.originalGroupNo));
  }

  function saveStore(){const audit=window.__MASTER_IMPORT_AUDIT__||{status:'READY'};if(window.MasterQuestionIndexedDB?.persistRecords){window.__MASTER_IDB_LAST_SAVE__=window.MasterQuestionIndexedDB.persistRecords(records,audit).catch(e=>{window.__MASTER_IDB_STORAGE_STATUS__={ok:false,error:e.message||String(e)};throw e;});}else{window.__MASTER_IDB_LAST_SAVE__=Promise.resolve(false);}try{localStorage.removeItem(STORE_KEY);localStorage.removeItem(AUDIT_KEY)}catch(e){}}
  function reportCounts(){const r={TOTAL_INPUT:0,IMPORTED:0,UPDATED:0,DUPLICATE:0,REVIEW_REQUIRED:0,REJECTED:0,EASY:0,MODERATE:0,TOUGH:0,THEORY:0,NUMERICAL:0,PATH_RESOLVED:0,REGISTRY_UPDATED:0};records.forEach(q=>{if(q.difficulty==='EASY')r.EASY++;if(q.difficulty==='MODERATE')r.MODERATE++;if(q.difficulty==='TOUGH')r.TOUGH++;if(q.questionsBase==='THEORY')r.THEORY++;if(q.questionsBase==='NUMERICAL')r.NUMERICAL++;if(q.path)r.PATH_RESOLVED++});r.IMPORTED=records.length;return r}

  function commitIncoming(incoming){
    const result={TOTAL_INPUT:incoming.length,IMPORTED:0,UPDATED:0,DUPLICATE:0,REVIEW_REQUIRED:0,REJECTED:0,details:[],EASY:0,MODERATE:0,TOUGH:0,THEORY:0,NUMERICAL:0,PATH_RESOLVED:0,REGISTRY_UPDATED:0};
    const next=records.map(x=>({...x}));
    for(const raw of incoming){
      const q=normalizeRecord(raw);const v=validate(q);
      if(v.status==='REJECTED'){result.REJECTED++;result.details.push({questionId:q.questionId,status:'REJECTED',errors:v.errors,warnings:v.warnings});continue}
      let idx=next.findIndex(x=>x.questionId===q.questionId);
      if(idx<0){const sk=sourceKey(q);if(sk!=='::') idx=next.findIndex(x=>sourceKey(x)===sk);}
      if(idx<0){const fp=q.fingerprint;idx=next.findIndex(x=>x.fingerprint===fp||x.contentSignature===q.contentSignature);}
      if(idx>=0){
        if(next[idx].fingerprint===q.fingerprint && next[idx].contentSignature===q.contentSignature){result.DUPLICATE++;result.details.push({questionId:next[idx].questionId,status:'DUPLICATE'});continue}
        q.questionId=next[idx].questionId;q.createdAt=next[idx].createdAt;q.version=Number(next[idx].version||1)+1;q.updatedAt=new Date().toISOString();next[idx]=q;result.UPDATED++;result.details.push({questionId:q.questionId,status:'UPDATED',warnings:v.warnings});
      }else{
        q.questionId=stableId(q);q.createdAt=new Date().toISOString();q.updatedAt=q.createdAt;q.version=1;next.push(q);result.IMPORTED++;result.details.push({questionId:q.questionId,status:v.status==='REVIEW_REQUIRED'?'REVIEW_REQUIRED':'IMPORTED',warnings:v.warnings});
        if(v.status==='REVIEW_REQUIRED') result.REVIEW_REQUIRED++;
      }
    }
    const integrity=new Set();for(const q of next){if(integrity.has(q.questionId)){result.REJECTED++;continue}integrity.add(q.questionId)}
    records=next;
    rebuildModules();saveStore();
    const c=reportCounts();Object.assign(result,{EASY:c.EASY,MODERATE:c.MODERATE,TOUGH:c.TOUGH,THEORY:c.THEORY,NUMERICAL:c.NUMERICAL,PATH_RESOLVED:c.PATH_RESOLVED,REGISTRY_UPDATED:records.length});
    window.__MASTER_IMPORT_AUDIT__={status:'COMPLETED',generatedAt:new Date().toISOString(),...result};
    return result;
  }

  function parseLegacyTXT(raw,fileName){
    if(window.SourceParserEngine?.parseTXT){
      const p=window.SourceParserEngine.parseTXT(raw);if(p.ok&&p.candidates?.length){return {ok:true,records:p.candidates.map(c=>normalizeRecord(c))}}
    }
    return {ok:false,code:'TXT_PARSE_FAILED'};
  }

  async function extractFile(f){
    const ext=f.name.toLowerCase().split('.').pop();
    if(['txt','json','html','htm','csv'].includes(ext)) return {raw:await f.text(),ext};
    if(ext==='pdf'&&window.parsePDF)return {raw:await window.parsePDF(f),ext:'txt'};
    if(['docx','xlsx','xls'].includes(ext)&&window.parseOffice)return {raw:await window.parseOffice(f,ext==='xls'?'xlsx':ext),ext:'txt'};
    if(['png','jpg','jpeg','webp'].includes(ext)&&window.parseImageOCR)return {raw:await window.parseImageOCR(f),ext:'txt'};
    throw new Error('UNSUPPORTED_SOURCE_FORMAT');
  }

  async function strictRunImport(){
    const f=document.querySelector('#impFile')?.files?.[0], report=document.querySelector('#importReport');if(!report)return;
    if(!f){report.innerHTML='<p class="report-review">Select a source file.</p>';return}
    try{
      const {raw,ext}=await extractFile(f);let parsed;
      if(ext==='txt') parsed=parseTXTStrict(raw,f.name); else if(ext==='json') parsed={ok:false,code:'JSON_REVIEW_USE_PHASE_ENGINE'}; else if(ext==='html'||ext==='htm') parsed=parseTXTStrict(raw,f.name); else parsed=parseLegacyTXT(raw,f.name);
      if(!parsed.ok){const legacy=parseLegacyTXT(raw,f.name);if(legacy.ok)parsed=legacy;}
      if(!parsed.ok) throw new Error(parsed.code||'SOURCE_PARSE_FAILED');
      const target=document.querySelector('#impTopic')?.value?.trim();
      if(target) parsed.records.forEach(q=>{q.classification.topic=target});
      const r=commitIncoming(parsed.records);
      if(window.__MASTER_IDB_LAST_SAVE__) await window.__MASTER_IDB_LAST_SAVE__;
      const storageCheck=window.__MASTER_IDB_STORAGE_STATUS__;
      if(storageCheck && storageCheck.ok===false) throw new Error('PERSISTENCE_FAILED: '+storageCheck.error);
      report.innerHTML=`<div class="report-ok"><b>IMPORT COMPLETE</b></div><p><b>${escText(f.name)}</b><br>Total Input: ${r.TOTAL_INPUT}<br>Imported: ${r.IMPORTED}<br>Updated: ${r.UPDATED}<br>Duplicate: ${r.DUPLICATE}<br>Review Required: ${r.REVIEW_REQUIRED}<br>Rejected: ${r.REJECTED}</p><p>Difficulty — Easy: ${r.EASY} • Moderate: ${r.MODERATE} • Tough: ${r.TOUGH}</p><p>Question Base — Theory: ${r.THEORY} • Numerical: ${r.NUMERICAL}</p><p>Path Resolved: ${r.PATH_RESOLVED} • Registry Updated: ${r.REGISTRY_UPDATED}</p>`;
      render(R.current||{level:'master'});
    }catch(e){report.innerHTML='<div class="danger-box"><b>IMPORT FAILED</b><br>'+escText(e.message)+'</div>'}
  }

  window.MasterQuestionStoreStrict={version:'STRICT-MASTER-QUESTION-STORE-V1',list:()=>records.slice(),get:id=>records.find(q=>q.questionId===id)||null,getRecords:()=>records.slice(),replaceRecords:next=>{records=(Array.isArray(next)?next:[]).map(normalizeRecord);rebuildModules();return records.length},saveStore,validate,stats:reportCounts,rebuildModules,commitIncoming};
  window.runImport=strictRunImport;

  /* Restore canonical records; otherwise keep the intentionally empty baseline. */
  try{records=readJSON(STORE_KEY,[]);if(!Array.isArray(records))records=[];records=records.map(normalizeRecord);rebuildModules();}catch(e){records=[];APP.modules=[]}

  /* Patch count/search paths to always derive from the current store projection. */
  window.__MASTER_STRICT_DIAGNOSTICS__=function(){
    const ids=records.map(q=>q.questionId);const unique=new Set(ids);return {status:ids.length===unique.size?'PASS':'FAIL',questions:records.length,uniqueQuestionIds:unique.size,subjects:[...new Set(records.map(q=>q.classification.subject).filter(Boolean))],difficulty:reportCounts(),legacyModules:APP.modules.length};
  };

  /* Student renderer safety: projections contain only presentation getters;
     metadata remains in canonical store and is never injected into question UI. */
  try{if(window.R?.current)render(R.current)}catch(e){}
})();
</script>

<script id="admin-structure-builder-v1">

      {id:'all-pyq',label:'ALL PYQ QUESTIONS',segments:['MASTER','ALL PYQ QUESTIONS'],target:'all',enabled:true}
    ]
  };

  let cfg=null, activeTab='hierarchy';
  const clone=o=>JSON.parse(JSON.stringify(o));
  const esc2=v=>{const s=String(v??'');return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))};
  const byId=id=>document.getElementById(id);
  const btnClass=(label)=>`<button class="btn">${label}</button>`;

  async function db(){

  }
  async function loadCfg(){
    try{
      const d=await db();
      if(d){
        const tx=d.transaction(['metadata'],'readonly');
        const req=tx.objectStore('metadata').get(META_KEY);
        const row=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});

      }
    }catch(e){}
    try{const x=JSON.parse(localStorage.getItem('MASTER_TESTBOOK_STRUCTURE_CONFIG')||'null');if(x){cfg=normalize(x);return cfg;}}catch(e){}
    cfg=clone(DEFAULT);return cfg;
  }
  async function saveCfg(){
    cfg=normalize(cfg);
    try{
      const d=await db();
      if(!d) throw new Error('IndexedDB unavailable');
      const tx=d.transaction(['metadata'],'readwrite');
      tx.objectStore('metadata').put({key:META_KEY,value:cfg,updatedAt:new Date().toISOString()});
      await new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error||new Error('SAVE_FAILED'));tx.onabort=()=>rej(tx.error||new Error('SAVE_ABORTED'))});
      localStorage.setItem('MASTER_TESTBOOK_STRUCTURE_CONFIG',JSON.stringify(cfg));

    }catch(e){
      try{localStorage.setItem('MASTER_TESTBOOK_STRUCTURE_CONFIG',JSON.stringify(cfg));}catch(_e){}
      throw e;
    }
  }
  function normalize(x){
    x=x&&typeof x==='object'?x:{};
    return {
      version:1,
      hierarchy:Array.isArray(x.hierarchy)?x.hierarchy.map((a,i)=>({id:cleanId(a.id)||('level-'+(i+1)),label:String(a.label||a.id||('Level '+(i+1))),enabled:a.enabled!==false})):clone(DEFAULT.hierarchy),
      buttons:Array.isArray(x.buttons)?x.buttons.map((a,i)=>({id:cleanId(a.id)||('button-'+(i+1)),label:String(a.label||a.id||('Button '+(i+1))),action:a.action||'route',route:String(a.route||''),enabled:a.enabled!==false})):clone(DEFAULT.buttons),
      paths:Array.isArray(x.paths)?x.paths.map((a,i)=>({id:cleanId(a.id)||('path-'+(i+1)),label:String(a.label||a.id||('Path '+(i+1))),segments:Array.isArray(a.segments)?a.segments.map(String):String(a.segments||'').split('>').map(s=>s.trim()).filter(Boolean),target:String(a.target||''),enabled:a.enabled!==false})):clone(DEFAULT.paths)
    };
  }
  function cleanId(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50)}
  function uniqueId(arr,base){let id=cleanId(base)||'item';let n=1,orig=id;while(arr.some(x=>x.id===id)){id=orig+'-'+(++n)}return id}
  function openBuilder(){loadCfg().then(()=>renderBuilder()).catch(e=>alert('Structure Builder load failed: '+e.message))}
  window.openStructureBuilder=openBuilder;

  function renderBuilder(){
    if(typeof closeDrawer==='function') closeDrawer();
    const v=byId('view'); if(!v)return;
    v.innerHTML=`<div class="asb-page">
      <section class="hero"><h1>🧩 Admin Structure Builder</h1><p>Manage hierarchy, navigation buttons and derived paths without touching canonical questions.</p><div class="asb-status" id="asbStatus">IndexedDB configuration store • unsaved changes are local to this screen</div></section>
      <div class="asb-tabs">
        ${tab('hierarchy','Hierarchy')}${tab('buttons','Buttons')}${tab('paths','Paths')}${tab('prompt','⚡ Prompt Engine')}${tab('preview','Preview')}
      </div>
      <section class="panel card" id="asbPanel"></section>
      <section class="panel card"><h3>🔐 Safety Rules</h3><p class="muted">Question IDs, question content, source Q.No., answers and Master Question Store records are not edited by this builder. Structure changes update configuration/placement only.</p></section>
    </div>`;
    renderTab();
  }
  function tab(id,label){return `<button class="asb-tab ${activeTab===id?'active':''}" data-asb-tab="${id}">${label}</button>`}
  // ============================================================
  // PROMPT ENGINE V1 — deterministic structure-update interpreter
  // ============================================================
  // This engine intentionally changes STRUCTURE CONFIG only. It never
  // edits canonical question content, Master Question IDs, answers,
  // source metadata, or user state.
  const PROMPT_ENGINE_VERSION='1.0';
  const PROMPT_HEADER='MASTER_STRUCTURE_UPDATE_V1';

  function promptBool(v, fallback=true){
    const x=String(v??'').trim().toLowerCase();
    if(['true','yes','enabled','on','1'].includes(x))return true;
    if(['false','no','hidden','off','0'].includes(x))return false;
    return fallback;
  }
  function promptClean(v){return String(v??'').trim();}
  function promptValue(map,key,def=''){
    return Object.prototype.hasOwnProperty.call(map,key)?map[key]:def;
  }
  function parsePromptEngine(text){
    const raw=String(text||'').replace(/\r/g,'').trim();
    if(!raw)throw new Error('Prompt is empty.');
    // JSON mode is supported for maximum determinism.
    let jsonText=raw;
    if(raw.includes('```')) jsonText=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
    if(jsonText.startsWith('{')){
      try{
        const j=JSON.parse(jsonText);
        if(j && (j.MASTER_STRUCTURE_UPDATE_V1 || j.operations || j.changes)){
          const ops=j.operations||j.changes||j.MASTER_STRUCTURE_UPDATE_V1?.operations||[];
          if(!Array.isArray(ops))throw new Error('operations must be an array.');
          return {mode:'JSON',operations:ops.map(normalizePromptOperation),warnings:[]};
        }
      }catch(e){ if(jsonText.startsWith('{')) throw new Error('Invalid JSON prompt: '+e.message); }
    }
    const lines=raw.split('\n').map(x=>x.trim()).filter(x=>x && !x.startsWith('#') && !x.startsWith('//'));
    const warnings=[];
    if(lines[0]!==PROMPT_HEADER){warnings.push('Header missing; commands were still parsed using strict block syntax.');}
    const ops=[]; let cur=null;
    const known=new Set(['ADD_LEVEL','UPDATE_LEVEL','DELETE_LEVEL','MOVE_LEVEL','ADD_BUTTON','UPDATE_BUTTON','DELETE_BUTTON','ADD_PATH','UPDATE_PATH','DELETE_PATH']);
    function finish(){if(!cur)return; ops.push(normalizePromptOperation(cur));cur=null;}
    lines.forEach(line=>{
      if(/^END$/i.test(line)){finish();return;}
      if(known.has(line.toUpperCase())){finish();cur={op:line.toUpperCase()};return;}
      const m=line.match(/^([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.*)$/);
      if(m){if(!cur){warnings.push('Ignored field outside a command: '+m[1]);return;}cur[m[1].toLowerCase()]=m[2];return;}
      // Allow one-line command: ADD_BUTTON id=... label=... route=...
      const one=line.match(/^(ADD|UPDATE|DELETE)_(LEVEL|BUTTON|PATH)\b\s*(.*)$/i);
      if(one){finish();cur={op:(one[1]+'_'+one[2]).toUpperCase()};
        const rest=one[3].trim(); if(rest){rest.split(/\s+(?=[A-Za-z_][A-Za-z0-9_-]*=)/).forEach(pair=>{const z=pair.split('=');if(z.length>1)cur[z.shift().toLowerCase()]=z.join('=');});}
      }else warnings.push('Ignored unrecognized line: '+line);
    });
    finish();
    if(!ops.length)throw new Error('No valid structure commands found.');
    return {mode:'COMMAND',operations:ops,warnings};
  }
  function normalizePromptOperation(o){
    o=o&&typeof o==='object'?o:{};
    const op=String(o.op||o.operation||o.action||'').toUpperCase().replace(/\s+/g,'_');
    const type=op.split('_')[1]||'';
    const x={op,type};
    ['id','label','action','route','target','segments','enabled','status','from','to'].forEach(k=>{
      if(o[k]!==undefined)x[k]=typeof o[k]==='string'?o[k].trim():o[k];
    });
    if(x.segments!==undefined && !Array.isArray(x.segments))x.segments=String(x.segments).split('>').map(s=>s.trim()).filter(Boolean);
    if(x.enabled===undefined && x.status!==undefined)x.enabled=promptBool(x.status,true);
    if(x.enabled!==undefined)x.enabled=typeof x.enabled==='boolean'?x.enabled:promptBool(x.enabled,true);
    return x;
  }
  function validatePromptOperation(op){
    const allowed=new Set(['ADD_LEVEL','UPDATE_LEVEL','DELETE_LEVEL','MOVE_LEVEL','ADD_BUTTON','UPDATE_BUTTON','DELETE_BUTTON','ADD_PATH','UPDATE_PATH','DELETE_PATH']);
    if(!allowed.has(op.op))return 'Unsupported operation: '+op.op;
    if(!op.id && !['MOVE_LEVEL'].includes(op.op))return op.op+' requires ID.';
    if(op.op==='MOVE_LEVEL' && !op.id)return 'MOVE_LEVEL requires ID.';
    if(/^ADD_/.test(op.op) && !op.label && op.type!=='LEVEL')return op.op+' requires LABEL.';
    if(/^ADD_/.test(op.op) && op.type==='LEVEL' && !op.label)return op.op+' requires LABEL.';
    return null;
  }
  function applyPromptOperation(op, draft){
    const err=validatePromptOperation(op);if(err)throw new Error(err);
    const list=op.type==='LEVEL'?draft.hierarchy:(op.type==='BUTTON'?draft.buttons:draft.paths);
    const find=()=>list.find(x=>x.id===cleanId(op.id));
    if(op.op==='ADD_LEVEL'){
      const id=uniqueId(list,op.id||'level');list.push({id,label:promptClean(op.label||id),enabled:op.enabled!==false});return 'Added level '+id;
    }
    if(op.op==='UPDATE_LEVEL'){
      const x=find();if(!x)throw new Error('Level not found: '+op.id);if(op.label!==undefined)x.label=promptClean(op.label);if(op.enabled!==undefined)x.enabled=!!op.enabled;return 'Updated level '+x.id;
    }
    if(op.op==='DELETE_LEVEL'){
      const i=list.findIndex(x=>x.id===cleanId(op.id));if(i<0)throw new Error('Level not found: '+op.id);list.splice(i,1);return 'Deleted level '+op.id;
    }
    if(op.op==='MOVE_LEVEL'){
      const i=list.findIndex(x=>x.id===cleanId(op.id));if(i<0)throw new Error('Level not found: '+op.id);
      const to=String(op.to||op.target||'').toLowerCase();let ni=i;
      if(to==='up')ni=Math.max(0,i-1);else if(to==='down')ni=Math.min(list.length-1,i+1);else if(/^\d+$/.test(to))ni=Math.max(0,Math.min(list.length-1,Number(to)));
      if(ni!==i){const [x]=list.splice(i,1);list.splice(ni,0,x);}return 'Moved level '+op.id;
    }
    if(op.op==='ADD_BUTTON'){
      const id=uniqueId(list,op.id||'button');list.push({id,label:promptClean(op.label||id),action:promptClean(op.action||'custom')||'custom',route:promptClean(op.route||op.target||''),enabled:op.enabled!==false});return 'Added button '+id;
    }
    if(op.op==='UPDATE_BUTTON'){
      const x=find();if(!x)throw new Error('Button not found: '+op.id);['label','action','route'].forEach(k=>{if(op[k]!==undefined)x[k]=promptClean(op[k]);});if(op.enabled!==undefined)x.enabled=!!op.enabled;return 'Updated button '+x.id;
    }
    if(op.op==='DELETE_BUTTON'){
      const i=list.findIndex(x=>x.id===cleanId(op.id));if(i<0)throw new Error('Button not found: '+op.id);list.splice(i,1);return 'Deleted button '+op.id;
    }
    if(op.op==='ADD_PATH'){
      const id=uniqueId(list,op.id||'path');list.push({id,label:promptClean(op.label||id),segments:Array.isArray(op.segments)?op.segments.map(String):[],target:promptClean(op.target||op.route||''),enabled:op.enabled!==false});return 'Added path '+id;
    }
    if(op.op==='UPDATE_PATH'){
      const x=find();if(!x)throw new Error('Path not found: '+op.id);if(op.label!==undefined)x.label=promptClean(op.label);if(op.segments!==undefined)x.segments=Array.isArray(op.segments)?op.segments.map(String):String(op.segments).split('>').map(s=>s.trim()).filter(Boolean);if(op.target!==undefined)x.target=promptClean(op.target);if(op.enabled!==undefined)x.enabled=!!op.enabled;return 'Updated path '+x.id;
    }
    if(op.op==='DELETE_PATH'){
      const i=list.findIndex(x=>x.id===cleanId(op.id));if(i<0)throw new Error('Path not found: '+op.id);list.splice(i,1);return 'Deleted path '+op.id;
    }
    throw new Error('Unhandled operation '+op.op);
  }
  function cloneCfgForPrompt(){return clone(normalize(cfg));}
  function applyPromptText(text,doSave=false){
    const parsed=parsePromptEngine(text);const draft=cloneCfgForPrompt();const results=[];
    parsed.operations.forEach(op=>results.push(applyPromptOperation(op,draft)));
    draft.hierarchy.forEach((x,i)=>{x.id=cleanId(x.id)||('level-'+(i+1));});
    draft.buttons.forEach((x,i)=>{x.id=cleanId(x.id)||('button-'+(i+1));});
    draft.paths.forEach((x,i)=>{x.id=cleanId(x.id)||('path-'+(i+1));});
    cfg=normalize(draft);
    if(doSave)return saveCfg().then(()=>({parsed,results,cfg:clone(cfg)}));
    return Promise.resolve({parsed,results,cfg:clone(cfg)});
  }
  function promptTemplate(){return `${PROMPT_HEADER}\nMODE: APPLY_STRUCTURE\n\nADD_BUTTON\nID: daily-test\nLABEL: 🎯 Daily Test\nACTION: custom\nROUTE: daily-test\nENABLED: true\nEND\n\nADD_PATH\nID: daily-test\nLABEL: 🎯 Daily Test\nSEGMENTS: MASTER > TEST > DAILY TEST\nTARGET: daily-test\nENABLED: true\nEND`}
  function renderPromptEngine(p){
    p.innerHTML=`<div class="section-head"><div><h2>⚡ Prompt Engine</h2><p class="muted">Paste a Structure Builder prompt generated for this TestBook. The engine interprets only approved structure commands and updates the live configuration.</p></div></div>
      <div class="panel" style="margin-bottom:12px;padding:12px;border:1px solid #dbe3ee;border-radius:14px;background:#f8fafc"><b>Safety:</b> Prompt Engine can modify <b>Hierarchy, Buttons and Paths</b> only. It cannot edit questions, answers, source data, Master Question IDs or user progress.</div>
      <textarea id="asbPrompt" style="width:100%;min-height:260px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:13px/1.5 monospace;box-sizing:border-box" placeholder="Paste MASTER_STRUCTURE_UPDATE_V1 prompt here..."></textarea>
      <div class="asb-toolbar" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="asbPromptTemplate">Load Example</button><button class="btn" id="asbPromptAnalyze">Analyze</button><button class="btn primary" id="asbPromptApply">Apply + Save</button><button class="btn" id="asbPromptClear">Clear</button></div>
      <div id="asbPromptResult" class="panel card" style="margin-top:12px;display:none"></div>
      <div class="panel card" style="margin-top:12px"><h3>Supported commands</h3><div class="asb-code">ADD_LEVEL / UPDATE_LEVEL / DELETE_LEVEL / MOVE_LEVEL\nADD_BUTTON / UPDATE_BUTTON / DELETE_BUTTON\nADD_PATH / UPDATE_PATH / DELETE_PATH</div><p class="muted">Use one command block at a time. Finish each block with END. JSON operations are also accepted.</p></div>`;
    const ta=byId('asbPrompt'),out=byId('asbPromptResult');
    byId('asbPromptTemplate').onclick=()=>{ta.value=promptTemplate();};
    byId('asbPromptClear').onclick=()=>{ta.value='';out.style.display='none';};
    byId('asbPromptAnalyze').onclick=()=>{
      try{const x=parsePromptEngine(ta.value);out.style.display='block';out.innerHTML=`<h3>🔎 Preview — ${esc2(x.operations.length)} operation(s)</h3><div class="asb-code">${esc2(x.operations.map((o,i)=>(i+1)+'. '+o.op+' '+(o.id||'')).join('\n'))}</div>${x.warnings.length?'<p style="color:#b45309">⚠ '+esc2(x.warnings.join(' | '))+'</p>':'<p style="color:#166534">✅ Prompt syntax valid.</p>'}`;}
      catch(e){out.style.display='block';out.innerHTML='<p style="color:#b91c1c">❌ '+esc2(e.message)+'</p>';}
    };
    byId('asbPromptApply').onclick=async()=>{
      try{
        const x=await applyPromptText(ta.value,true);window.dispatchEvent(new CustomEvent('master:structure-saved',{detail:x.cfg}));out.style.display='block';out.innerHTML=`<h3>✅ Applied and saved</h3><div class="asb-code">${esc2(x.results.join('\n'))}</div><p style="color:#166534">Live Registry/Router/Drawer/Breadcrumb refresh triggered.</p>`;
      }catch(e){out.style.display='block';out.innerHTML='<p style="color:#b91c1c">❌ Nothing was saved. '+esc2(e.message)+'</p>';}
    };
  }

  function renderTab(){
    document.querySelectorAll('[data-asb-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.asbTab;renderBuilder()});
    const p=byId('asbPanel');if(!p)return;
    if(activeTab==='hierarchy')renderHierarchy(p);
    else if(activeTab==='buttons')renderButtons(p);
    else if(activeTab==='paths')renderPaths(p);
    else if(activeTab==='prompt')renderPromptEngine(p);
    else renderPreview(p);
  }
  function input(label,value,attr){return `<label><span class="muted" style="display:block;font-size:11px;font-weight:800;margin-bottom:3px">${label}</span><input ${attr||''} value="${esc2(value)}"></label>`}
  function renderHierarchy(p){
    p.innerHTML=`<div class="section-head"><div><h2>Hierarchy Levels</h2><p class="muted">Change the order of structural levels. This does not change Question IDs.</p></div><div class="asb-toolbar"><button class="btn primary" id="asbAddLevel">+ Add Level</button><button class="btn" id="asbSave">Save Structure</button><button class="btn" id="asbReset">Reset Defaults</button></div></div><div class="asb-list">${cfg.hierarchy.map((x,i)=>`<div class="asb-item" data-index="${i}"><div class="asb-grip">☰</div><div class="asb-fields">${input('ID',x.id,'data-field="id"')} ${input('Label',x.label,'data-field="label"')}<label><span class="muted" style="display:block;font-size:11px;font-weight:800;margin-bottom:3px">Status</span><select data-field="enabled"><option value="true" ${x.enabled?'selected':''}>Enabled</option><option value="false" ${!x.enabled?'selected':''}>Hidden</option></select></label></div><div class="asb-actions"><button data-move="up">↑</button><button data-move="down">↓</button><button class="asb-danger" data-delete>Delete</button></div></div>`).join('')}</div>`;
    bindList(p,cfg.hierarchy);
    byId('asbAddLevel').onclick=()=>{cfg.hierarchy.push({id:uniqueId(cfg.hierarchy,'level'),label:'New Level',enabled:true});renderBuilder()};
    byId('asbSave').onclick=saveAndReport;
    byId('asbReset').onclick=()=>{if(confirm('Reset structure configuration to defaults?')){cfg=clone(DEFAULT);saveAndReport()}};
  }
  function renderButtons(p){
    p.innerHTML=`<div class="section-head"><div><h2>Navigation Buttons</h2><p class="muted">Build menu buttons and map them to existing routes/actions.</p></div><div class="asb-toolbar"><button class="btn primary" id="asbAddButton">+ Add Button</button><button class="btn" id="asbSave">Save Buttons</button></div></div><div class="asb-list">${cfg.buttons.map((x,i)=>`<div class="asb-item" data-index="${i}"><div class="asb-grip">☰</div><div class="asb-fields">${input('ID',x.id,'data-field="id"')} ${input('Label',x.label,'data-field="label"')}<label><span class="muted" style="display:block;font-size:11px;font-weight:800;margin-bottom:3px">Action</span><select data-field="action"><option value="route" ${x.action==='route'?'selected':''}>Route</option><option value="action" ${x.action==='action'?'selected':''}>App Action</option><option value="custom" ${x.action==='custom'?'selected':''}>Custom Route</option></select></label>${input('Route / Action',x.route,'data-field="route"')}<label><span class="muted" style="display:block;font-size:11px;font-weight:800;margin-bottom:3px">Status</span><select data-field="enabled"><option value="true" ${x.enabled?'selected':''}>Enabled</option><option value="false" ${!x.enabled?'selected':''}>Hidden</option></select></label></div><div class="asb-actions"><button data-move="up">↑</button><button data-move="down">↓</button><button class="asb-danger" data-delete>Delete</button></div></div>`).join('')}</div>`;
    bindList(p,cfg.buttons);
    byId('asbAddButton').onclick=()=>{cfg.buttons.push({id:uniqueId(cfg.buttons,'button'),label:'🆕 New Button',action:'custom',route:'custom-page',enabled:true});renderBuilder()};
    byId('asbSave').onclick=saveAndReport;
  }
  function renderPaths(p){
    p.innerHTML=`<div class="section-head"><div><h2>Path Builder</h2><p class="muted">Define logical paths. Paths are references; they never become Question IDs.</p></div><div class="asb-toolbar"><button class="btn primary" id="asbAddPath">+ Add Path</button><button class="btn" id="asbSave">Save Paths</button></div></div><div class="asb-list">${cfg.paths.map((x,i)=>`<div class="asb-item" data-index="${i}"><div class="asb-grip">☰</div><div class="asb-fields">${input('ID',x.id,'data-field="id"')} ${input('Label',x.label,'data-field="label"')} ${input('Segments (use >)',x.segments.join(' > '),'data-field="segments"')} ${input('Target route',x.target,'data-field="target"')}<label><span class="muted" style="display:block;font-size:11px;font-weight:800;margin-bottom:3px">Status</span><select data-field="enabled"><option value="true" ${x.enabled?'selected':''}>Enabled</option><option value="false" ${!x.enabled?'selected':''}>Hidden</option></select></label></div><div class="asb-actions"><button data-open-path="${esc2(x.id)}">Open</button><button data-move="up">↑</button><button data-move="down">↓</button><button class="asb-danger" data-delete>Delete</button></div></div>`).join('')}</div>`;
    bindList(p,cfg.paths);
    p.querySelectorAll('[data-open-path]').forEach(b=>b.onclick=()=>openConfiguredPath(b.dataset.openPath));
    byId('asbAddPath').onclick=()=>{cfg.paths.push({id:uniqueId(cfg.paths,'path'),label:'New Path',segments:['MASTER','NEW'],target:'custom-page',enabled:true});renderBuilder()};
    byId('asbSave').onclick=saveAndReport;
  }
  function bindList(p,list){
    p.querySelectorAll('.asb-item').forEach(row=>{
      const i=Number(row.dataset.index), item=list[i];
      row.querySelectorAll('[data-field]').forEach(el=>el.oninput=el.onchange=()=>{const f=el.dataset.field;if(f==='enabled')item[f]=el.value==='true';else if(f==='segments')item[f]=el.value.split('>').map(s=>s.trim()).filter(Boolean);else item[f]=el.value});
      row.querySelector('[data-delete]')?.addEventListener('click',()=>{if(confirm('Delete this item?')){list.splice(i,1);renderBuilder()}});
      row.querySelector('[data-move="up"]')?.addEventListener('click',()=>{if(i>0){[list[i-1],list[i]]=[list[i],list[i-1]];renderBuilder()}});
      row.querySelector('[data-move="down"]')?.addEventListener('click',()=>{if(i<list.length-1){[list[i+1],list[i]]=[list[i],list[i+1]];renderBuilder()}});
    });
  }
  function renderPreview(p){
    p.innerHTML=`<div class="section-head"><div><h2>Live Structure Preview</h2><p class="muted">This is the configuration that will be used by future router/UI integration.</p></div><button class="btn primary" id="asbSave">Save & Verify</button></div>
      <h3>Hierarchy</h3><div class="asb-code">${esc2(cfg.hierarchy.filter(x=>x.enabled).map(x=>x.label).join(' → '))}</div>
      <h3>Buttons</h3><div class="grid">${cfg.buttons.filter(x=>x.enabled).map(x=>`<button class="nav-card" data-preview-action="${esc2(x.id)}"><strong>${esc2(x.label)}</strong><small>${esc2(x.action)} → ${esc2(x.route)}</small></button>`).join('')}</div>
      <h3>Paths</h3><div class="asb-list">${cfg.paths.filter(x=>x.enabled).map(x=>`<div class="panel card"><b>${esc2(x.label)}</b><div class="muted">${esc2(x.segments.join(' → '))}</div><small>Target: ${esc2(x.target)}</small></div>`).join('')||'<div class="asb-empty">No active paths.</div>'}</div>`;
    byId('asbSave').onclick=saveAndReport;
    p.querySelectorAll('[data-preview-action]').forEach(b=>b.onclick=()=>runConfiguredButton(b.dataset.previewAction));
  }
  async function saveAndReport(){
    try{await saveCfg();byId('asbStatus').textContent='✅ Structure saved to IndexedDB metadata store.';byId('asbStatus').style.color='#166534';}
    catch(e){byId('asbStatus').textContent='⚠ IndexedDB save failed: '+e.message+'. Local configuration backup was attempted.';byId('asbStatus').style.color='#b45309';}
  }
  function findButton(id){return cfg.buttons.find(x=>x.id===id)}
  function runConfiguredButton(id){
    const x=findButton(id);if(!x)return;
    if(x.action==='route'){
      if(x.route==='master')go({level:'master'});else if(x.route==='all')go({level:'all'});else if(x.route==='settings')go({level:'settings'});else if(x.route==='stats')go({level:'stats'});else openConfiguredPath(x.route);
    }else if(x.action==='action'){
      if(x.route==='revision')openUser('revision');else if(x.route==='mistakes')openUser('mistakes');else if(x.route==='bookmarks')openUser('bookmarks');else if(x.route==='stats')openStats();else if(x.route==='settings')openSettings();else if(x.route==='backup')openBackup();else if(x.route==='import')openImport();
    }else openConfiguredPath(x.route);
  }
  function openConfiguredPath(id){
    const x=cfg.paths.find(p=>p.id===id)||cfg.paths.find(p=>p.target===id);if(!x)return;
    if(x.target==='master')go({level:'master'});
    else if(x.target==='all')go({level:'all'});
    else if(x.target==='settings')go({level:'settings'});
    else {
      const v=byId('view');if(!v)return;
      v.innerHTML=`<div class="page"><section class="hero"><h1>🧭 ${esc2(x.label)}</h1><p>${esc2(x.segments.join(' → '))}</p></section><section class="panel card"><h3>Path Definition</h3><div class="asb-code">${esc2(JSON.stringify(x,null,2))}</div><p class="muted">This path is a configuration reference. Questions remain in Master Question Store and keep their permanent IDs.</p><button class="btn" onclick="openStructureBuilder()">← Structure Builder</button></section></div>`;
    }
  }
  window.MasterStructureBuilder={version:'1.1',promptEngineVersion:PROMPT_ENGINE_VERSION,load:loadCfg,save:saveCfg,get:()=>clone(cfg||DEFAULT),open:openBuilder,runButton:runConfiguredButton,openPath:openConfiguredPath,parsePrompt:parsePromptEngine,applyPrompt:(text,save=true)=>applyPromptText(text,save)};

  // Add one delegated handler that runs only for the new drawer action.
  document.addEventListener('click',function(e){
    const b=e.target.closest('.drawer-btn[data-action="structure-builder"]');
    if(!b)return;
    e.preventDefault();e.stopImmediatePropagation();
    openBuilder();
  },true);

  // Optional dynamic navigation helper: reads saved button definitions without replacing the original drawer.
  window.getAdminStructureConfig=()=>clone(cfg||DEFAULT);
  loadCfg().catch(()=>{});
})();
</script>

<script id="MASTER_LIVE_STRUCTURE_ROUTER_V1">
(function(){
  'use strict';
  if(window.__MASTER_LIVE_STRUCTURE_ROUTER_V1__) return;
  window.__MASTER_LIVE_STRUCTURE_ROUTER_V1__=true;

  const q=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const existingExtras=[
    {id:'bookmarks',label:'⭐ Bookmarks',action:'action',route:'bookmarks',enabled:true},
    {id:'revision',label:'🧠 Revision',action:'action',route:'revision',enabled:true},
    {id:'mistakes',label:'❌ Mistake Book',action:'action',route:'mistakes',enabled:true},
    {id:'stats',label:'📊 Statistics',action:'action',route:'stats',enabled:true},
    {id:'settings',label:'⚙ Settings',action:'action',route:'settings',enabled:true},
    {id:'backup',label:'💾 Backup / Restore',action:'action',route:'backup',enabled:true},
    {id:'import',label:'📥 ADD THIS TOPIC',action:'action',route:'import',enabled:true}
  ];

  function cfg(){ return window.MasterStructureBuilder?.get?.() || {hierarchy:[],buttons:[],paths:[]}; }
  function ensureLegacyButtons(c){
    c.buttons=Array.isArray(c.buttons)?c.buttons:[];
    existingExtras.forEach(x=>{if(!c.buttons.some(b=>b.id===x.id))c.buttons.push({...x});});
    return c;
  }
  function runButton(id){
    const c=ensureLegacyButtons(cfg());
    const b=c.buttons.find(x=>x.id===id); if(!b||b.enabled===false)return;
    if(window.MasterStructureBuilder?.runButton) return window.MasterStructureBuilder.runButton(id);
    if(b.action==='action'){
      const map={bookmarks:'openUser',revision:'openUser',mistakes:'openUser',stats:'openStats',settings:'openSettings',backup:'openBackup',import:'openImport'};
      if(map[b.route]){ if(b.route==='bookmarks'||b.route==='revision'||b.route==='mistakes')window[map[b.route]](b.route);else window[map[b.route]](); }
    } else if(window.go){
      if(b.route==='master')go({level:'master'}); else if(b.route==='all')go({level:'all'});
      else openPath(b.route);
    }
  }
  function buildLiveDrawer(){
    const d=q('#drawer'); if(!d)return;
    let sec=q('#liveStructureNav');
    if(!sec){sec=document.createElement('div');sec.id='liveStructureNav';d.insertBefore(sec,d.firstChild?.nextSibling||d.firstChild);}
    const c=ensureLegacyButtons(cfg());
    const active=c.buttons.filter(b=>b.enabled!==false);
    sec.innerHTML=`<div class="drawer-group">LIVE NAVIGATION</div>`+active.map(b=>`<button class="drawer-btn live-structure-btn" data-live-button="${esc(b.id)}">${esc(b.label)}</button>`).join('');
    sec.querySelectorAll('[data-live-button]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();closeDrawer();runButton(b.dataset.liveButton);});
  }
  function levelLabel(id,fallback){
    const c=cfg(); const h=(c.hierarchy||[]).find(x=>x.id===id&&x.enabled!==false); return h?.label||fallback;
  }
  function makeCrumbs(route){
    if(!route)return [];
    const out=[['Master',{level:'master'}]];
    const s=APP?.registry?.[route.subject];
    if(route.level==='all')return [['Master',{level:'master'}],[levelLabel('all','All PYQ Questions'),{level:'all'}]];
    if(route.subject){
      out.push([s?.title||route.subject,{level:'subject',subject:route.subject}]);
    }
    if(route.chapter)out.push([route.chapter,{level:'chapter',subject:route.subject,chapter:route.chapter}]);
    if(route.topic)out.push([route.topic,{level:'topic',subject:route.subject,topic:route.topic}]);
    if(route.category)out.push([route.category,{level:'category',subject:route.subject,topic:route.topic,category:route.category}]);
    if(route.testType)out.push([route.testType,{level:'type',subject:route.subject,topic:route.topic,category:route.category,testType:route.testType}]);
    return out;
  }
  function applyBreadcrumb(route){
    const host=q('#view'); if(!host)return;
    const bc=host.querySelector('.breadcrumb'); if(!bc)return;
    const items=makeCrumbs(route);
    if(!items.length)return;
    bc.innerHTML=items.map((x,i)=>i===items.length-1?`<span>${esc(x[0])}</span>`:`<button type="button" data-live-crumb="${esc(JSON.stringify(x[1]))}">${esc(x[0])}</button><span>›</span>`).join('');
    bc.querySelectorAll('[data-live-crumb]').forEach(b=>b.onclick=()=>{try{go(JSON.parse(b.dataset.liveCrumb))}catch(_){}});
  }
  function openPath(id){
    const c=cfg(); const p=(c.paths||[]).find(x=>x.id===id||x.target===id); if(!p)return;
    if(p.target==='master')return go({level:'master'});
    if(p.target==='all')return go({level:'all'});
    if(p.target==='settings')return go({level:'settings'});
    // Resolve known path segments against the existing registry/modules.
    const seg=(p.segments||[]).map(x=>String(x).trim()).filter(Boolean);
    const low=seg.map(x=>x.toLowerCase());
    const subjects=Object.keys(APP.registry||{});
    const subject=subjects.find(k=>low.includes(k)||low.includes(String(APP.registry[k]?.title||'').toLowerCase()));
    if(subject){
      const topics=(APP.registry[subject]?.topics||[]);
      const topic=topics.find(t=>low.includes(String(t).toLowerCase())||low.includes(slug(t)));
      if(topic)return go({level:'topic',subject,topic:slug(topic)});
      return go({level:'subject',subject});
    }
    // Custom paths get a safe live route page instead of a dead button.
    const v=q('#view'); if(!v)return;
    closeDrawer?.(); closeSheet?.();
    v.innerHTML=`<div class="page"><div class="breadcrumb"><button type="button" onclick="go({level:'master'})">Master</button><span>›</span><span>${esc(p.label)}</span></div><section class="hero"><h1>🧭 ${esc(p.label)}</h1><p>Live path from Structure Builder</p></section><section class="panel card"><h3>Path</h3><div class="asb-code">${esc((p.segments||[]).join(' → '))}</div><p class="muted">This route is live. Questions remain canonical in Master Question Store.</p></section></div>`;
  }
  function patchRouter(){
    if(typeof window.render!=='function')return;
    const base=window.render;
    if(base.__liveWrapped)return;
    function liveRender(route){ base(route); setTimeout(()=>{buildLiveDrawer();applyBreadcrumb(route);},0); }
    liveRender.__liveWrapped=true;
    window.render=liveRender;
  }
  function patchDrawer(){
    buildLiveDrawer();
    const original=window.openDrawer;
    if(typeof original==='function'&&!original.__liveWrapped){
      function liveOpen(){original();buildLiveDrawer();}
      liveOpen.__liveWrapped=true; window.openDrawer=liveOpen;
      const menu=q('#menuBtn'); if(menu)menu.onclick=liveOpen;
    }
  }
  async function init(){
    try{await window.MasterStructureBuilder?.load?.();}catch(_){ }
    patchRouter(); patchDrawer();
    const r=window.R?.current||{level:'master'}; setTimeout(()=>{buildLiveDrawer();applyBreadcrumb(r);},20);
  }
  window.LiveStructureRouter={refresh:function(){patchDrawer();applyBreadcrumb(window.R?.current||{level:'master'});},openPath,runButton,version:'1.0'};
  init();
})();
</script>

<script id="MASTER_LIVE_STRUCTURE_INTEGRATION_V3">
(function(){
  'use strict';
  if(window.__MASTER_LIVE_STRUCTURE_INTEGRATION_V3__) return;
  window.__MASTER_LIVE_STRUCTURE_INTEGRATION_V3__=true;
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const slug=v=>typeof window.slug==='function'?window.slug(v):String(v||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const config=()=>window.MasterStructureBuilder?.get?.()||{hierarchy:[],buttons:[],paths:[]};
  const registry=()=>window.APP?.registry||{};
  const modules=()=>Array.isArray(window.APP?.modules)?window.APP.modules:[];
  const activeHierarchy=()=> (config().hierarchy||[]).filter(x=>x.enabled!==false);
  function label(id,fallback){const x=activeHierarchy().find(h=>h.id===id);return x?.label||fallback||id;}
  function subjectEntries(){
    const r=registry(), out=[];
    Object.keys(r).forEach(id=>{
      if(id==='science' && r[id]?.children){
        Object.keys(r[id].children).forEach(b=>out.push({id:b,title:r[id].children[b]?.title||b,parent:'science'}));
      } else out.push({id,title:r[id]?.title||id,parent:null});
    });
    const seen=new Set(); return out.filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true;});
  }
  function topicEntries(subject){
    const r=registry(); let arr=[];
    if(subject==='science'){
      Object.values(r.science?.children||{}).forEach(b=>arr.push(...(b.topics||[]).map(t=>({id:slug(t),title:t,subject:b.id}))));
    }else arr=(r[subject]?.topics||[]).map(t=>({id:slug(t),title:t,subject}));
    const seen=new Set();return arr.filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true;});
  }
  function routeForSubject(subject){return {level:'subject',subject};}
  function routeForTopic(subject,topic){return {level:'topic',subject,topic:slug(topic)};}
  function runAction(b){
    if(!b)return;
    if(b.action==='action'){
      const map={bookmarks:'openUser',revision:'openUser',mistakes:'openUser',stats:'openStats',settings:'openSettings',backup:'openBackup',import:'openImport'};
      const fn=map[b.route]; if(fn&&typeof window[fn]==='function'){
        if(b.route==='bookmarks'||b.route==='revision'||b.route==='mistakes') window[fn](b.route); else window[fn]();
        return;
      }
    }
    if(b.route==='master') return window.go?.({level:'master'});
    if(b.route==='all') return window.go?.({level:'all'});
    if(window.LiveStructureRouter?.openPath) return window.LiveStructureRouter.openPath(b.route);
  }
  function buildDrawer(){
    const d=$('#drawer'); if(!d)return;
    let host=$('#liveStructureV3');
    if(!host){host=document.createElement('div');host.id='liveStructureV3';d.appendChild(host);}
    const c=config();
    const buttons=(c.buttons||[]).filter(b=>b.enabled!==false);
    const subjects=subjectEntries();
    host.innerHTML=`<div class="drawer-group">LIVE STRUCTURE</div>
      <button class="drawer-btn" data-v3-route="master">🏠 ${esc(label('home','Home'))}</button>
      <button class="drawer-btn" data-v3-route="all">📚 ${esc(label('all','All PYQ Questions'))}</button>
      <div class="drawer-group">${esc(label('subject','SUBJECTS'))}</div>
      <div class="v3-subjects">${subjects.map(s=>`<button class="drawer-btn" data-v3-subject="${esc(s.id)}">${esc(s.title)}</button>`).join('')}</div>
      <div class="drawer-group">CONFIGURED BUTTONS</div>
      ${buttons.map(b=>`<button class="drawer-btn" data-v3-button="${esc(b.id)}">${esc(b.label)}</button>`).join('')}`;
    host.querySelectorAll('[data-v3-route]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();closeDrawer?.();window.go?.({level:b.dataset.v3Route});});
    host.querySelectorAll('[data-v3-subject]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();closeDrawer?.();window.go?.(routeForSubject(b.dataset.v3Subject));});
    host.querySelectorAll('[data-v3-button]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();closeDrawer?.();const x=buttons.find(y=>y.id===b.dataset.v3Button);runAction(x);});
  }
  function renderTopicQuickNav(route){
    const v=$('#view'); if(!v||!route?.subject)return;
    const old=v.querySelector('#v3TopicNav'); if(old)old.remove();
    const topics=topicEntries(route.subject); if(!topics.length)return;
    const box=document.createElement('section');box.id='v3TopicNav';box.className='panel card';
    box.innerHTML=`<h3>LIVE ${esc(label('topic','TOPICS'))}</h3><div class="v3-topic-grid">${topics.map(t=>`<button type="button" class="btn" data-v3-topic="${esc(t.id)}">${esc(t.title)}</button>`).join('')}</div>`;
    v.appendChild(box);
    box.querySelectorAll('[data-v3-topic]').forEach(b=>b.onclick=()=>window.go?.(routeForTopic(route.subject,b.dataset.v3Topic)));
  }
  function renderBreadcrumb(route){
    const v=$('#view'); if(!v||!route)return;
    let bc=v.querySelector('.breadcrumb'); if(!bc)return;
    const h=activeHierarchy();
    const labels={subject:label('subject','Subject'),chapter:label('chapter','Chapter'),topic:label('topic','Topic'),category:label('category','Category'),type:label('type','Type')};
    const items=[['Master',{level:'master'}]];
