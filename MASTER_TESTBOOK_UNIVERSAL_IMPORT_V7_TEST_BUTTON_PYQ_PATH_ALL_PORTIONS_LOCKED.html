<script id="master-test-focus-mode-v1-js">
(function(){
  'use strict';
  if(window.__MASTER_TEST_FOCUS_MODE_V1__) return;
  window.__MASTER_TEST_FOCUS_MODE_V1__=true;

  function sync(route){
    const isTestQuestion = !!(route &&
      route.level === 'question' &&
      route.testSession === true);

    document.body.classList.toggle('test-focus-mode',isTestQuestion);

    if(isTestQuestion){
      document.body.classList.add('immersive-active');
    }
  }

  const originalGo = window.go;
  if(typeof originalGo === 'function'){
    window.go = function(route,replace){
      sync(route);
      return originalGo.call(this,route,replace);
    };
  }

  const originalRender = window.render;
  if(typeof originalRender === 'function'){
    window.render = function(route){
      sync(route);
      const result = originalRender.apply(this,arguments);
      sync(route);
      return result;
    };
  }

  // Initial state, including reloads directly into an active test question.
  setTimeout(function(){
    sync(window.R && window.R.current ? window.R.current : null);
  },0);

  window.__MASTER_TEST_FOCUS_STATUS__ =
    'TEST_FOCUS_MODE_V1 • GLOBAL_BOTTOM_NAV_HIDDEN • FULL_AVAILABLE_VIEWPORT • QUESTION_OPTION_PREVIOUS_NEXT_ONLY';
})();
</script>

ber & Alphabet Test","Non-Verbal Reasoning"]},"english":{"title":"📖 ENGLISH","topics":["Grammar","Vocabulary","Error Detection","Fill in the Blanks","Sentence Improvement","Synonyms & Antonyms","Reading Comprehension"]}},"importAuditV2":{"status":"CLEARED","sourceFile":null,"detectedTopics":0,"detectedQuestions":0,"newlyCommittedTopics":[],"safeSkips":{},"message":"All previously embedded/imported questions cleared. Structure and import engine retained."}};
const LS_PREFIX='master_testbook::';

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function load(k,fb){try{const x=JSON.parse(localStorage.getItem(k));return x??fb}catch(e){return fb}}

function slug(s){return String(s).toLowerCase().replace(/[–—]/g,'-').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function modules(){return APP.modules}
function moduleById(id){return modules().find(m=>m.moduleId===id)}
function moduleFor(subject,topic,test){return modules().find(m=>m.subject===subject&&m.topic===topic&&m.testType===test)}
function topicStatus(subject,topic){
  const t=slug(topic);

}
function allQuestions(){
  const out=[];
  modules().forEach(m=>m.groups.forEach(g=>g.questions.forEach(q=>out.push({...q,moduleId:m.moduleId,subject:m.subject,topic:m.topic,topicTitle:m.topicTitle,testType:m.testType,testTypeTitle:m.testTypeTitle,groupId:g.groupId,groupTitle:g.title,groupNo:g.originalGroupNo}))));

}
function qkey(m,q){return m.moduleId+'::q'+q.originalQNo}
function progressFor(m,q){return user.progress[qkey(m,q)]||{attempts:0,correct:0,wrong:0,lastAnswer:'',lastAttempt:null,time:0}}
function setProgress(m,q,patch){const k=qkey(m,q);user.progress[k]={...progressFor(m,q),...patch};user.last={moduleId:m.moduleId,q:q.originalQNo};save()}
function totalFor(m){return m.groups.reduce((n,g)=>n+g.questions.length,0)}
function scienceChapterKeys(){return Object.keys(APP.registry.science?.children||{})}
function scienceChapter(chapter){return APP.registry.science?.children?.[chapter]||null}
function categoryModules(subject){
  if(subject==='science') return modules().filter(m=>['physics','chemistry','biology'].includes(m.subject));
  return modules().filter(m=>m.subject===subject);
}
function topicModules(subject,topic){
  const t=slug(topic), title=String(topic??'').trim().toLowerCase();
  const match=m=>m.topic===t||String(m.topicTitle??'').trim().toLowerCase()===title;
  if(subject==='science') return modules().filter(m=>['physics','chemistry','biology'].includes(m.subject)&&match(m));
  return modules().filter(m=>m.subject===subject&&match(m));
}
function chapterTopics(subject,chapter){
  if(subject==='science'){
    const c=scienceChapter(chapter);
    return c?.topics||[];
  }
  const s=APP.registry[subject];
  const title=(s?.topics||[]).find(t=>slug(t)===chapter);
  return title?[title]:[];
}
function subjectModuleCount(subject){return categoryModules(subject).length}
function fmtPct(a,b){return b?Math.round(a*100/b)+'%':'0%'}

applyTheme();

const R={current:null,stack:[]};
function go(route, replace=false){

function render(route){

  else if(route.level==='all') renderAll(v,route.query||'');
  else if(route.level==='subject') renderSubject(v,route.subject);
  else if(route.level==='chapter') renderChapter(v,route.subject,route.chapter);
  else if(route.level==='topic') renderTopic(v,route.subject,route.topic);
  else if(route.level==='category') renderCategory(v,route.subject,route.topic,route.category);
  else if(route.level==='type') renderType(v,route.subject,route.topic,route.category,route.testType);
  else if(route.level==='formula') renderFormula(v,route.subject,route.topic,route.importIdentity);
  else if(route.level==='import') renderImport(v,route.subject,route.topic,route.importIdentity);
  else if(route.level==='test') renderTest(v,route.moduleId);
  else if(route.level==='group') renderGroup(v,route.moduleId,route.groupId);
  else if(route.level==='question') (window.__renderQuestionV6?window.__renderQuestionV6(v,route.moduleId,route.groupId,route.qIndex||0):renderQuestion(v,route.moduleId,route.groupId,route.qIndex||0));
  else if(route.level==='bookmarks') renderUserList(v,'bookmarks');
  else if(route.level==='revision') renderUserList(v,'revision');
  else if(route.level==='mistakes') renderUserList(v,'mistakes');
  else if(route.level==='stats') renderStats(v);
  else if(route.level==='settings') renderSettings(v);
  else renderMaster(v);
  window.scrollTo({top:0,behavior:'auto'});
}
window.addEventListener('popstate',e=>render(e.state||{level:'master'}));
function link(label,route){return '<button type="button" onclick="go('+JSON.stringify(route).replace(/"/g,'&quot;')+')">'+esc(label)+'</button>'}
function crumbs(items){
  return '<div class="breadcrumb">'+items.map((x,i)=>i===items.length-1?'<span>'+esc(x[0])+'</span>':link(x[0],x[1])+'<span>›</span>').join('')+'</div>';
}

        onclick='go({level:"subject",subject:"maths"})'>

      <button class="tb-main-btn" type="button"

      <button class="tb-main-btn pink" type="button"

}
function findGroupForQ(mid,qno){const m=moduleById(mid);if(!m)return '';for(const g of m.groups)if(g.questions.some(q=>q.originalQNo===Number(qno)))return g.groupId;return m.groups[0]?.groupId||''}
function findIndexForQ(mid,qno){const m=moduleById(mid);if(!m)return 0;for(const g of m.groups){const i=g.questions.findIndex(q=>q.originalQNo===Number(qno));if(i>=0)return i}return 0}

function renderSubject(v,subject){
  const s=APP.registry[subject];if(!s)return renderMaster(v);
  const isScience=subject==='science';
  const chapters=isScience?scienceChapterKeys():(s.topics||[]).map(t=>slug(t));
  const labels=isScience?chapters.map(k=>[k,scienceChapter(k)?.title||k]):chapters.map(k=>[k,(s.topics||[]).find(t=>slug(t)===k)||k]);
  v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[s.title,{level:'subject',subject}]])}
  <section class="hero"><h1>${esc(s.title)}</h1><p>All PYQ → Chapter Index</p><div class="stat-row"><div class="stat"><b>Chapters</b><span>${labels.length}</span></div><div class="stat"><b>Available Modules</b><span>${subjectModuleCount(subject)}</span></div></div></section>
  <section class="grid">${labels.map(([key,title])=>{
    const topics=chapterTopics(subject,key);const available=topics.reduce((n,t)=>n+topicModules(subject,t).length,0);
    return `<button class="nav-card" onclick='go({level:"chapter",subject:${JSON.stringify(subject)},chapter:${JSON.stringify(key)}})'><strong>${esc(title)}</strong><small>${topics.length} topic${topics.length===1?'':'s'} • ${available} active module(s)</small><span class="status ${available?'available':'index'}">${available?'AVAILABLE':'INDEX-ONLY'}</span></button>`;
  }).join('')}</section></div>`;
}
function renderChapter(v,subject,chapter){
  const s=APP.registry[subject];if(!s)return renderMaster(v);
  const topics=chapterTopics(subject,chapter);const chapterTitle=subject==='science'?(scienceChapter(chapter)?.title||chapter):((s.topics||[]).find(t=>slug(t)===chapter)||chapter);
  v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[s.title,{level:'subject',subject}],[chapterTitle,{level:'chapter',subject,chapter}]])}
  <section class="hero"><h1>📘 ${esc(chapterTitle)}</h1><p>Chapter → Topic Index</p></section>
  <section class="grid">${topics.map(t=>{const mods=topicModules(subject,t);return `<button class="nav-card" onclick='go({level:"topic",subject:${JSON.stringify(subject)},topic:${JSON.stringify(slug(t))}})'><strong>📚 ${esc(t)}</strong><small>${mods.length?mods.reduce((n,m)=>n+m.groups.length,0)+' groups • '+mods.reduce((n,m)=>n+totalFor(m),0)+' questions':'No imported source module yet'}</small><span class="status ${mods.length?'available':'index'}">${mods.length?'AVAILABLE':'INDEX-ONLY'}</span></button>`}).join('')||'<div class="panel card">No topics registered.</div>'}</section></div>`;
}
/* === MASTER_CATEGORY_TYPE_GROUP_HIERARCHY_V2 === */
const HIERARCHY_CATEGORIES=['CATEGORY INDEX','FORMULAS','EASY','MODERATE','TOUGH & MISCELLANEOUS'];
function hierarchySubjectId(m){return ['physics','chemistry','biology'].includes(m.subject)?'science':m.subject;}
function hierarchyCategory(m){
  if(m.sectionKey==='formula' || String(m.testType||'').startsWith('formula-')) return 'FORMULAS';
  const explicit=m.category||m.categoryTitle||m.difficulty||m.sectionTitle;
  const x=String(explicit||'').trim().toUpperCase();
  if(HIERARCHY_CATEGORIES.includes(x)) return x;
  if(x==='EASY'||x==='MODERATE'||x==='TOUGH'||x==='TOUGH & MISCELLANEOUS') return x==='TOUGH'?'TOUGH & MISCELLANEOUS':x;
  /* Existing Class Test has no category field; keep it in the first non-formula category without changing source data. */
  return 'EASY';
}
function hierarchyType(m){
  if(m.importIdentity){
    const id=String(m.moduleId||'');
    const mt=id.match(/type-(\d+)/i);
    if(mt)return 'Type-'+String(Number(mt[1]));
    const tt=String(m.testTypeTitle||'').match(/Type-(\d+)/i);
    if(tt)return 'Type-'+String(Number(tt[1]));
  }
  const explicit=m.type||m.typeTitle;
  if(explicit) return String(explicit);
  return 'Type-1';
}
function hierarchyModules(subject,topic,category,type){
  return topicModules(subject,topic).filter(m=>hierarchyCategory(m)===category && hierarchyType(m)===type);
}
function hierarchyCategoryList(subject,topic){
  const out=[]; HIERARCHY_CATEGORIES.forEach(c=>{if(topicModules(subject,topic).some(m=>hierarchyCategory(m)===c))out.push(c)}); return out;
}
function hierarchyTypeList(subject,topic,category){
  const seen=[]; hierarchyModules(subject,topic,category,'__all__');
  topicModules(subject,topic).filter(m=>hierarchyCategory(m)===category).forEach(m=>{const t=hierarchyType(m);if(!seen.includes(t))seen.push(t)});
  return seen;
}
function hierarchyCrumbs(subject,topic,category,type,group){
  const s=APP.registry[subject];
  const title=(subject==='science'?scienceChapterKeys().flatMap(k=>scienceChapter(k)?.topics||[]):(s?.topics||[])).find(t=>slug(t)===topic)||topic;
  const a=[['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[s?.title||subject,{level:'subject',subject}], [title,{level:'topic',subject,topic}], [category,{level:'category',subject,topic,category}]];
  if(type)a.push([type,{level:'type',subject,topic,category,testType:type}]);
  if(group)a.push([group.title,{level:'group',moduleId:group.moduleId,groupId:group.groupId}]);
  return a;
}
function renderCategory(v,subject,topic,category){
  const s=APP.registry[subject]; const mods=topicModules(subject,topic).filter(m=>hierarchyCategory(m)===category); if(!s||!mods.length)return renderTopic(v,subject,topic);
  const types=hierarchyTypeList(subject,topic,category);
  v.innerHTML=`<div class="page">${crumbs(hierarchyCrumbs(subject,topic,category))}<section class="hero"><h1>📚 ${esc(category)}</h1><p>Category → Type Index</p><div class="stat-row"><div class="stat"><b>Types</b><span>${types.length}</span></div><div class="stat"><b>Groups</b><span>${mods.reduce((n,m)=>n+m.groups.length,0)}</span></div></div></section><section class="grid">${types.map(t=>{const ms=hierarchyModules(subject,topic,category,t);const qn=ms.reduce((n,m)=>n+totalFor(m),0);return `<button class="nav-card group-card" onclick='go({level:"type",subject:${JSON.stringify(subject)},topic:${JSON.stringify(topic)},category:${JSON.stringify(category)},testType:${JSON.stringify(t)}})'><span class="left"><strong>${esc(t)}</strong><small>${ms.length} module(s) • ${ms.reduce((n,m)=>n+m.groups.length,0)} groups • ${qn} questions</small></span><span class="status available">OPEN</span></button>`}).join('')}</section></div>`;
}
function renderType(v,subject,topic,category,testType){
  const s=APP.registry[subject]; const ms=hierarchyModules(subject,topic,category,testType); if(!s||!ms.length)return renderCategory(v,subject,topic,category);
  const groups=[]; ms.forEach(m=>m.groups.forEach(g=>groups.push({m,g})));
  v.innerHTML=`<div class="page">${crumbs(hierarchyCrumbs(subject,topic,category,testType))}<section class="hero"><h1>📚 ${esc(testType)}</h1><p>${esc(category)} → Group Index</p><div class="stat-row"><div class="stat"><b>Groups</b><span>${groups.length}</span></div><div class="stat"><b>Questions</b><span>${groups.reduce((n,x)=>n+x.g.questions.length,0)}</span></div></div></section><section class="grid">${groups.map(({m,g})=>`<button class="nav-card group-card" onclick='go({level:"group",moduleId:${JSON.stringify(m.moduleId)},groupId:${JSON.stringify(g.groupId)})'><span class="left"><strong>${esc(g.title)}</strong><small>${esc(m.testTypeTitle||testType)} • ${g.questions.length} questions • ${esc(g.description||'')}</small></span><span class="status available">OPEN</span></button>`).join('')}</section></div>`;
}
/* === END MASTER_CATEGORY_TYPE_GROUP_HIERARCHY_V2 === */

function renderTopic(v,subject,topic){
  const s=APP.registry[subject];if(!s)return renderMaster(v);
  const topicTitle=(subject==='science'?scienceChapterKeys().flatMap(k=>scienceChapter(k)?.topics||[]):(s.topics||[])).find(t=>slug(t)===topic)||topic;
  const cats=hierarchyCategoryList(subject,topic); const mods=topicModules(subject,topic);
  v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[s.title,{level:'subject',subject}],[topicTitle,{level:'topic',subject,topic}]])}
  <section class="hero"><h1>📚 ${esc(topicTitle)}</h1><p>Topic → Category → Type → Group Index → Questions → Final Test</p><div class="stat-row"><div class="stat"><b>Categories</b><span>${cats.length}</span></div><div class="stat"><b>Groups</b><span>${mods.reduce((n,m)=>n+m.groups.length,0)}</span></div><div class="stat"><b>Questions</b><span>${mods.reduce((n,m)=>n+totalFor(m),0)}</span></div></div></section>
  ${cats.length?`<section class="grid">${cats.map(c=>{const ms=mods.filter(m=>hierarchyCategory(m)===c);return `<button class="nav-card group-card" onclick='go({level:"category",subject:${JSON.stringify(subject)},topic:${JSON.stringify(topic)},category:${JSON.stringify(c)}})'><span class="left"><strong>${esc(c)}</strong><small>${hierarchyTypeList(subject,topic,c).length} types • ${ms.reduce((n,m)=>n+m.groups.length,0)} groups • ${ms.reduce((n,m)=>n+totalFor(m),0)} questions</small></span><span class="status available">OPEN</span></button>`}).join('')}</section>`:`<section class="panel card"><b>INDEX-ONLY</b><p class="muted">No supplied/imported source module is available for this topic. No fake questions were created.</p></section>`}
  </div>`;
}

function renderFormula(v,subject,topic,importIdentity){
  const s=APP.registry[subject]; const ms=modules().filter(m=>m.subject===subject&&m.topic===topic&&m.sectionKey==='formula'&&m.importIdentity===importIdentity);
  if(!s||!ms.length)return renderMaster(v);
  const title=ms[0].importTitle||'Formula'; const qn=ms.reduce((n,m)=>n+totalFor(m),0);
  v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],[s.title,{level:'subject',subject}],['Percentage',{level:'topic',subject,topic}],['Formula',{level:'formula',subject,topic,importIdentity}]])}<section class="hero"><h1>📐 Formula</h1><p>${esc(title)}</p><div class="stat-row"><div class="stat"><b>Types</b><span>${ms.length}</span></div><div class="stat"><b>Questions</b><span>${qn}</span></div></div></section><section class="grid"><button class="nav-card group-card" onclick='go({level:"import",subject:${JSON.stringify(subject)},topic:${JSON.stringify(topic)},importIdentity:${JSON.stringify(importIdentity)}})'><span class="left"><strong>📘 ${esc(title)}</strong><small>8 Types • 86 Bilingual Questions</small></span><span class="status available">OPEN</span></button></section></div>`;
}
function renderImport(v,subject,topic,importIdentity){
  const s=APP.registry[subject]; const ms=modules().filter(m=>m.subject===subject&&m.topic===topic&&m.sectionKey==='formula'&&m.importIdentity===importIdentity).sort((a,b)=>a.typeNo-b.typeNo);

function answerQuestion(m,q,value,mode){
  const correct=String(q.answer||'').toUpperCase()===String(value).toUpperCase();
  const old=progressFor(m,q);const patch={attempts:old.attempts+1,lastAnswer:value,lastAttempt:new Date().toISOString()};
  if(correct){
    patch.correct=old.correct+1;
  }else{
    patch.wrong=old.wrong+1;
    const k=qkey(m,q);
    user.mistakes[k]={
      originalQNo:q.originalQNo,
      question:q.html,
      userAnswer:value,
      correctAnswer:q.answer,
      subject:m.subject,
      topic:m.topic,
      group:window.__activeQuestion?.g?.groupId||''
    };
  }
  setProgress(m,q,patch);
  save();
  if(mode==='practice')showFeedback(m,q,value,false);
}

}

async function runImport(){
  const f=$('#impFile').files[0], report=$('#importReport');if(!f){report.innerHTML='<p class="report-review">Select a source file.</p>';return}
  const ext=f.name.toLowerCase().split('.').pop();
  const direct=['html','htm','txt','csv','json'].includes(ext);
  if(!direct){report.innerHTML=`<div class="danger-box"><b>Format detected: ${esc(ext.toUpperCase())}</b><br>Binary/image source adapter is registered for this Master architecture, but this standalone build does not silently invent extraction when a browser parser/OCR engine is unavailable. Status: NEEDS REVIEW. You can provide readable OCR/text or an existing HTML/TXT module and the same import pipeline will normalize it.</div>`;return}
  const raw=await f.text();const result=parseImport(raw,ext,f.name,$('#impTopic').value.trim());
  report.innerHTML=result.report;
  if(result.module){APP.modules.push(result.module);saveEmbeddedModule(result.module);setTimeout(()=>{closeSheet();go({level:'topic',subject:result.module.subject,topic:result.module.topic})},700)}

function parseImport(raw,ext,fileName,targetTopic){
  let subject='reasoning',topic=slug(targetTopic||fileName.replace(/\.[^.]+$/,''))||'imported-topic',title=targetTopic||fileName.replace(/\.[^.]+$/,''),testType='class-test',groups=[],questions=[];
  if(ext==='json'){
    try{const x=JSON.parse(raw);if(x.moduleId&&x.groups)return {module:x,report:'<p class="report-ok">JSON module detected and registered.</p>'};if(x.modules)return {module:null,report:'<p class="report-review">Backup JSON detected. Use Backup → Restore for user data.</p>'}}catch(e){}
  }
  if(ext==='html'||ext==='htm'){
    const d=new DOMParser().parseFromString(raw,'text/html');
    const nodes=[...d.querySelectorAll('.question')];const gs=[...d.querySelectorAll('.group')];
    subject=detectSubject((d.title||'')+' '+raw);topic=slug(targetTopic||detectTopic((d.title||'')+' '+raw)||title);title=targetTopic||detectTopic((d.title||'')+' '+raw)||title;
    if(gs.length){gs.forEach((g,gi)=>{const n=g.querySelector('.group-title h2');groups.push({groupId:`${subject}-${topic}-${testType}-g${String(gi+1).padStart(2,'0')}`,originalGroupNo:gi+1,sourceOrder:gi+1,title:n?.textContent?.trim()||`G-${String(gi+1).padStart(2,'0')}`,description:g.querySelector('.group-title p')?.textContent?.trim()||'',questions:[...g.querySelectorAll('.question')].map((q,qi)=>normImportedQ(q,qi+1,subject,topic,testType))})})}
    else questions=nodes.map((q,i)=>normImportedQ(q,i+1,subject,topic,testType));
  }else if(ext==='txt'){
    subject=detectSubject(raw);topic=slug(targetTopic||detectTopic(raw)||title);title=targetTopic||detectTopic(raw)||title;questions=parseTXT(raw);
  }else if(ext==='csv'){
    const rows=parseCSV(raw);questions=rows.map((r,i)=>({originalQNo:Number(r.qno||r['Q.No.']||i+1),sourceOrder:i+1,sourceReference:'CSV',examInfo:r.exam||r.examInfo||'',answer:String(r.answer||''),html:buildCSVQuestion(r)}));
  }
  if(!groups.length){const chunks=[];for(let i=0;i<questions.length;i+=20)chunks.push(questions.slice(i,i+20));groups=chunks.map((qs,i)=>({groupId:`${subject}-${topic}-${testType}-g${String(i+1).padStart(2,'0')}`,originalGroupNo:i+1,sourceOrder:i+1,title:`G-${String(i+1).padStart(2,'0')}`,description:`${qs.length} questions • Imported source order`,questions:qs}))}
  const moduleId=`${subject}-${topic}-${testType}`;
  if(APP.modules.some(m=>m.moduleId===moduleId))return {module:null,report:`<p class="report-review">REPORT DUPLICATE: <b>${esc(moduleId)}</b> already exists. Nothing overwritten.</p>`};
  const mod={moduleId,subject,subjectTitle:APP.registry[subject]?.title||subject.toUpperCase(),topic,topicTitle:title,testType,testTypeTitle:'Class Test',icon:'📥',status:'AVAILABLE',groups,sourceIntegrity:{sourceTitle:fileName,questions:groups.reduce((n,g)=>n+g.questions.length,0),groups:groups.length,qRange:'Imported',sourceOrderPreserved:true,groupOrderPreserved:true,questionOrderPreserved:true,englishPreserved:true,hindiPreserved:true,optionsPreserved:true,answerPreserved:true,examInfoPreserved:true}};
  return {module:mod,report:`<p class="report-ok">Import prepared: ${esc(fileName)}</p><p class="muted">Subject: ${esc(subject)} • Topic: ${esc(title)} • Groups: ${groups.length} • Questions: ${mod.sourceIntegrity.questions}</p><p class="report-ok">Validation: PASS (source text is carried forward; no fake questions created).</p>`};

guage').value=user.settings.languageDisplay||'bilingual';$('#setTimer').checked=user.settings.timerEnabled!==false;$('#setContrast').checked=!!user.settings.highContrast;$('#setMotion').checked=!!user.settings.reducedMotion};

  async function loadScript(src,id){if(document.getElementById(id))return;await new Promise((res,rej)=>{const s=document.createElement('script');s.id=id;s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Library load failed: '+src));document.head.appendChild(s)})}
  async function parsePDF(file){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.js','pdfjs-loader');const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),c=await pg.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n'}return text}
  async function parseOffice(file,ext){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','jszip-loader');const zip=await JSZip.loadAsync(await file.arrayBuffer());let path=ext==='docx'?'word/document.xml':'xl/sharedStrings.xml';let xml=zip.file(path)?await zip.file(path).async('text'):'';if(ext==='xlsx'){const wb=zip.file('xl/workbook.xml')?await zip.file('xl/workbook.xml').async('text'):'';const sheets=[...wb.matchAll(/sheet[^>]*r:id="([^"]+)"[^>]*name="([^"]+)"/g)].map(x=>x[2]);let out='';for(const f of Object.keys(zip.files).filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x))){const z=await zip.file(f).async('text');out+=z.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ')+'\n'}return out||xml.replace(/<[^>]+>/g,' ')}return xml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ')}
  async function parseImageOCR(file){await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','tesseract-loader');const r=await Tesseract.recognize(file,'eng');return r.data.text}
  window.runImport=async function(){const f=$('#impFile')?.files[0],report=$('#importReport');if(!f){report.innerHTML='<p class="report-review">Select a source file.</p>';return}try{const ext=f.name.toLowerCase().split('.').pop();let raw='',adapter='';if(['html','htm','txt','csv','json'].includes(ext)){raw=await f.text();adapter='native'}else if(ext==='pdf'){raw=await parsePDF(f);adapter='PDF.js'}else if(['docx','xlsx','xls'].includes(ext)){raw=await parseOffice(f,ext==='xls'?'xlsx':ext);adapter='Office ZIP/XML'}else if(['png','jpg','jpeg','webp'].includes(ext)){raw=await parseImageOCR(f);adapter='Tesseract OCR'}else throw new Error('Unsupported source format');const result=parseImport(raw,ext==='pdf'||ext==='docx'||ext==='xlsx'||ext==='xls'||['png','jpg','jpeg','webp'].includes(ext)?'txt':ext,f.name,$('#impTopic')?.value.trim()||'');report.innerHTML='<p class="report-ok">Adapter: '+esc(adapter)+' • Extraction completed. '+(result.module?'Module validated and registered.':'Readable source extracted; review parser output.')+'</p>'+result.report;if(result.module){if(APP.modules.some(x=>x.moduleId===result.module.moduleId)){report.innerHTML+='<p class="report-review">DUPLICATE MODULE — not overwritten.</p>'}else{APP.modules.push(result.module);saveEmbeddedModule(result.module);persist();setTimeout(()=>{closeSheet();go({level:'topic',subject:result.module.subject,topic:result.module.topic})},700)}}}catch(e){report.innerHTML='<div class="danger-box"><b>Import adapter error</b><br>'+esc(e.message)+'</div>'}};

/* MASTER STRUCTURE REGRESSION FIX V1 */
(function(){
  'use strict';
  // STRUCTURE-ONLY FIX: never changes question text, answers, options, Q.No., or source order inside a group.
  if (window.__MASTER_STRUCTURE_FIX_V1__) return;
  window.__MASTER_STRUCTURE_FIX_V1__ = true;

  const subjectOrder = ['science','maths','reasoning','english'];
  const childOrder = ['physics','chemistry','biology'];

  // Normalize module/group presentation order so All PYQ is sequential.
  if (window.APP && Array.isArray(APP.modules)) {
    APP.modules.sort((a,b)=>{
      const sa=subjectOrder.indexOf(a.subject), sb=subjectOrder.indexOf(b.subject);
      const as=sa<0?999:sa, bs=sb<0?999:sb;
      if(as!==bs) return as-bs;
      return String(a.topicTitle||a.topic).localeCompare(String(b.topicTitle||b.topic));
    });
    APP.modules.forEach(m=>{
      if(Array.isArray(m.groups)) m.groups.sort((a,b)=>Number(a.originalGroupNo||0)-Number(b.originalGroupNo||0));
      m.groups?.forEach(g=>{ if(Array.isArray(g.questions)) g.questions.sort((a,b)=>Number(a.sourceOrder||0)-Number(b.sourceOrder||0)); });
    });
  }

  function esc2(x){return typeof window.esc==='function'?esc(x):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function slug2(x){return typeof window.slug==='function'?slug(x):String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
  function go2(route){return window.go(route);}

  // Master Home: explicit Science section + stable subject hierarchy.
  window.renderMaster = function(v){
    const active = typeof modules==='function' ? modules() : (APP.modules||[]);
    const qn = typeof allQuestions==='function' ? allQuestions().length : active.reduce((n,m)=>n+(m.groups||[]).reduce((a,g)=>a+(g.questions||[]).length,0),0);
    v.innerHTML=`<div class="page">
      <section class="hero"><h1>📚 MASTER HTML TEST-BOOK</h1><p>All PYQ → Subject → Chapter → Topic → Group → Final Test</p><span class="badge">V5.0 • ${qn} imported questions • ${active.length} active modules</span></section>
      <section class="panel card"><div class="section-head"><h3>📊 Overall Statistics</h3><span class="muted">User activity only</span></div><div class="stat-row"><div class="stat"><b>Total Questions</b><span>${qn}</span></div><div class="stat"><b>Attempted</b><span>${Object.values(window.user?.progress||{}).filter(x=>x.attempts>0).length}</span></div><div class="stat"><b>Modules</b><span>${active.length}</span></div></div></section>
      <section class="section"><div class="section-head"><h2>📚 ALL PYQ</h2><span class="muted">Single category gateway</span></div><div class="grid"><button class="nav-card" onclick='go({level:"all"})'><strong>📚 All PYQ Questions</strong><small>Science • Maths • Reasoning • English</small><span class="status available">OPEN</span></button></div></section>
    </div>`;
  };

  // Science subject page: keep hierarchy instead of flattening Physics/Chemistry/Biology topics.
  const originalRenderSubject = window.renderSubject;
  window.renderSubject = function(v,subject){
    const s=APP.registry?.[subject];
    if(!s) return originalRenderSubject(v,subject);
    if(s.children){
      const entries=childOrder.filter(k=>s.children[k]).map(k=>[k,s.children[k]]);
      v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],[s.title,{level:'subject',subject}]])}<section class="hero"><h1>${esc2(s.title)}</h1><p>Science → Subject → Topic</p></section><section class="grid">${entries.map(([k,c])=>`<button class="nav-card" onclick='go({level:"subject",subject:${JSON.stringify(k)}})'><strong>${esc2(c.title)}</strong><small>${(c.topics||[]).length} registered topics</small><span class="status available">OPEN</span></button>`).join('')}</section></div>`;
      return;
    }
    const topics=s.topics||[];
    v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],[s.title,{level:'subject',subject}]])}<section class="hero"><h1>${esc2(s.title)}</h1><p>Subject Page → Topic Index</p></section><section class="grid">${topics.map(t=>{const st=topicStatus(subject,t),mods=topicModules(subject,t);return `<button class="nav-card" onclick='go({level:"topic",subject:${JSON.stringify(subject)},topic:${JSON.stringify(slug2(t))}})'><strong>${esc2(t)}</strong><small>${mods.length?mods.length+' active test type(s)':'No imported source module yet'}</small><span class="status ${st==='AVAILABLE'?'available':'index'}">${st}</span></button>`}).join('')}</section></div>`;
  };

  // Global All-PYQ: deterministic subject/topic/group/source order.
  const originalRenderAll = window.renderAll;
  window.renderAll = function(v,query){
    const qs=allQuestions().sort((a,b)=>{
      const sa=subjectOrder.indexOf(a.subject), sb=subjectOrder.indexOf(b.subject); const aa=sa<0?999:sa,bb=sb<0?999:sb;
      if(aa!==bb)return aa-bb;
      const ta=String(a.topicTitle||a.topic),tb=String(b.topicTitle||b.topic); if(ta!==tb)return ta.localeCompare(tb);
      if(Number(a.groupNo)!==Number(b.groupNo))return Number(a.groupNo)-Number(b.groupNo);
      return Number(a.sourceOrder||0)-Number(b.sourceOrder||0);
    });
    const x=(query||'').toLowerCase().trim();
    const filtered=x?qs.filter(q=>[q.originalQNo,q.html,q.subject,q.topicTitle,q.testTypeTitle,q.groupTitle,q.examInfo].join(' ').toLowerCase().includes(x)):qs;
    v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}]])}<section class="hero"><h1>📚 ALL PYQ QUESTIONS</h1><p>Sequential: Subject → Topic → Group → Question</p><input class="search" id="globalSearch" value="${esc2(query||'')}" placeholder="Search Q.No., English, Hindi, Subject, Topic, Test Type, Group, Exam..."></section><section class="grid">${filtered.slice(0,1000).map(q=>`<button class="nav-card" onclick='go({level:"question",moduleId:${JSON.stringify(q.moduleId)},groupId:${JSON.stringify(q.groupId)},qIndex:${findIndexForQ(q.moduleId,q.originalQNo)}})'><strong>Q.${esc2(q.originalQNo)} • ${esc2(q.topicTitle)}</strong><small>${esc2(q.testTypeTitle)} • ${esc2(q.groupTitle)} • ${esc2(q.subject)}</small></button>`).join('')||'<div class="panel card"><b>No matching question found.</b></div>'}</section></div>`;
    const inp=document.getElementById('globalSearch'); if(inp) inp.oninput=()=>window.go({level:'all',query:inp.value});
  };

  // Ensure the existing drawer's Science button always reaches the Science index.
  document.querySelectorAll('.drawer-btn[data-route="subject"][data-subject="science"]').forEach(b=>b.onclick=()=>go2({level:'subject',subject:'science'}));

  // Re-render after patch so the visible route reflects the fixed hierarchy immediately.
  if(window.R && R.current && R.current.level==='master') window.render(R.current);
})();
</script>

<script>

(function(){

  const sl=x=>typeof window.slug==='function'?window.slug(x):String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

    if(subject==='science')for(const b of SCIENCE_BRANCHES){const x=(reg().science?.children?.[b]?.topics||[]).find(v=>sl(v)===t);if(x)return x;}
    return (reg()[subject]?.topics||[]).find(v=>sl(v)===t)||topic;
  };
  const topicMods=(subject,topic)=>{
    const t=sl(topic),match=m=>sl(m.topic)===t||sl(m.topicTitle)===t;
    return subject==='science'?mods().filter(m=>isSciChild(m.subject)&&match(m)):mods().filter(m=>m.subject===subject&&match(m));
  };
  const totalFor=m=>m.groups.reduce((n,g)=>n+g.questions.length,0);
  const catQuestionCount=subject=>subject==='science'?qs().filter(q=>isSciChild(q.subject)).length:qs().filter(q=>q.subject===subject).length;
  const catModuleCount=subject=>subject==='science'?mods().filter(m=>isSciChild(m.subject)).length:mods().filter(m=>m.subject===subject).length;
  const subjectForModule=m=>m&&isSciChild(m.subject)?'science':(m?.subject||'');
  const branchForModule=m=>m&&isSciChild(m.subject)?m.subject:'';
  const groupFor=(m,id)=>m?.groups?.find(g=>g.groupId===id)||null;
  const findIndexForQ=(mid,qno)=>{const m=moduleById(mid);if(!m)return 0;for(const g of m.groups){const i=g.questions.findIndex(q=>Number(q.originalQNo)===Number(qno));if(i>=0)return i}return 0};
  const canonicalRoute=route=>{
    const r={...(route||{})};
    if(r.moduleId){const m=moduleById(r.moduleId);if(m){r.subjectId=subjectForModule(m);r.branchId=branchForModule(m);r.topicId=m.topic;r.testTypeId=m.testType||'';const g=groupFor(m,r.groupId),q=(g?.questions||[])[Number(r.qIndex)||0];r.questionId=r.questionId||(q?'q'+q.originalQNo:'');if(r.originalQNo==null&&q)r.originalQNo=q.originalQNo;}}
    else{r.subjectId=r.subjectId||r.subject||'';r.branchId=r.branchId||'';r.topicId=r.topicId||'';r.testTypeId=r.testTypeId||'';r.groupId=r.groupId||'';r.questionId=r.questionId||'';r.originalQNo=r.originalQNo??null;}
    return r;
  };
  if(typeof window.go==='function'&&!window.__MASTER_CANONICAL_GO_V6__){const nativeGo=window.go;window.go=function(route,replace){return nativeGo(canonicalRoute(route),replace)};window.__MASTER_CANONICAL_GO_V6__=true;}

  /* AUTO-FIX: expose universal hierarchy metadata helpers to the routing layer. */

  window.branchForModule = branchForModule;
  window.branchTitle = branchTitle;

  window.renderMaster=function(v){
    const all=qs(),attempted=Object.values(user?.progress||{}).filter(x=>x&&x.attempts>0).length;

  };
  window.renderTopic=function(v,subject,topic){

    v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[s.title,{level:'subject',subject}],...bc,[title,{level:'topic',subject,topic}]])}<section class="hero"><h1>📚 ${e(title)}</h1><p>Topic → GROUP INDEX → G-01 / G-02 / G-03 → Questions → FINAL TEST</p><div class="stat-row"><div class="stat"><b>Groups</b><span>${groups.length}</span></div><div class="stat"><b>Questions</b><span>${groups.reduce((n,x)=>n+x.g.questions.length,0)}</span></div></div></section>${groups.length?`<section class="section"><div class="section-head"><h2>📚 GROUP INDEX</h2><span class="muted">Original group order • original Q.No. preserved</span></div><div class="grid">${groups.map(({m,g})=>{const at=g.questions.filter(q=>progressFor(m,q).attempts>0).length;return `<button class="nav-card group-card" onclick='go({level:"group",moduleId:${JSON.stringify(m.moduleId)},groupId:${JSON.stringify(g.groupId)},subjectId:${JSON.stringify(subject)},branchId:${JSON.stringify(branch)},topicId:${JSON.stringify(m.topic)},testTypeId:${JSON.stringify(m.testType)}})'><span class="left"><strong>${e(g.title)}</strong><small>${e(m.testTypeTitle)} • ${g.questions.length} Questions • ${e(g.description||'')}</small></span><span class="status available">${at}/${g.questions.length}</span></button>`}).join('')}</div></section>`:`<section class="panel card"><b>INDEX-ONLY</b><p class="muted">No supplied/imported source module is available for this topic. No fake questions or groups were created.</p><button class="btn primary" onclick="openImport()">📥 ADD THIS TOPIC</button></section>`}</div>`;
  };
  window.renderGroup=function(v,moduleId,groupId){
    const m=moduleById(moduleId),g=m?.groups.find(x=>x.groupId===groupId);if(!m||!g)return renderMaster(v);const subject=subjectForModule(m),branch=branchForModule(m),bc=branch?[[branchTitle(branch),{level:'chapter',subject:'science',chapter:branch}]]:[];
    v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[subjectTitle(subject),{level:'subject',subject}],...bc,[m.topicTitle,{level:'topic',subject,topic:m.topic}],[g.title,{level:'group',moduleId:m.moduleId,groupId:g.groupId}]])}<section class="hero"><h1>📝 ${e(g.title)}</h1><p>${e(m.topicTitle)} → ${e(g.title)} → Questions → Final Test</p><div class="stat-row"><div class="stat"><b>Questions</b><span>${g.questions.length}</span></div><div class="stat"><b>Test Type</b><span>${e(m.testTypeTitle)}</span></div></div><div class="toolbar"><button class="btn primary" onclick='startFinalTest(${JSON.stringify(m.moduleId)},${JSON.stringify(g.groupId)})'>📝 FINAL TEST</button><button class="btn" onclick='go({level:"question",moduleId:${JSON.stringify(m.moduleId)},groupId:${JSON.stringify(g.groupId)},qIndex:0,originalQNo:${JSON.stringify(g.questions[0]?.originalQNo||null)}})'>▶ Practice / Resume</button><button class="btn" onclick='go({level:"topic",subject:${JSON.stringify(subject)},branchId:${JSON.stringify(branch)},topic:${JSON.stringify(m.topic)}})'>← Topic</button></div><div class="palette">${g.questions.map((q,i)=>{const p=progressFor(m,q);return `<button class="pbtn ${p.correct?'correct':p.wrong?'wrong':''}" onclick='go({level:"question",moduleId:${JSON.stringify(m.moduleId)},groupId:${JSON.stringify(g.groupId)},qIndex:${i},originalQNo:${JSON.stringify(q.originalQNo)}})'>${e(q.originalQNo)}</button>`}).join('')}</div></section></div>`;
  };
  /* Global exam bridge: deterministic, local, and compatible with existing user-data schema. */
  window.answerQuestion=function(m,q,value,mode){

    }
    const correct=String(q.answer||'').toUpperCase()===String(value).toUpperCase(),old=progressFor(m,q),patch={attempts:(old.attempts||0)+1,lastAnswer:value,lastAttempt:new Date().toISOString()};
    if(correct)patch.correct=(old.correct||0)+1;else{patch.wrong=(old.wrong||0)+1;user.mistakes[qkey(m,q)]={originalQNo:q.originalQNo,question:q.html,userAnswer:value,correctAnswer:q.answer,subject:m.subject,topic:m.topic,group:window.__activeQuestion?.g?.groupId||''};}
    setProgress(m,q,patch);if(typeof window.computeMastery==='function')window.computeMastery(m,q);save();if(typeof window.showFeedback==='function')window.showFeedback(m,q,value,false);
  };
  window.submitExam=function(){
    const a=window.__activeQuestion;if(!a)return;
    user.examSessions=user.examSessions||{};user.examResults=user.examResults||{};
    const key=a.m.moduleId+'::'+a.g.groupId;const session=user.examSessions[key]||(user.examSessions[key]={startedAt:Date.now(),answers:{},submitted:false});if(session.submitted)return;
    const qs=a.g.questions,total=qs.length;let correct=0,wrong=0,unattempted=0;
    qs.forEach(q=>{const ans=session.answers?.[q.originalQNo];if(!ans){unattempted++;return}if(String(ans).toUpperCase()===String(q.answer||'').toUpperCase())correct++;else wrong++;});
    qs.forEach(q=>{const ans=session.answers?.[q.originalQNo];if(!ans)return;const ok=String(ans).toUpperCase()===String(q.answer||'').toUpperCase(),old=progressFor(a.m,q),patch={attempts:(old.attempts||0)+1,lastAnswer:ans,lastAttempt:new Date().toISOString()};if(ok)patch.correct=(old.correct||0)+1;else{patch.wrong=(old.wrong||0)+1;user.mistakes[qkey(a.m,q)]={originalQNo:q.originalQNo,question:q.html,userAnswer:ans,correctAnswer:q.answer,subject:a.m.subject,topic:a.m.topic,group:a.g.groupId};}setProgress(a.m,q,patch);if(typeof window.computeMastery==='function')window.computeMastery(a.m,q);});
    session.submitted=true;session.submittedAt=Date.now();const result={score:correct,total,correct,wrong,unattempted,accuracy:total?Math.round(correct*10000/total)/100:0,submittedAt:session.submittedAt};user.examResults[key]=result;save();
    sheet('<button class="sheet-close" onclick="closeSheet()">×</button><h3>📝 Exam Result</h3><div class="exam-result"><b>Score:</b> '+correct+'/'+total+'<br><b>Correct:</b> '+correct+'<br><b>Wrong:</b> '+wrong+'<br><b>Unattempted:</b> '+unattempted+'<br><b>Accuracy:</b> '+result.accuracy+'%</div><button class="btn primary" onclick="closeSheet()">Close</button>');
  };

  /* Global question renderer bridge: keeps the existing question UI and 3 hard locks stable. */
  window.__renderQuestionV6=function(v,moduleId,groupId,qIndex){
    const m=moduleById(moduleId),g=m?.groups?.find(x=>x.groupId===groupId);if(!m||!g)return renderMaster(v);
    qIndex=Math.max(0,Math.min(Number(qIndex)||0,g.questions.length-1));const q=g.questions[qIndex];
    const practice=!!user.settings.practice,bm=!!user.bookmarks[qkey(m,q)],rv=!!user.revision[qkey(m,q)],tags=user.tags[qkey(m,q)]||[];
    user.last={moduleId:m.moduleId,q:q.originalQNo};save();
    const subject=subjectForModule(m),branch=branchForModule(m),bc=branch?[[branchTitle(branch),{level:'chapter',subject:'science',chapter:branch}]]:[];
    const html=injectAnswerState(q.html,m,q,practice?'practice':'exam');
    v.innerHTML=`<div class="page">${crumbs([['Master',{level:'master'}],['All PYQ Questions',{level:'all'}],[subjectTitle(subject),{level:'subject',subject}],...bc,[m.topicTitle,{level:'topic',subject,topic:m.topic}],[m.testTypeTitle,{level:'test',moduleId:m.moduleId}],[g.title,{level:'group',moduleId:m.moduleId,groupId:g.groupId}],['Q'+q.originalQNo,{level:'question',moduleId:m.moduleId,groupId:g.groupId,qIndex,originalQNo:q.originalQNo}]])}<section class="question-shell">${practice?'':'<div class="exam-bar" data-lock-zone="final-submit"><span>📝 EXAM MODE</span><span class="exam-timer">TEST STATUS</span><button class="btn danger" onclick="submitExam()">Final Submit</button></div>'}<div class="qtop"><span class="qnum">Q.${e(q.originalQNo)}</span><span class="qmeta">${e(m.topicTitle)} • ${qIndex+1}/${g.questions.length} • ${practice?'PRACTICE':'EXAM'}</span></div><div id="questionMount" class="question-source">${html}</div><div id="feedback"></div><div class="question-actions" data-action-area="permanent-question-tools"><button class="${bm?'marked':''}" onclick="toggleMeta('bookmark')">⭐ ${bm?'Bookmarked':'Bookmark'}</button><button class="${rv?'marked':''}" onclick="toggleMeta('revision')">🧠 ${rv?'In Revision':'Add Revision'}</button><button onclick="addNote()">📝 Note</button><button onclick="addFolder()">📁 Folder</button><button onclick="toggleMeta('doubt')">❓ Doubt</button><button onclick="openTagEditor()">🏷 Tags ${tags.length?'('+tags.length+')':''}</button><button onclick="showProcessReport()">📊 Process Report</button></div><div class="qnav" data-lock-zone="previous-next"><button ${qIndex===0?'disabled':''} onclick='go({level:"question",moduleId:${JSON.stringify(m.moduleId)},groupId:${JSON.stringify(g.groupId)},qIndex:${qIndex-1},originalQNo:${JSON.stringify(g.questions[Math.max(0,qIndex-1)]?.originalQNo||null)}})'>← Previous</button><span class="counter">Q.${q.originalQNo} / ${g.questions.length} • ${m.testTypeTitle}</span><button class="next" ${qIndex===g.questions.length-1?'disabled':''} onclick='go({level:"question",moduleId:${JSON.stringify(m.moduleId)},groupId:${JSON.stringify(g.groupId)},qIndex:${qIndex+1},originalQNo:${JSON.stringify(g.questions[Math.min(g.questions.length-1,qIndex+1)]?.originalQNo||null)}})'>Next →</button></div></section></div>`;
    window.__activeQuestion={m,g,q,qIndex};
    document.querySelectorAll('#questionMount input[type=radio]').forEach(inp=>inp.addEventListener('change',()=>window.answerQuestion(m,q,inp.value,practice?'practice':'exam')));
    const p=progressFor(m,q);if(p.lastAnswer&&practice&&typeof window.showFeedback==='function')window.showFeedback(m,q,p.lastAnswer,true);
  };

  function integrity(){const M=new Set(),G=new Set(),Q=new Set();for(const m of mods()){if(M.has(m.moduleId))throw Error('Duplicate moduleId '+m.moduleId);M.add(m.moduleId);const s=subjectForModule(m);if(!reg()[s])throw Error('Missing subject '+s);for(const g of m.groups){if(G.has(g.groupId))throw Error('Duplicate groupId '+g.groupId);G.add(g.groupId);let last=-Infinity;for(const q of g.questions){const k=m.moduleId+'::'+q.originalQNo;if(Q.has(k))throw Error('Duplicate question '+k);Q.add(k);if(Number(q.sourceOrder)<last)throw Error('Question order violation '+k);last=Number(q.sourceOrder)}}}return{modules:M.size,groups:G.size,questions:Q.size}}
  try{window.__V6_HIERARCHY_INTEGRITY__=integrity();window.__V6_HIERARCHY_INTEGRITY_ERROR__='';}catch(err){window.__V6_HIERARCHY_INTEGRITY__={modules:0,groups:0,questions:0};window.__V6_HIERARCHY_INTEGRITY_ERROR__=String(err?.message||err);console.error(err)}
  document.querySelectorAll('.drawer-btn[data-route="subject"]').forEach(b=>b.remove());

<script id="master-final-immersive-renderer-v3">
/* ============================================================
   FINAL IMMERSIVE TEST/EXAM RENDERER V3
   Loaded AFTER all legacy/canonical compatibility layers so the
   active Test/Exam route cannot fall back to the old white UI.
   ============================================================ */
(function(){
  'use strict';

  function itSession(m,g){
    user.examSessions=user.examSessions||{};
    const key=m.moduleId+'::'+g.groupId;
    let x=user.examSessions[key];
    if(!x || x.submitted){
      x={
        startedAt:Date.now(),
        lastTick:Date.now(),
        duration:Math.max(1,Number(user.settings.examDuration)||30)*60000,
        answers:{},
        times:{},
        submitted:false
      };
      user.examSessions[key]=x;
      save();
    }
    return x;
  }
  function itStop(){
    if(window.__masterExamTimer){clearInterval(window.__masterExamTimer);window.__masterExamTimer=null}
    if(window.__immersiveTestTimer){clearInterval(window.__immersiveTestTimer);window.__immersiveTestTimer=null}
  }
  function itFmt(ms){
    ms=Math.max(0,Math.floor(ms/1000));
    return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0');
  }
  function itTick(m,g,q){
    const s=itSession(m,g),now=Date.now();
    const prev=Number(s.lastTick||now);
    s.times[q.originalQNo]=(Number(s.times[q.originalQNo]||0)+Math.max(0,now-prev));
    s.lastTick=now;
  }
  function itRender(v,moduleId,groupId,qIndex){
    const m=moduleById(moduleId),g=m?.groups?.find(x=>x.groupId===groupId);
    if(!m||!g){return renderMaster(v)}
    qIndex=Math.max(0,Math.min(Number(qIndex)||0,g.questions.length-1));

    const q=g.questions[qIndex];
    const exam=!user.settings.practice;
    user.last={moduleId:m.moduleId,q:q.originalQNo};
    save();
    itStop();

    const key=m.moduleId+'::'+g.groupId;
    const s=exam?itSession(m,g):null;
    const totalDuration=exam?Number(s.duration):0;
    const remaining=exam?Math.max(0,totalDuration-(Date.now()-Number(s.startedAt||Date.now()))):0;
    const pct=exam&&totalDuration?Math.max(0,Math.min(100,remaining/totalDuration*100)):100;
    const bm=!!user.bookmarks[qkey(m,q)];
    const rv=!!user.revision[qkey(m,q)];

    const dots=g.questions.map((x,i)=>{
      const answered=exam?!!(s.answers&&s.answers[x.originalQNo]):!!progressFor(m,x).lastAnswer;
      return '<button type="button" class="question-dot '+(i===qIndex?'current ':'')+(answered?'answered':'')+'" data-it-qindex="'+i+'">'+esc(x.originalQNo)+'</button>';
    }).join('');

    const html=injectAnswerState(q.html,m,q,exam?'exam':'practice');

    v.innerHTML=
      '<div class="page immersive-test-exam '+(exam?'mode-exam':'mode-test')+'" id="immersiveTestRoot">'+
        '<section class="immersive-header">'+
          '<div class="timer-block">'+
            '<div class="timer-ring" id="immersiveTimerRing" style="--timer-pct:'+pct+'%"><span></span></div>'+
            '<div><div class="time-main" id="immersiveTime">'+(exam?itFmt(remaining):'00:00')+'</div></div>'+
          '</div>'+
          '<div class="test-title">'+esc(m.topicTitle)+' • '+esc(g.title)+'</div>'+
          '<div class="header-actions">'+
            '<button type="button" class="immersive-btn language-btn" aria-label="Language toggle" onclick="toggleImmersiveLanguage()">EN/अ</button>'+
            (!exam?'<button type="button" class="immersive-btn exit-test-btn" aria-label="Exit Test Mode" onclick="exitImmersiveToHome()">EXIT</button>':'')+
            '<button type="button" class="immersive-btn danger" onclick="'+(exam?'submitExam()':'finishImmersiveTest()')+'">SUBMIT</button>'+
          '</div>'+
        '</section>'+
        '<div class="question-strip" aria-label="Question navigation">'+dots+'</div>'+
        '<div class="status-bar">'+
          '<span class="status-pill" id="immersiveQuestionTimer">'+(exam?'00:00':'00:00')+'</span>'+
          '<span class="status-spacer"></span>'+
          '<span class="status-pill warning" id="immersiveStatus">warning</span>'+
          '<button type="button" aria-label="Bookmark" class="immersive-btn '+(bm?'marked':'')+'" data-it-bookmark="1">Bookmark</button>'+
        '</div>'+
        '<section class="immersive-question-card">'+
          '<div class="it-qmeta-row"><span class="it-qbadge">Q.'+esc(q.originalQNo)+'</span><span>'+esc(m.topicTitle)+' • '+(qIndex+1)+'/'+g.questions.length+' • '+(exam?'EXAM':'TEST')+'</span></div>'+
          '<div id="questionMount" class="question-source">'+html+'</div>'+
          '<div id="feedback" class="immersive-feedback"></div>'+
          '<div class="question-actions">'+
            '<button class="'+(rv?'marked':'')+'" onclick="toggleMeta(\'revision\')">Revision</button>'+
            '<button onclick="addNote()">Note</button>'+
            '<button onclick="addFolder()">Folder</button>'+
            '<button onclick="toggleMeta(\'doubt\')">Doubt</button>'+
          '</div>'+
        '</section>'+
        '<div class="immersive-bottom">'+
          '<button type="button" class="bottom-btn" '+(qIndex===0?'disabled':'')+' data-it-prev="1">Previous</button>'+
          '<span class="bottom-counter">Q.'+esc(q.originalQNo)+' / '+g.questions.length+'</span>'+
          '<button type="button" class="bottom-btn bottom-next" data-it-next="1">'+(qIndex===g.questions.length-1?'Submit':'Next')+'</button>'+
        '</div>'+
      '</div>';

    window.__activeQuestion={m,g,q,qIndex};
    document.querySelectorAll('[data-it-qindex]').forEach(btn=>btn.addEventListener('click',()=>go({level:'question',moduleId:m.moduleId,groupId:g.groupId,qIndex:Number(btn.dataset.itQindex)})));
    const prev=document.querySelector('[data-it-prev]');
    if(prev)prev.addEventListener('click',()=>{if(qIndex>0)go({level:'question',moduleId:m.moduleId,groupId:g.groupId,qIndex:qIndex-1})});
    const next=document.querySelector('[data-it-next]');
    if(next)next.addEventListener('click',()=>{if(qIndex<g.questions.length-1)go({level:'question',moduleId:m.moduleId,groupId:g.groupId,qIndex:qIndex+1});else if(exam)submitExam();else finishImmersiveTest()});
    const bmBtn=document.querySelector('[data-it-bookmark]');
    if(bmBtn)bmBtn.addEventListener('click',()=>{const k=qkey(m,q);user.bookmarks[k]=!user.bookmarks[k];save();itRender(document.getElementById('view'),m.moduleId,g.groupId,qIndex)});
    window.__immersiveTestQuestionStarted=Date.now();

    if(exam){
      window.__masterExamTimer=setInterval(()=>{
        const a=window.__activeQuestion;
        if(!a){itStop();return}
        itTick(a.m,a.g,a.q);
        const ss=itSession(a.m,a.g);
        const left=Math.max(0,Number(ss.duration)-(Date.now()-Number(ss.startedAt||Date.now())));
        const t=document.getElementById('immersiveTime');
        const r=document.getElementById('immersiveTimerRing');
        if(t)t.textContent=itFmt(left);
        if(r)r.style.setProperty('--timer-pct',Math.max(0,Math.min(100,left/Number(ss.duration)*100))+'%');
        const qt=document.getElementById('immersiveQuestionTimer');
        if(qt)qt.textContent=itFmt(Number(ss.times[a.q.originalQNo]||0));
        if(left<=0){itStop();submitExam()}
      },1000);
    }else{
      window.__immersiveTestTimer=setInterval(()=>{
        const qt=document.getElementById('immersiveQuestionTimer');
        if(qt)qt.textContent=itFmt(Date.now()-window.__immersiveTestQuestionStarted);
      },1000);
    }

    document.querySelectorAll('#questionMount input[type=radio]').forEach(inp=>{
      inp.addEventListener('change',()=>{
        answerQuestion(m,q,inp.value,exam?'exam':'practice');
        document.querySelectorAll('.question-dot').forEach((d,i)=>{if(i===qIndex)d.classList.add('answered')});
      });
    });

    if(exam && s.answers && s.answers[q.originalQNo]){
      const wanted=String(s.answers[q.originalQNo]);
      const inputs=document.querySelectorAll('#questionMount input[type=radio]');
      inputs.forEach(inp=>{if(String(inp.value).toUpperCase()===wanted.toUpperCase())inp.checked=true});
    }
  }

  window.toggleImmersiveLanguage=function(){
    const root=document.getElementById('immersiveTestRoot');
    if(!root)return;
    root.classList.toggle('lang-en');
    if(root.classList.contains('lang-en'))root.classList.remove('lang-hi');
  };

  /* MASTER TEST MODE EXIT-TO-HOME PATCH v1 — isolated additive patch. */
  window.exitImmersiveToHome=function(){
    const a=window.__activeQuestion;
    if(!a || user.settings.practice!==true)return;
    if(!window.confirm('Exit Test Mode and return to Master Home? Your current test will not be submitted.'))return;
    itStop();
    window.__activeQuestion=null;
    window.__immersiveTestQuestionStarted=null;
    document.body.classList.remove('immersive-active');
    go({level:'master'},true);
  };

  window.finishImmersiveTest=function(){
    const a=window.__activeQuestion;
    itStop();
    if(a)go({level:'group',moduleId:a.m.moduleId,groupId:a.g.groupId});
  };

  window.__renderQuestionV6=itRender;
  window.renderQuestion=itRender;
  document.body.classList.add('immersive-active');
  if(!window.__immersiveGoWrapped){
    const __originalGo=window.go;
    window.go=function(route,replace){
      if(route?.level==='question')document.body.classList.add('immersive-active');
      else document.body.classList.remove('immersive-active');
      return __originalGo(route,replace);
    };
    window.__immersiveGoWrapped=true;
  }

  /* If the page is already on a question route, immediately replace the
     legacy renderer with the locked immersive renderer. */
  if(window.R?.current?.level==='question'){
    itRender(document.getElementById('view'),R.current.moduleId,R.current.groupId,R.current.qIndex||0);
  }
})();
</script>

<script id="master-test-portion-e2e-v1">
/* MASTER TEST PORTION — END-TO-END FUNCTIONAL PATCH V1 */
(function(){

    key:(m,g)=>'TEST::'+m.moduleId+'::'+g.groupId,

        s={sessionId:k+'::'+Date.now()+'::'+Math.random().toString(36).slice(2),moduleId:m.moduleId,groupId:g.groupId,startedAt:Date.now(),lastTick:Date.now(),duration:Math.max(1,Number(user.settings.testDuration||user.settings.examDuration)||30)*60000,answers:{},marked:{},times:{},submitted:false,submittedAt:null};

    snapshot:(m,g,s)=>JSON.parse(JSON.stringify({sessionId:s.sessionId,moduleId:m.moduleId,groupId:g.groupId,startedAt:s.startedAt,duration:s.duration,answers:s.answers,marked:s.marked,times:s.times,submittedAt:s.submittedAt,questionIds:g.questions.map(q=>q.originalQNo),questionOrder:g.questions.map(q=>q.originalQNo)}))
  };
  function esc2(x){return typeof esc==='function'?esc(x):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function mGroup(route){const m=moduleById(route.moduleId),g=m?.groups?.find(x=>x.groupId===route.groupId);return {m,g}}

    const c=$('#testAgree'),b=$('#agreeContinue'); c.onchange=()=>b.disabled=!c.checked; b.onclick=()=>{if(!c.checked)return; const s=TEST.get(m,g); s.startedAt=Date.now();s.lastTick=s.startedAt;s.submitted=false;s.submittedAt=null;save();go({level:'question',moduleId,groupId,qIndex:0,testSession:true},true)};

  function renderTestQuestion(v,moduleId,groupId,qIndex){
    const {m,g}=mGroup({moduleId,groupId}); if(!m||!g)return renderMaster(v);
    qIndex=Math.max(0,Math.min(Number(qIndex)||0,g.questions.length-1)); const q=g.questions[qIndex];

    v.innerHTML=`<div class="page immersive-test-exam mode-test" id="immersiveTestRoot"><section class="immersive-header"><div class="timer-block"><div class="timer-ring" id="immersiveTimerRing"><span></span></div><div><div class="time-main" id="immersiveTime">${fmtTime(remaining)}</div><span class="time-label">TIME LEFT</span></div></div><div class="test-title">${esc2(m.topicTitle)} • ${esc2(g.title)}<small>TEST MODE • Q.${esc2(q.originalQNo)}</small></div><div class="header-actions"><button type="button" class="immersive-btn language-btn" onclick="toggleImmersiveLanguage()">EN/अ</button><button type="button" class="immersive-btn" id="testMenu">MENU</button><button type="button" class="immersive-btn danger" id="testSubmitTop">SUBMIT</button><button type="button" class="immersive-btn exit-test-btn" id="testExit">EXIT</button></div></section><div class="question-strip" aria-label="Question navigation">${dots}</div><div class="status-bar"><span class="status-pill" id="immersiveQuestionTimer">Q-TIME 00:00</span><span class="status-spacer"></span><span class="status-pill" id="immersiveStatus">${Object.keys(s.answers||{}).length}/${g.questions.length} answered</span><button type="button" class="immersive-btn ${marked?'marked':''}" id="testMark">${marked?'★':'☆'}</button></div><section class="immersive-question-card"><div class="it-qmeta-row"><span class="it-qbadge">Q.${esc2(q.originalQNo)}</span><span>${qIndex+1}/${g.questions.length} • TEST</span></div><div id="questionMount" class="question-source">${html}</div><div id="feedback" class="immersive-feedback"></div></section><div class="immersive-bottom"><button type="button" class="bottom-btn" id="testPrev" ${qIndex===0?'disabled':''}>Previous</button><span class="bottom-counter">Q.${esc2(q.originalQNo)} / ${g.questions.length}</span><button type="button" class="bottom-btn bottom-next" id="testNext">${qIndex===g.questions.length-1?'Submit':'Save & Next'}</button></div></div>`;
    window.__activeQuestion={m,g,q,qIndex,testMode:true}; document.body.classList.add('immersive-active');
    if(ans){document.querySelectorAll('#questionMount input[type=radio]').forEach(x=>{x.checked=String(x.value).toUpperCase()===ans.toUpperCase()})}
    document.querySelectorAll('#questionMount input[type=radio]').forEach(inp=>inp.addEventListener('change',()=>{const ss=TEST.get(m,g);ss.answers[q.originalQNo]=String(inp.value).toUpperCase();ss.lastTick=Date.now();save();updateTestStatus(m,g)}));
    document.querySelectorAll('[data-test-q]').forEach(btn=>btn.addEventListener('click',()=>go({level:'question',moduleId,groupId,qIndex:Number(btn.dataset.testQ),testSession:true})));
    $('#testPrev').onclick=()=>{if(qIndex>0)go({level:'question',moduleId,groupId,qIndex:qIndex-1,testSession:true})};
    $('#testNext').onclick=()=>{if(qIndex<g.questions.length-1)go({level:'question',moduleId,groupId,qIndex:qIndex+1,testSession:true});else requestTestSubmit()};
    $('#testSubmitTop').onclick=requestTestSubmit;
    $('#testExit').onclick=requestTestExit;
    $('#testMenu').onclick=()=>openDrawer();
    $('#testMark').onclick=()=>{const ss=TEST.get(m,g);ss.marked[q.originalQNo]=!ss.marked[q.originalQNo];save();renderTestQuestion(v,moduleId,groupId,qIndex)};
    window.__immersiveTestQuestionStarted=Date.now();
    window.__masterTestTimer=setInterval(()=>{const ss=TEST.get(m,g);TEST.tick(ss,q);const left=TEST.remaining(ss);const t=$('#immersiveTime');if(t)t.textContent=fmtTime(left);const ring=$('#immersiveTimerRing');if(ring)ring.style.setProperty('--timer-pct',Math.max(0,Math.min(100,left/ss.duration*100))+'%');const qt=$('#immersiveQuestionTimer');if(qt)qt.textContent='Q-TIME '+fmtTime(Number(ss.times[q.originalQNo]||0));if(left<=0){TEST.stop();submitTest(true)}},1000);
  }
  function updateTestStatus(m,g){const s=TEST.get(m,g),el=$('#immersiveStatus');if(el)el.textContent=Object.keys(s.answers||{}).length+'/'+g.questions.length+' answered'}

  function requestTestExit(){
    const a=active(); if(!a?.testMode)return;
    sheet('<button class="sheet-close" onclick="closeSheet()">×</button><h3>🚪 Exit Test Mode?</h3><p>This test will <b>NOT</b> be submitted. Current answers and marks will be discarded for this active session.</p><div class="toolbar"><button class="btn" onclick="closeSheet()">CONTINUE TEST</button><button class="btn danger" onclick="confirmTestExit()">EXIT TO MASTER HOME</button></div>');
  }
  window.confirmTestExit=function(){const a=active();if(!a?.testMode)return;TEST.stop();const k=TEST.key(a.m,a.g);delete user.testSessions[k];save();clearActive();closeSheet();go({level:'master'},true)};
  function testSummary(m,g,s){const qs=g.questions;let attempted=0,correct=0,wrong=0,unattempted=0,marked=0,totalTime=0;qs.forEach(q=>{const ans=s.answers[q.originalQNo];if(ans)attempted++;else unattempted++;if(ans&&String(ans).toUpperCase()===String(q.answer).toUpperCase())correct++;else if(ans)wrong++;if(s.marked[q.originalQNo])marked++;totalTime+=Number(s.times[q.originalQNo]||0)});const score=correct;const max=qs.length;const accuracy=attempted?(correct/attempted)*100:0;const percentage=max?(score/max)*100:0;const timeTaken=Math.max(0,Date.now()-s.startedAt);const timeLeft=Math.max(0,s.duration-timeTaken);const speed=timeTaken>0?attempted/(timeTaken/60000):0;return {totalQuestions:qs.length,attempted,correct,wrong,unattempted,marked,score,maximumMarks:max,accuracy,percentage,timeTaken,timeLeft,speed,submittedAt:s.submittedAt}}
  function requestTestSubmit(){
    const a=active();if(!a?.testMode)return;const s=TEST.get(a.m,a.g);TEST.tick(s,a.q);const z=testSummary(a.m,a.g,s);sheet(`<button class="sheet-close" onclick="closeSheet()">×</button><h3>📤 Submit Test?</h3><div class="stat-row"><div class="stat"><b>Time Left</b><span>${fmtTime(z.timeLeft)}</span></div><div class="stat"><b>Attempted</b><span>${z.attempted}</span></div><div class="stat"><b>Unattempted</b><span>${z.unattempted}</span></div><div class="stat"><b>Marked</b><span>${z.marked}</span></div></div><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" onclick="submitTest(false)">YES, SUBMIT</button></div>`)
  }
  window.submitTest=function(auto){const a=active();if(!a?.testMode)return;const s=TEST.get(a.m,a.g);if(s.submitted)return;s.submitted=true;s.submittedAt=Date.now();TEST.tick(s,a.q);const snap=TEST.snapshot(a.m,a.g,s);const z=testSummary(a.m,a.g,s);const key=TEST.key(a.m,a.g);user.testAttempts[snap.sessionId]=snap;user.testResults[key]={...z,snapshotId:snap.sessionId,questionOrder:snap.questionOrder,questionIds:snap.questionIds,answers:{...snap.answers},marked:{...snap.marked},times:{...snap.times}};save();TEST.stop();clearActive();closeSheet();go({level:'testResult',moduleId:a.m.moduleId,groupId:a.g.groupId},true)};

  function renderTestResult(v,moduleId,groupId){const {m,g}=mGroup({moduleId,groupId});const r=resultFor(m,g);if(!r)return renderTestInstructions(v,moduleId,groupId);v.innerHTML=`<div class="page">${testCrumbs(m,g,'Test Result')}<section class="hero"><h1>📊 Test Result</h1><p>${esc2(m.topicTitle)} • ${esc2(g.title)}</p><div class="stat-row">${[['Total Questions',r.totalQuestions],['Attempted',r.attempted],['Correct',r.correct],['Wrong',r.wrong],['Unattempted',r.unattempted],['Score',r.score],['Maximum Marks',r.maximumMarks],['Accuracy',r.accuracy.toFixed(2)+'%'],['Percentage',r.percentage.toFixed(2)+'%'],['Time Taken',fmtTime(r.timeTaken)],['Time Left',fmtTime(r.timeLeft)],['Speed',r.speed.toFixed(2)+' Q/min']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></section><section class="panel card"><div class="toolbar"><button class="btn primary" onclick='go({level:"testAnalysis",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)})'>Question Analysis</button><button class="btn" onclick='go({level:"testSolutions",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)},qIndex:0})'>Solutions</button><button class="btn" onclick='go({level:"testReview",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)},qIndex:0})'>Review</button><button class="btn" onclick='go({level:"testRevision",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)},category:"wrong"})'>Revision</button><button class="btn" onclick='go({level:"master"},true)'>Back to Master</button></div></section></div>`}
  function submittedData(moduleId,groupId){const m=moduleById(moduleId),g=m?.groups?.find(x=>x.groupId===groupId),r=m&&g?resultFor(m,g):null;if(!m||!g||!r)return null;return {m,g,r}}
  function analysisRows(m,g,r){return g.questions.map((q,i)=>{const ans=r.answers[q.originalQNo]||'';const state=!ans?'UNATTEMPTED':String(ans).toUpperCase()===String(q.answer).toUpperCase()?'CORRECT':'WRONG';return `<tr><td>${i+1}</td><td>Q.${esc2(q.originalQNo)}</td><td>${ans||'—'}</td><td>${esc2(q.answer||'—')}</td><td class="${state==='CORRECT'?'report-ok':state==='WRONG'?'report-review':''}">${state}</td></tr>`}).join('')}
  function renderAnalysis(v,moduleId,groupId){const d=submittedData(moduleId,groupId);if(!d)return renderMaster(v);const {m,g,r}=d;v.innerHTML=`<div class="page">${testCrumbs(m,g,'Question Analysis')}<section class="hero"><h1>🔎 Question Analysis</h1><p>Submitted snapshot • original order preserved</p><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Question</th><th>User Answer</th><th>Correct Answer</th><th>State</th></tr></thead><tbody>${analysisRows(m,g,r)}</tbody></table></div></section><section class="panel card"><button class="btn primary" onclick='go({level:"testResult",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)})'>← Result</button></section></div>`}

  function renderReview(v,moduleId,groupId,qIndex){const d=submittedData(moduleId,groupId);if(!d)return renderMaster(v);const {m,g,r}=d;qIndex=Math.max(0,Math.min(Number(qIndex)||0,g.questions.length-1));const q=g.questions[qIndex],ans=r.answers[q.originalQNo]||'';v.innerHTML=`<div class="page">${testCrumbs(m,g,'Review')}<section class="question-shell"><div class="qtop"><span class="qnum">Q.${esc2(q.originalQNo)}</span><span class="qmeta">READ ONLY • ${qIndex+1}/${g.questions.length}</span></div><div class="question-source">${q.html}</div><div class="feedback ${!ans?'pending':String(ans).toUpperCase()===String(q.answer).toUpperCase()?'good':'bad'}">${!ans?'UNATTEMPTED':String(ans).toUpperCase()===String(q.answer).toUpperCase()?'✅ CORRECT':'❌ WRONG'} • User Answer: ${esc2(ans||'—')} • Correct: ${esc2(q.answer||'—')}</div><div class="qnav"><button ${qIndex===0?'disabled':''} onclick='go({level:"testReview",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)},qIndex:${qIndex-1}})'>Previous</button><span class="counter">Q.${esc2(q.originalQNo)} / ${g.questions.length}</span><button class="next" ${qIndex===g.questions.length-1?'disabled':''} onclick='go({level:"testReview",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)},qIndex:${qIndex+1}})'>Next</button></div></section><section class="panel card"><button class="btn primary" onclick='go({level:"testResult",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)})'>← Result</button></section></div>`}
  function renderRevision(v,moduleId,groupId,category){const d=submittedData(moduleId,groupId);if(!d)return renderMaster(v);const {m,g,r}=d;const cats={wrong:q=>{const a=r.answers[q.originalQNo];return !!a&&String(a).toUpperCase()!==String(q.answer).toUpperCase()},unattempted:q=>!r.answers[q.originalQNo],marked:q=>!!r.marked[q.originalQNo]};const cat=cats[category]||cats.wrong;const qs=g.questions.filter(cat);v.innerHTML=`<div class="page">${testCrumbs(m,g,'Revision')}<section class="hero"><h1>🧠 Revision — ${esc2(category||'wrong').toUpperCase()}</h1><p>${qs.length} revision question(s) from submitted snapshot.</p></section>${qs.length?`<section class="grid">${qs.map((q,i)=>`<button class="nav-card" onclick='go({level:"testReview",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)},qIndex:${g.questions.indexOf(q)}})'><strong>Q.${esc2(q.originalQNo)}</strong><small>${esc2(category||'wrong')} • Original Question ID preserved</small></button>`).join('')}</section>`:`<section class="panel card"><b>EMPTY REVISION CATEGORY</b><p class="muted">No questions match this revision category.</p></section>`}<section class="panel card"><button class="btn primary" onclick='go({level:"testResult",moduleId:${JSON.stringify(moduleId)},groupId:${JSON.stringify(groupId)})'>← Result</button></section></div>`}

  const oldRender=render;
  render=function(route){
    if(route?.level==='testInstructions'){R.current=route;$('#view').innerHTML='';closeDrawer();closeSheet();$('#topCrumb').textContent='TEST INSTRUCTIONS';renderTestInstructions($('#view'),route.moduleId,route.groupId);return}

    if(route?.level==='testReview'){R.current=route;$('#view').innerHTML='';renderReview($('#view'),route.moduleId,route.groupId,route.qIndex||0);return}
    if(route?.level==='testRevision'){R.current=route;$('#view').innerHTML='';renderRevision($('#view'),route.moduleId,route.groupId,route.category||'wrong');return}
    if(route?.level==='question'&&route?.testSession){R.current=route;$('#view').innerHTML='';renderTestQuestion($('#view'),route.moduleId,route.groupId,route.qIndex||0);return}

  window.requestTestSubmit=requestTestSubmit; window.requestTestExit=requestTestExit;
  window.__MASTER_TEST_PORTION_STATUS__='PATCHED_NOT_YET_RUNTIME_VERIFIED';
})();

<script id="master-universal-module-type-structure-v3">
